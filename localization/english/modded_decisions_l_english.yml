l_english:
 capital_babylon:0 "Move Capital to Babylon"
 capital_babylon_desc:0 "In the past ages the city that conquered the mesopotamia usually became it's capital. But since the great king Hammurabi those ages are behind us. King may live in any place he wishes but the heart of the region and the most important religious sites are in Babylon. The city of Marduk."
 colonize_oea:0 "Colonize Oea"
 colonize_oea_desc:0 "When Carthage began to grow in size and influence it''s leaders started to think about having colonies of their own."