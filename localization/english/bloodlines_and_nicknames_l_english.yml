l_english:
 nobilitas:0 "Nobiles"
 nobilitas_desc:1 "The upper layer of roman society. The ruling families that trace their origins to the city's founding. Acording to one of the theories they come from the members of the king's personal guard (cavalry unit). Notable example are the Brutus family. Acording to roman naming first name is persons personal name, second is the family name (for Brutus we have house of Junia), last name is derived usually from important ancestor and marks a family branch (Brutus)."
 tarquinius:0 "Tarquinius"
 tarquinius_desc:1 "House of Tarquin was a prominent etrurian house that is credited with opening the Rome to the etruscan culture. They supposingly built Circus Maximus and the temple of Jupiter. They also made Rome into the local hegemon. "
 heraclid:0 "Heraclidae"
 heraclid_desc:1 "The member of Heraclidae bloodline. Descendent of a legendary demigod and member of dynasty that conquered the Peloponese during the Bronze Age Collapse. Being the member of Heraclidae gives great prestige in itself. It is said that descendants of Heracles share the strength of their ancestor."