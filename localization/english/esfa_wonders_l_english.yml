l_english:
 wonder_firsttemple:0 "Salomons Temple"
 wonder_firsttemple_desc:0 "Built by king Salomon the temple was the holiest place for the jewish people. Acording to the descriptions temple was built same as egyptian ones with the windowless inner sanctum  called Holy of Holies where the Ark of Covenant was kept (or as in smaller temples in Judah from the period a statue of Yahweh)."
 wonder_isagil_temple:0 "Esagila"
 wonder_isagil_temple_desc:0 "In this temple was the statue of Marduk, surrounded by cult images of the cities that had fallen under the hegemony of the Babylonian Empire from the 18th century BC; there was also a little lake which was named Abzu by the Babylonian priests. This Abzu was a representation of Marduk's father, Enki, who was god of the waters and lived in the Abzu that was the source of all the fresh waters."
 wonder_hanging_gardens:0 "Hanging Gardens of Niniveh"
 wonder_hanging_gardens_desc:0 "The work of ancient engineering intended as a gift to the beloved median wife of assyrian ruler. It became the testimony of strangth and power of the Assyrian Empire. After all a ruler that can afford such a marvel is surely a powerfull one."
 wonder_great_pyramid:0 "Giza Pyramid Complex"
 wonder_great_pyramid_desc:0 "Giza Pyramid Complex was built during the Old Kingdom period two millenia ago. Egyptians believe that as long as a person is remembered, spirit can live in the afterlife and that was the purpose of building pyramids. They served not only as tombs but also as temples where people could pray and make offerings to the deceased pharoh."
 wonder_carthage_harbour:0 "Great Cothon"
 wonder_carthage_harbour_desc:0 "The Great Cothon of Carthage was basicly the artificial, protected inner harbour. Similar structures could be seen in other punic harbours but this one was truly the sight to behold. The special inner docking complex could stroe up to 220 warships! On the island structure, there existed a raised 'cabin' where the admiral in command could observe the whole harbor along with the surrounding sea. "