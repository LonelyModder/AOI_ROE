 #Startup Event Texts
 latium_01_italy_1.1.t:0 "The Dream of Romulus"
 latium_01_italy_1.1.desc:0 "Since the Romos started his jurney to Italia he expected to encounter barbarian tribes but instead he met with the growing civilisation. Latins might be not be numerous but they are disciplined and stong. All they need is a vision. A vision of Italy under the leadership of Latium, with Rome as the capital. "
 latium_01_italy_1.1.a:0 "For Rome and the Latin League!"