l_english:
 #Latium
 latium_01_italy_1.1.t:0 "The Dream of Romulus"
 latium_01_italy_1.1.desc:0 "Since the Romos started his jurney to Italia he expected to encounter barbarian tribes but instead he met with the growing civilisation. Latins might be not be numerous but they are disciplined and stong. All they need is a vision. A vision of Italy under the leadership of Latium, with Rome as the capital. Soon Rome started yearly campaigns to realise that dream."
 latium_01_italy_1.1.a:0 "For Rome and the Latin League!"
 latium_01_italy_1.2.t:0 "The Conflict with Alba Longa"
 latium_01_italy_1.2.desc:0 "Alba Longa enjoyed prestige due to its proximity to the temple of Jupiter. Until the founding of Rome the city was an informal capital of the Latin League. With the sudden rise of competition conflict arose because as all kings learn quickly only one can sit on the throne."
 latium_01_italy_1.2.a:0 "And Rome will be leading the Latins."
 latium_01_italy_1.3.t:0 "Fate of the Rebels"
 latium_01_italy_1.3.desc:0 "The defeated citizens of Alba Longa plead for mercy offering gifts. Some say we need to show others what is the price for defying Rome. And yet if we will crush them who will surender to us knowing what may happen."
 latium_01_italy_1.3.a:0 "They know they are beaten."
 latium_01_italy_1.3.b:0 "We must send a warning!"
 latium_01_italy_1.4.t:0 "Conflict with Veii"
 latium_01_italy_1.4.desc:0 "The etruscan city of Veii was a closest member of the Etruscan League to the Latins. In result the border clashes were constant yet usually the leagues forces prevented the Veii from falling into the Roman hands. Maybe a fiew bribed leaders and sabotaged river crossings can cut Veii from the leagues forces?"
 latium_01_italy_1.4.a:0 "We can take them all."
 latium_01_italy_1.4.b:0 "An intresting suggestion."
 latium_01_italy_1.5.t:0 "Dangerous Rumour"
 latium_01_italy_1.5.desc:0 "There are rumors that roman diplomats bribe members of the league to keep neutrality in the case of the conflict with the city of Veii. We do not know if the rumor is indeed true but the loss of Veii could hit our prestige in the region. This could be used by our enemies as a sign of weakness."
 latium_01_italy_1.5.a:0 "We need to act now."
 latium_01_italy_1.5.b:0 "I'm sure it's only rumor."
 latium_01_italy_1.6.t:0 "The action failed."
 latium_01_italy_1.6.desc:0 "Our spies and diplomats were caught and the support for Veii will still be an issue."
 latium_01_italy_1.6.a:0 "This will only delay inevitable."
 latium_01_italy_1.7.t:0 "The action succeded."
 latium_01_italy_1.7.desc:0 "Our spies made sure there will be no help for Veii this time. With the fall of the city we will gain our first bridgehead in Tuscany. The army gathers as we speak."
 latium_01_italy_1.7.a:0 "Soon rest of Etruria will follow. Forward!"
 latium_01_italy_1.8.t:0 "Veii Captured!"
 latium_01_italy_1.8.desc:0 "Acording to the records romans managed to besiege the city yet they were not able to take it. Veii fell because of the changed in the roman leadership. Furious Camillus ordered his soldiers to dig a tunnel and when the tunnel throu the soft tufa rock on which the city stood. When tunnel was ready romans carried out diversionary attack on walls while the main force entered the city. After the victory camillus decided to spare the Veiians instead looting the city because of bad omen. Now there is an issue. Some senators want him punished for not destroying veii but if it was indeed a bad omen than this will surely anger the gods."
 latium_01_italy_1.8.a:0 "His decision will be costly if the veiians will revolt. Banish him!"
 latium_01_italy_1.8.b:0 "Many soldiers saw him falling from the steps of local temple."
 latium_01_italy_1.9.t:0 "Jupiter's Curse"
 latium_01_italy_1.9.desc:0 "The gods are indeed angry with us. Our scouts informed us that a large host of celts have crossed the Alps and moved into the Po valley. One of the tribes called the Senones is moving even forther and attacked Picenti. Roads are flooded with refugees. The senate already sent word to Camillus to return from the exile."
 latium_01_italy_1.9.a:0 "Let's hope he will reach Rome before the barbarians."
 latium_01_italy_1.10.t:0 "Etruscans on the Throne"
 latium_01_italy_1.10.desc:0 "The Tarquin family arrived in rome during the reign of the current monarch. They have great influence in Etruscan League and are known as great administratrs and builders. Since the office of the king of rome is elective there are suggestion to make the Terquin a king."
 latium_01_italy_1.10.a:0 "Etruscans on the throne! Heresy!"
 latium_01_italy_1.10.b:0 "They can make rome great again."
 latium_01_italy_1.11.t:0 "Capitoline Temple"
 latium_01_italy_1.11.desc:0 "The rise of etruscan influences in the eternal city forced the authorities to undertake a new construction project. Every etruscan city has a grand temple so Rome will not be worse than it's neighbours."
 latium_01_italy_1.11.a:0 "Let's build the temple worthy of Rome."
 latium_01_italy_1.12.t:0 "Capitoline Temple"
 latium_01_italy_1.12.desc:0 "New temple was just finished and first religious festival took place. Gods seem to bless the kings reign."
 latium_01_italy_1.12.a:0 "May he rule long and prosperous."
 latium_01_italy_1.13.t:0 "Republic or Kingdom?"
 latium_01_italy_1.13.desc:0 "Despite the efforts of the ruling dynasty the tensions still rising between the ruling etruscan elite and the local roman one. Lately one of the members of the royal family raped noblewomen Lucrecia which became a final straw for anti-etruscan oposition. Under Brutus the rebels are making ready to overthrow the kings and end the monarchy in rome once and for all. Yet there are still senators that see good in the monarchy."
 latium_01_italy_1.13.a:0 "Stable rule cannot end because of one incident."
 latium_01_italy_1.13.b:0 "The corrupted kings will never rule Rome!"
 latium_01_italy_1.14.t:0 "Threat of Samnium"
 latium_01_italy_1.14.desc:0 "Samnites is a collective term for a confederation of four Oscan tribes from southern Italian mountains. They are quite numerous and militaristic which makes them a threat for their neighbours from the campanian coast. Some of them decided to look to Rome for help and protection. Yet Rome is not charity organization and there will be a price."
 latium_01_italy_1.14.a:0 "But do we want to defend them?"
 latium_01_italy_1.14.b:0 "Of course there will be price. We will fight if they will submit."
 latium_01_italy_1.15.t:0 "The Capuan Delegation"
 latium_01_italy_1.15.desc:0 "Lately the inhabitants of Capua sent a delegation to Rome with plea for help against Samnites. The romans agreed but their demands basicly mean the loss of our independence."
 latium_01_italy_1.15.a:0 "They are a threat just like the Samnites."
 latium_01_italy_1.15.b:0 "We may not have a choice. We need to submit."
 latium_01_italy_1.16.t:0 "Campanians Accept the Terms"
 latium_01_italy_1.16.desc:0 "We just learned that yet another group of campanians accepted the terms of our intervention."
 latium_01_italy_1.16.a:0 "We need to sent our garrisons to keep the Samnites at bay."
 latium_01_italy_1.17.t:0 "Hill Tribes"
 latium_01_italy_1.17.desc:0 "East of Rome, in the center of the Italian peninsula are the Apennine Mountains. There the northern Umbrian tribes and southern Oscans meet. Tribes there are small and numerous and same as Campanians they too are affected by Samnite raids. They will never accept direct submission but maybe there is better solution. Their strangth will surely help us unite the peninsula."
 latium_01_italy_1.17.a:0 "But will they accept the deal?"
 latium_01_italy_1.18.t:0 "Roman Protection"
 latium_01_italy_1.18.desc:0 "Lately Rome managed to take Campania and protect it from Samnite influance. Now they look for a way to force Samnite into submision and they figured out that they will do it by surrounding their lands with their subjects. And they want us to be one of them."
 latium_01_italy_1.18.a:0 "Romans are indeed a rising power."
 latium_01_italy_1.18.b:0 "Our independence is non-negotiable."
 latium_01_italy_1.19.t:0 "Alpine tribe Submits"
 latium_01_italy_1.19.desc:0 "One of the Alpine tribes submitted to Roman outhority. They sent tribute and promised to support our war effort."
 latium_01_italy_1.19.a:0 "Glory to Rome!"
 latium_01_italy_1.20.t:0 "Importance of Campania"
 latium_01_italy_1.20.desc:0 "Acording to the signed treaties Roma has the right to place the garrisons in captureed towns and settlements of Campania. This is a very important region because of it's proximity to roman heartland as well as it being major center of agricultural and industrial trade. We need to make sure it will remain in roman sphere of influence."
 latium_01_italy_1.20.a:0 "Colony in Capua will be enaugh."
 latium_01_italy_1.20.b:0 "Maybe we need additional investments"
 latium_01_italy_1.21.t:0 "Campanian Investment"
 latium_01_italy_1.21.desc:0 "Acording to the treaty we placed a garrison in Capua, the most strategic settlement in tthe region. It consists of war veterans so it should protect our intrest well enaugh."
 latium_01_italy_1.21.a:0 "Maybe we could do more."
 latium_01_italy_1.22.t:0 "Epirus Invades Italy"
 latium_01_italy_1.22.desc:0 "Epirus feeling threatened by the rising power of Rome invaded italy with a sizable host that also includes elephants. Their king already sent messangers to the nearby tribes asking for assistance."
 latium_01_italy_1.22.a:0 "Thats not good."
 latium_01_italy_1.23.t:0 "Epirus Invades Italy"
 latium_01_italy_1.23.desc:0 "Epirote forces invade Italy and thou it's not entirely unexpected contrary to the previous interventions their king brought sizable host and demands submission. It increasingly looks like they are not here to defend us but to conquer us."
 latium_01_italy_1.23.a:0 "We do not need their 'protection'."
 latium_01_italy_1.23.b:0 "We may not have a choice."
 latium_01_italy_1.24.t:0 "Campanian Investment"
 latium_01_italy_1.24.desc:0 "During the administrative works in Campania we not only managed to fulfill the treaty obligation and place garrison in Capua but also in other regional cities and built a road spanning from Rome to Capua called Via Appia. It will shorten our response time and sent a signal that we are here to stay."
 latium_01_italy_1.24.a:0 "Campania will remain roman."
 latium_01_italy_1.25.t:0 "Conquered Samnium"
 latium_01_italy_1.25.desc:0 "For a long time the Samnite tribes were a thorn in roman side. This region needs a firm hand and a lot of investments to make sure it will never become a problem again."
 latium_01_italy_1.25.a:0 "A couple of garrisons will be enaugh."
 latium_01_italy_1.25.b:0 "We need a vast network of veteran colonies in place."
 latium_01_italy_1.26.t:0 "Latin Beneventum"
 latium_01_italy_1.26.desc:0 "Beneventum is now a colony on latin rights and bcause of it's strategic location and sizable population will surely become a flourishing place and an example for locals what obedience can give them."
 latium_01_italy_1.26.a:0 "We could do more than that but this will have to do."
 latium_01_italy_1.27.t:0 "New Colonies"
 latium_01_italy_1.27.desc:0 "A series of new colonies was established in cities like Beneventum and Luceria. Now Samnites will think twice before they will attempt to revolt against us and even if they do these garrisons will give us time to react."
 latium_01_italy_1.27.a:0 "Samnium is ours now and forever!"
 latium_01_italy_1.28.t:0 "Greek South"
 latium_01_italy_1.28.desc:0 "After conflicts with the greeks over Magna Graecia. Rome inherited much more urbanized region with more advanced culture. Yet there was a need for further investments if the Eternal City wanted to maintain their hold over the richer south."
 latium_01_italy_1.28.a:0 "Maybe new latin colony help."
 latium_01_italy_1.28.b:0 "Fiew colonies and new roads will be needed."
 latium_01_italy_1.29.t:0 "Port of Brundisium"
 latium_01_italy_1.29.desc:0 "Brundisium is an important harbour town connecting Italy and Greece. Any army wanting to cross from one to the other will have to capture Brundisium. Thats why this town was chosen as a new colony to pacify the region."
 latium_01_italy_1.29.a:0 "Hopefully it will succede."
 latium_01_italy_1.30.t:0 "Via appia and via popilia"
 latium_01_italy_1.30.desc:0 "The southern italy had a long ties to the greeks from the east and thats why in addition tothe new colonies the seante thought it wise to invest in a new roads so that we will be able to react faster to eventual cossing of the greek foeces fro mthe east."
 latium_01_italy_1.30.a:0 "The south now belongs to Rome."
 latium_01_italy_1.31.t:0 "Umbria and the Alps"
 latium_01_italy_1.31.desc:0 "The Osco-Umbiran tribes closely related to the Latins take their name from the two largest groups and while oscans inhabit the south, umbrians live in the northern Alps. Their home is mainly covered with forest and hills and if rome wishes to keep this province it needs investments like roads and garrisons."
 latium_01_italy_1.31.a:0 "We may not have sufficient founds."
 latium_01_italy_1.31.b:0 "We need those roads."
 latium_01_italy_1.32.t:0 "Colony of Ariminum"
 latium_01_italy_1.32.desc:0 "Ariminum guards the italian peninsula from the incursions from the north and with recent celtic activity the senate recognized the need to put the strong roman garrison there. The city is also important if we will evere wish to expand our influence northward."
 latium_01_italy_1.32.a:0 "Thats an intresting concept."
 latium_01_italy_1.33.t:0 "Umbrian Investments"
 latium_01_italy_1.33.desc:0 "Umbria is a strategic region that is filled with difficult terrain. To solve this issue senate issued construction of two new roads via salaria and via flaminia. In addition new roman garrisons were placed at the strategic locations along the way."
 latium_01_italy_1.33.a:0 "This should finally block Celtic incursions."
 latium_01_italy_1.34.t:0 "Romanizing Etruria"
 latium_01_italy_1.34.desc:0 "Etruria was well developed way before romans even stepped foot there. There was little need for new urban centers so romans focused on tying the intrests of the etruscan city-states with rome like for example by bilateral defense contract with Tarquinii."
 latium_01_italy_1.34.a:0 "The soft approach will suffice."
 latium_01_italy_1.34.b:0 "We can do way more than that for them."
 latium_01_italy_1.35.t:0 "Romano-Etruscan Ties"
 latium_01_italy_1.35.desc:0 "As planned Tarquinii will host permanent roman garrison and other cities signed bilateral defense agreements. Every city was dealt with separately because of etruscan disunity but thi painfull process was worth it."
 latium_01_italy_1.35.a:0 "Etruria is ours!"
 latium_01_italy_1.36.t:0 "Via Aurelia and Via Cassia"
 latium_01_italy_1.36.desc:0 "Rome's new investments in the region included a set of roads like Via Aurelia and Via Cassia. Additionally larger etruscan cities got roman garrisons further cementing their ties with eternal city. With these investments and defense treaties Latium tied their fate with etruria."
 latium_01_italy_1.36.a:0 "And both became one now and forever."
 latium_01_italy_1.37.t:0 "Sybilline Books"
 latium_01_italy_1.37.desc:0 "When we learned that a famous oracle wrote down the future fate of our city we were shocked. Our priesthood demanded from us to acuire the books before anyone else will come up with an idea to buy them. On site the oracle demanded a heavy price for the books. When threatened she took them to the fire and told that we aither pay or she will burn them."
 latium_01_italy_1.37.a:0 "Fine give her the damn money!"
 latium_01_italy_1.37.b:0 "She's bluffing."
 latium_01_italy_1.38.t:0 "Sybilline Books - Further Negotiations"
 latium_01_italy_1.38.desc:0 "That damn woman gone mad. She really burned three sacred objects! Maybe we should treat her more carefully."
 latium_01_italy_1.38.a:0 "Give her what she demanded."
 latium_01_italy_1.38.b:0 "Thats way too expensive for a book!"
 latium_01_italy_1.39.t:0 "Sybilline Books - Aggressive Negotiations"
 latium_01_italy_1.39.desc:0 "She burned three more books without blinking. Damn her!"
 latium_01_italy_1.39.a:0 "Ok we give up. Pay her."
 latium_01_italy_1.39.b:0 "Rome will not be blackmailed!"
 latium_01_italy_1.40.t:0 "Sybilline Books - In Rome"
 latium_01_italy_1.40.desc:0 "After hard negotiations books are finally in the eternal city and priests can be certain that no one inappropriate will look into those scrolls. As a gesture of good will our leader will get a moment with them alone. "
 latium_01_italy_1.40.a:0 "Carpenter that will topple the gods?"
 latium_01_italy_1.40.b:0 "Who's that descendant of Venus."
 latium_01_italy_1.40.c:0 "Why should we beware of the lightning."
 latium_01_italy_1.41.t:0 "Celts Invade Po Valley"
 latium_01_italy_1.41.desc:0 "Caltic tribes including Senones, Boii and Cenomani invade the lower Po valley from their holdings in the north. Seeing the weakness of the Etruscan League they intend to settle the region and push back the etruscan influence."
 latium_01_italy_1.41.a:0 "Thats intresting."
 latium_01_italy_1.42.t:0 "Greeks in Need"
 latium_01_italy_1.42.desc:0 "Greek colonies in Magna Graecia formed a petition in which they ask for protection against a new threat, state called Rome. Traditionally we are their defender and they even proposed to finance the expeditionary forces but somethings wrong. They look scared but they claim that Romans are just another latin tribe."
 latium_01_italy_1.42.a:0 "Whatever they are hiding we are honor bound to aid them."
 latium_01_italy_1.42.b:0 "Maybe that enemy is more powerfull than they claim."
 #Macedon
 macedon_01_macedonia_1.1.t:0 "Macedonian Origins"
 macedon_01_macedonia_1.1.desc:0 "Macedonians due to their proximity to the barbarian lands are often the subject of jokes questioning their Greek origin (which is obviously false since they macedonian is dialect of doric greek). This is precisely how a Macedonian prince was recently treated when he was refused entry to the Olympics because his origins were questioned. This is the time to do sth about it."
 macedon_01_macedonia_1.1.a:0 "Maybe a bit of our own propaganda will do?"
 macedon_01_macedonia_1.2.t:0 "Heirs of Heracles"
 macedon_01_macedonia_1.2.desc:0 "After a deep analysis we decided to use an old macedonian legend claiming that Argead dynasty descends from the legendary Heraclidae, the descendants of the Heracles that centuries ago conquered the Peloponese. This makes our kings automatically relatives of the rulers of Sparta, Argos and Messenia. "
 macedon_01_macedonia_1.2.a:0 "Let's hope it will spread."
 macedon_01_macedonia_1.3.t:0 "New Capital"
 macedon_01_macedonia_1.3.desc:0 "To keep propaganda working we need new capital built in a strictly hellenic fashion. After a debate the settlement of Pella in Lower Macedon was chosen as a new seat of our kings and royal administration."
 macedon_01_macedonia_1.3.a:0 "The place is perfect."
 macedon_01_macedonia_1.4.t:0 "Pella"
 macedon_01_macedonia_1.4.desc:0 "The construction of a new city was a great idea. Thanks to its location on frequently used trade routes, the city will develop rapidly and fulfill all our hopes. Who knows maybe one day it will become the capital of all Greece. "
 macedon_01_macedonia_1.4.a:0 "I hope so."
 macedon_01_macedonia_1.5.t:0 "Upper Macedonians"
 macedon_01_macedonia_1.5.desc:0 "Nominally upper macedonians are part of the Macedonian realm but in reality they often act indepentently from the crown. In Macedon there are two kinds of macedonians. Lower macedonians are what everyone expect of a typical greek to be, meaning the typically settled urban society with laws and norms not that different from the ones in the south. Upper Macedonians are much more similar to barbarians to the north and east. They live in tribal societies and obey the Argead king only when it suits them. To change that we need to deal with the biggest issue in the region. Lack of urban centers."
 macedon_01_macedonia_1.5.a:0 "Let's hope it will succeed."
 macedon_01_macedonia_1.6.t:0 "Urbanisation in the Mountains"
 macedon_01_macedonia_1.6.desc:0 "The administrative reforms and urbanisation process were needed in the western mountains. Now kings of Macedon can more easily administer this inaccessible region. In the new urban centers a city watch units were established and hostages were taken from local aristocracy to enshure their obedience. Upper macedonians themselves got the same rights as the citizens of the lowlands."
 macedon_01_macedonia_1.6.a:0 "Let's welcome them in our realm."
 macedon_01_macedonia_1.7.t:0 "Peonia"
 macedon_01_macedonia_1.7.desc:0 "Peonia was a sizable barbarian kingdom north of Macedon that often raided macedonian borders. As it is often among the barbarians we can use their internal conflict to our advantage. Maybe we even and up with loyal buffer state protecting our northern border."
 macedon_01_macedonia_1.7.a:0 "Peonians will never agree to subjugation."
 macedon_01_macedonia_1.7.b:0 "They will not have another choice."
 macedon_01_macedonia_1.8.t:0 "Outrageous Demands"
 macedon_01_macedonia_1.8.desc:0 "Our macedonian neighbours just sent to us a hidden threat. They offer us the protection from our enemies but in reality it's a deman of subjugation. If we will decline we will most likely have to face them in battle."
 macedon_01_macedonia_1.8.a:0 "We do not bow."
 macedon_01_macedonia_1.8.b:0 "Maybe it will not be as bad as we think?"
 macedon_01_macedonia_1.9.t:0 "Peonia Declines"
 macedon_01_macedonia_1.9.desc:0 "Foolish Peonians declined our generous offer of protection. This might force us to take military action against them."
 macedon_01_macedonia_1.9.a:0 "that's sad news indeed."
 macedon_01_macedonia_1.10.t:0 "Peonia Accepts"
 macedon_01_macedonia_1.10.desc:0 "Peonians decided that they cannot afford to face all their enemies by themselves and accepted our protection. They pledged their allegiance to the Argead kings and wil answear to our call if need be."
 macedon_01_macedonia_1.10.a:0 "than our northern border is secured at last."
 macedon_01_macedonia_1.11.t:0 "Illyrians"
 macedon_01_macedonia_1.11.desc:0 "The fertile lands west of macedon inhabited by Illyrians were a thorn in Macedons side since time immemorial. Especially since the creation of the first larger Illyrian state called Enchelei which means that soon Illyrians may bacome an issue and we need to adress it sooner rather than later. Maybe an ultimatum to a local kings will force them to adress our security concerns."
 macedon_01_macedonia_1.11.a:0 "It's not like they have a choice."
 macedon_01_macedonia_1.12.t:0 "Macedonian Ultimatum"
 macedon_01_macedonia_1.12.desc:0 "Macedonians sent us the ultimatum in which they listed all the raids and crimes we supposingly commited against them. They believe they have position strong enaugh to demand concessions from us."
 macedon_01_macedonia_1.12.a:0 "They are indeed formitable."
 macedon_01_macedonia_1.12.b:0 "This is outrageous!"
 macedon_01_macedonia_1.13.t:0 "Tribe Subdued"
 macedon_01_macedonia_1.13.desc:0 "Another petty king bows before the mighty descendant of Heracles."
 macedon_01_macedonia_1.13.a:0 "As he should."
 macedon_01_macedonia_1.14.t:0 "Tribe Rejects Ultimatum"
 macedon_01_macedonia_1.14.desc:0 "Our generous offer was refused. Soon war will be upon them!"
 macedon_01_macedonia_1.14.a:0 "They will be example for others."
 macedon_01_macedonia_1.15.t:0 "Golden City"
 macedon_01_macedonia_1.15.desc:0 "We currently are in the middle of a process of reforming our country into a proper hellenic state. To do that we need money and the closest gold mine we can get access in Amphipolis. The only issue is that this are is the part of athenian sphere of influence so we may face athens and their local allies. Maybe we may be able to convince the Chalkidian League to deny their ports to the athenians in exchange for teritorial concessions. In the end we may gain another subject for relatively low price."
 macedon_01_macedonia_1.15.a:0 "We can beat them alone."
 macedon_01_macedonia_1.15.b:0 "Maybe diplomatic approach will be better."
 macedon_01_macedonia_1.16.t:0 "Macedonian Proposition"
 macedon_01_macedonia_1.16.desc:0 "Macedonian king came to us with proposition. We will deny access to our ports to his enemies from the south and in turn he will grant us lands on the peninsula taken from the Thracians and other greeks. Additionally he will be serving as our protector. Can we believe his words? His army is large. What can stop him from conquering us?"
 macedon_01_macedonia_1.16.a:0 "we don't really have a choice in the matter."
 macedon_01_macedonia_1.16.b:0 "We can defent ourselves."
 macedon_01_macedonia_1.17.t:0 "League Accepts"
 macedon_01_macedonia_1.17.desc:0 "The Ionians accepted our terms and will close the ports for our enemies. This is great day for both of our nations."
 macedon_01_macedonia_1.17.a:0 "One more into the fold."
 macedon_01_macedonia_1.18.t:0 "League Denies"
 macedon_01_macedonia_1.18.desc:0 "Ionians defied us once again. It looks like they will be the issiue after all."
 macedon_01_macedonia_1.18.a:0 "Just one more foe to vanquish."
 macedon_01_macedonia_1.19.t:0 "Thessalian League"
 macedon_01_macedonia_1.19.desc:0 "For centuries macedonians feared the thessalians. They were their closest greek neighbour and they stood on higher civilisation lever than macedonians. Yet they had same fault as most of greeks. They had a democracy and in democracy there are factions and internal divisions. We can use one to our advantage."
 macedon_01_macedonia_1.19.a:0 "Maybe fiew bribes will work."
 macedon_01_macedonia_1.19.b:0 "We do not need traitors to win."
 macedon_01_macedonia_1.20.t:0 "Thracian Wars"
 macedon_01_macedonia_1.20.desc:0 "Thracians were numerous and spread over a large area. This in compination with the unification efforts made by the Odryssian tribe makes them a threat that needs to be dealt with as soon as possible. Otherwise they can use their numerical advantage to conquer Greece while it still lacks unity."
 macedon_01_macedonia_1.20.a:0 "They are no match for us"
 macedon_01_macedonia_1.21.t:0 "Sacred Wars"
 macedon_01_macedonia_1.21.desc:0 "Aparently the Temple of Delphi was sacked and their treasures stolen. This sacrelige caused the series of holy wars in central Hellas. We could use this and take up a mantle of the one who will restore peace and order to Greece. If by chance we will become the next Hegemon than who will blame us?"
 macedon_01_macedonia_1.21.a:0 "Peace and stability will be restored."
 macedon_01_macedonia_1.22.t:0 "Heirs of Aeacus"
 macedon_01_macedonia_1.22.desc:0 "To the legendary house of Aeacus belonged such legendary figures as Ajax and Achilles or this is what the kings of Mollosis claim. In truth they are indeed an old and respected family and what is more important they are the neighbours of Thessaly. An allience with them could secure our western border."
 macedon_01_macedonia_1.22.a:0 "This could also rise our prestige."
 macedon_01_macedonia_1.22.b:0 "We can always annect their country directly."
 macedon_01_macedonia_1.23.t:0 "Macedonian Proposition"
 macedon_01_macedonia_1.23.desc:0 "We just received proposition from Macedonian court about a political allience as well as marriage proposal. Their house is not as recognized as ours but their kingdom is larger and may be able to assist us in the future conflicts."
 macedon_01_macedonia_1.23.a:0 "They may prove usefull indeed."
 macedon_01_macedonia_1.23.b:0 "I will not give my daughter to some barbarian!"
 macedon_01_macedonia_1.24.t:0 "The Bride"
 macedon_01_macedonia_1.24.desc:0 "Princess Olimpias just arrived to our court. She is as beutifull as the epirotes claimed but more importantly she brings support of important greek family."
 macedon_01_macedonia_1.24.a:0 "Her beauty is a bonus."
 macedon_01_macedonia_1.25.t:0 "Molosis Declines"
 macedon_01_macedonia_1.25.desc:0 "Barbarians! They called us barbarians to our faces! Their kingdom is the size of one of our provinces and they do this?"
 macedon_01_macedonia_1.25.a:0 "Not everyone have self-preservation instinct."
 macedon_01_macedonia_1.26.t:0 "Macedonian Gold"
 macedon_01_macedonia_1.26.desc:0 "With the effort of our armies the gold mines in eastern Macedon were secured. There is only one issue. This region is full of hostile thracians and ionians. Gold is essencial to our plans thus we need new mining colonies."
 macedon_01_macedonia_1.26.a:0 "But this will pay off."
 macedon_01_macedonia_1.27.t:0 "Macedonian Gold"
 macedon_01_macedonia_1.27.desc:0 "New settlers in Amphipolis already arrived and a town of Philippi was established nearby. With this investments we secured our gold mines. "
 macedon_01_macedonia_1.27.a:0 "Now we have resources we needed."
 macedon_01_macedonia_1.28.t:0 "Thracian Coast"
 macedon_01_macedonia_1.28.desc:0 "Before the Thrace was conquered by the macedonian armies the local kings and southern greeks had an unwritten arrangement that in return for support the thracians will keep the local greek colonies in check. Naturally now this role was taken over by the new management."
 macedon_01_macedonia_1.28.a:0 "And for that we need local garrisons."
 macedon_01_macedonia_1.29.t:0 "Thracian Colonies"
 macedon_01_macedonia_1.29.desc:0 "With new strategicly put garrisons we will be able to control the land routes to Asia as well as collect the tribute from our new subjects."
 macedon_01_macedonia_1.29.a:0 "This was good investment."
 macedon_01_macedonia_1.30.t:0 "From Warriors to Soldiers"
 macedon_01_macedonia_1.30.desc:0 "Until this point macedonians weren't much different from the rest of greeks in military matters. They posessed better cavlary units and had better access to barbarian mercenaries but to face the greek armies of the south new reforms were needed."
 macedon_01_macedonia_1.30.a:0 "Our kingdom needs better armed forces."
 macedon_01_macedonia_1.31.t:0 "Macedonian Army"
 macedon_01_macedonia_1.31.desc:0 "The reform of our armed forces is the most important step towards hegemony in Hellas. Now we can wage war entire year and not only during the campaign season like in the past. With this army who knows how far we can go. "
 macedon_01_macedonia_1.31.a:0 "Maybe we will be even able to conquer Asia."
 macedon_01_macedonia_1.32.t:0 "Under New Management"
 macedon_01_macedonia_1.32.desc:0 "After the subjugation of Greece macedonians had an issue. Ruling the various greek polis directly will vastly overstretch their resources but there is a solution. Instead of having various leagues like Beotian, Thessalian etc. we can form one political organism for entire Hellas."
 macedon_01_macedonia_1.32.a:0 "This way we will have one subject instead of many."
 macedon_01_macedonia_1.33.t:0 "League of Corinth"
 macedon_01_macedonia_1.33.desc:0 "Somehow we managed to achieve something that was deemed impossible for centuries. Delegates from all Hellas met in one place. The city of Korinthos. Subsequently Corinth was chosen as the seat of the body that is supposed to govern the affairs of entire Greece and the king of Macedon will serve as the leader of this union."
 macedon_01_macedonia_1.33.a:0 "To guarantee peace and prosperity for all Greece of course."
 macedon_01_macedonia_1.34.t:0 "New Royal Residance"
 macedon_01_macedonia_1.34.desc:0 "As kingdom we are often treated as an inferior nation by our southern neighbors. We cannot change their views overnight but we can make an impression on their envoys visiting our capital. Thats why we need a new royal residance."
 macedon_01_macedonia_1.34.a:0 "They will look red with envy."
 macedon_01_macedonia_1.35.t:0 "Palace in Pella"
 macedon_01_macedonia_1.35.desc:0 "We finally managed to finish the construction of a new royal residance. In addition to the royal quaters our king added a smaller residences for the royal guests especially the young boys from important families who will be raised with the macedonian heirs."
 macedon_01_macedonia_1.35.a:0 "This way we will gain both loyalty as well as capable leadership."
 #Kush
 kush_01_egypt_1.1.t:0 "Wife for the God"
 kush_01_egypt_1.1.desc:0 "The head pristess of Amun known by her title wife of Amun is dead and as a result there will be elections for the new wife. Traditionally this title was bestowed on one of pharoh's daughters and allowed the civilian authorities to keep an eye on the temple. This reminds the current ruler of Kush that he has in dact many daughters and control over this prestige position could aid him in gaining control over the Thebes itself."
 kush_01_egypt_1.1.a:0 "Because who will stand against the Amun and his wife?"
 kush_01_egypt_1.2.t:0 "Nubian Impudence"
 kush_01_egypt_1.2.desc:0 "The impudent nubians know no humility. There are rumors they want to install a nubian princess as Amun's wife! In the holy Thebes! I cannot even imagine how they intend to convince those traditionalist priests to this idea. Do they really think those cowards will stood up against me?"
 kush_01_egypt_1.2.a:0 "There is no way she will be acccepted."
 kush_01_egypt_1.2.b:0 "Maybe I should influence their choice, just in case."
 kush_01_egypt_1.3.t:0 "New wife of Amun"
 kush_01_egypt_1.3.desc:0 "Pharoh's daughter just got accepted as a new high pristess of Amun. This will add legitimacy to our rule in Upper Egypt."
 kush_01_egypt_1.3.a:0 "Send congratulations to my dear child."
 kush_01_egypt_1.4.t:0 "Proposition Rejected"
 kush_01_egypt_1.4.desc:0 "Our candidate for the new high pristess got rejected. We sense the Theban usurpers hand in this. He must pay with his head!"
 kush_01_egypt_1.4.a:0 "I'll deny him the afterlife for this!"
 kush_01_egypt_1.5.t:0 "Nubian Princess in the Temple"
 kush_01_egypt_1.5.desc:0 "Somehow Nubians managed to bribe the priests to accept the Kushite princess as a new Wife of Amun. Since Temple holds a lot of authority over the minds and hearts of people (not mentioning the temple guards) we are in deep trouble as soon kushite king will be seen now as a legitimate monarch."
 kush_01_egypt_1.5.a:0 "We need to act immidiately or we will perish!"
 kush_01_egypt_1.6.t:0 "Without a Fight"
 kush_01_egypt_1.6.desc:0 "The mere fact that egyptian priesthood even considered your daughter as a candidate to the holy office is the testament to their desperation. Maybe a small show of force will manage to convince them to acnowlenge your claim to the throne officially."
 kush_01_egypt_1.6.a:0 "Send our vanguard into the Upper Kemet."
 kush_01_egypt_1.7.t:0 "Kushite Vanguard"
 kush_01_egypt_1.7.desc:0 "After our latest political disaster Kushites once again test our resolve. This time they sent a sizable host to force the loyal nomarchs to change sides. They hope this pathetic show of force will be enaugh to convince them to betray us."
 kush_01_egypt_1.7.a:0 "What they hope to achive?"
 kush_01_egypt_1.7.b:0 "Maybe we should send reinforcements just in case?"
 kush_01_egypt_1.8.t:0 "Thebes are ours!"
 kush_01_egypt_1.8.desc:0 "The messenger just arrived. Almost all nomarchs of upper egypt capitulated and opened their gates. They agreed to pay tribute and acnowledged kushite king as a pharoh in return for protection of our warriors. It seems they are tired of constant fighting. Even the Thebes opened their gates."
 kush_01_egypt_1.8.a:0 "Now we are legitimate claimants at last."
 kush_01_egypt_1.9.t:0 "Plan Failed"
 kush_01_egypt_1.9.desc:0 "Theban ruler was not as stupid as we hoped him to be and sent his soldiers to the border cities which prevented the nomarchs betrayal."
 kush_01_egypt_1.9.a:0 "This will only delay the inevitable."
 kush_01_egypt_1.10.t:0 "Betrayal!"
 kush_01_egypt_1.10.desc:0 "These cowards betrayed us and opened their gates to those barbarians! We had to withdraw to the western oasis."
 kush_01_egypt_1.10.a:0 "They will pay for this."
 kush_01_egypt_1.11.t:0 "Claiming the Throne"
 kush_01_egypt_1.11.desc:0 "Nubia was last time a part of the Egyptian Empire more than two centuries ago. Thou we belong to old nobility and surely we can track our heritage to the Ramasside dynasty I'm afraid that no one will care about it. Still if we want to be one of the claimants we need to make it known that kushites will march north to bring order and not as raiding party."
 kush_01_egypt_1.11.a:0 "Send the messengers!"
 kush_01_egypt_1.12.t:0 "Messengers from Kush"
 kush_01_egypt_1.12.desc:0 "It seems the rumours were true. Kushites really make their move and claim to be the real heirs of the Ramassides. Most will probably laugh it off but they do have strong and more importantly way more numerous army than other claimants. "
 kush_01_egypt_1.12.a:0 "Thats really bad news indeed."
 kush_01_egypt_1.13.t:0 "Wadi Hammamat"
 kush_01_egypt_1.13.desc:0 "Wadi Hammamat or Wadi in general are rivers that flow only periodically during the rains. Hammamat was an important trade network connecting our country with the land of Melluha (India) during the times before civil war and with a bit of effort it can be opened again."
 kush_01_egypt_1.13.a:0 "Send the first expeditions!"
 kush_01_egypt_1.14.t:0 "Desert Outpost"
 kush_01_egypt_1.14.desc:0 "The recolonisation of the old caravan routes is a difficult process but there are riches in those mountains and trade possibilities if we manage to reestablish the connection to India. We just found next site for an outpost."
 kush_01_egypt_1.14.a:0 "Good let's dig the well."
 kush_01_egypt_1.14.b:0 "We can't affort it now."
 kush_01_egypt_1.15.t:0 "Trade Harbour"
 kush_01_egypt_1.15.desc:0 "We discovered perfect place for the harbour we need to receive trade ships from India. This will cost us but the investment will surely pay of."
 kush_01_egypt_1.15.a:0 "I hope so."
 kush_01_egypt_1.15.b:0 "We lack the funds necessary for the project."
 kush_01_egypt_1.16.t:0 "Trade Harbour"
 kush_01_egypt_1.16.desc:0 "We discovered perfect place for the harbour we need to receive trade ships from India. This will cost us but the investment will surely pay of."
 kush_01_egypt_1.16.a:0 "I hope so."
 kush_01_egypt_1.16.b:0 "We lack the funds necessary for the project."
 kush_01_egypt_1.17.t:0 "Nominal Vassals"
 kush_01_egypt_1.17.desc:0 "As expected the rulers of Hermapolis and Heracleopolis sent their congratulations and promises of tribute after the conquest of thebes but they never sent any hostages or the tributes they wrote about."
 kush_01_egypt_1.17.a:0 "We need to remind them of their duties to the crown."
 #Hidden Event
 kush_01_egypt_1.19.t:0 "Rebellion of Tefnakht"
 kush_01_egypt_1.19.desc:0 "Hearing about the loss of Thebes to the nubians the egyptians from Lower Kemet had enaugh. Under the priest of Amun from Sais Tefnakht they revolted against the nubians and vowed to take back their country. All those who do not swear allegience to the new pharoh and up on stakes."
 kush_01_egypt_1.19.a:0 "Worrisome news."
 kush_01_egypt_1.20.t:0 "Kushite Demands"
 kush_01_egypt_1.20.desc:0 "Kushite king starts to wonder why we didn't sent him tribute or any other form of allegience. One cannot sit on a fence and finally we will be invaded aither by Kushites or whoever will be left in control of lower egypt."
 kush_01_egypt_1.20.a:0 "Kushite king is indeed powerfull."
 kush_01_egypt_1.20.b:0 "I heard there is a new ruler in Sais."
 kush_01_egypt_1.20.c:0 "Why I have to bow before anyone?"
 kush_01_egypt_1.21.t:0 "Kushite Demands"
 kush_01_egypt_1.21.desc:0 "Kushite king starts to wonder why we didn't sent him tribute or any other form of allegience. One cannot sit on a fence and finally we will be invaded aither by Kushites or whoever will be left in control of lower egypt."
 kush_01_egypt_1.21.a:0 "Kushite king is indeed powerfull."
 kush_01_egypt_1.21.b:0 "I heard there is a new ruler in Sais."
 kush_01_egypt_1.21.c:0 "Why I have to bow before anyone?"
 kush_01_egypt_1.22.t:0 "Decision of Hermapolis"
 kush_01_egypt_1.22.desc:0 "King of Kush demanded the submission from the nomarch of Hermapolis and the local ruler decided to fulfill his demands."
 kush_01_egypt_1.22.a:0 "That standoff didn't last long."
 kush_01_egypt_1.23.t:0 "Decision of Hermapolis"
 kush_01_egypt_1.23.desc:0 "King of Kush demanded the submission from the nomarch of Hermapolis. Local ruler decided boldly to switch his allegience and sided with Lower Egypt."
 kush_01_egypt_1.23.a:0 "Real Strategy requires cunning."
 kush_01_egypt_1.24.t:0 "Decision of Hermapolis"
 kush_01_egypt_1.24.desc:0 "King of Kush demanded the submission from the nomarch of Hermapolis but received only silence."
 kush_01_egypt_1.24.a:0 "Lack of news is also a news."
 kush_01_egypt_1.25.t:0 "Decision of Heracleopolis"
 kush_01_egypt_1.25.desc:0 "King of Kush demanded the submission from the nomarch of Heracleopolis and the local ruler decided to fulfill his demands."
 kush_01_egypt_1.25.a:0 "That standoff didn't last long."
 kush_01_egypt_1.26.t:0 "Decision of Heracleopolis"
 kush_01_egypt_1.26.desc:0 "King of Kush demanded the submission from the nomarch of Heracleopolis. Local ruler decided boldly to switch his allegience and sided with Lower Egypt."
 kush_01_egypt_1.26.a:0 "Real Strategy requires cunning."
 kush_01_egypt_1.27.t:0 "Decision of Heracleopolis"
 kush_01_egypt_1.27.desc:0 "King of Kush demanded the submission from the nomarch of Heracleopolis but received only silence."
 kush_01_egypt_1.27.a:0 "Lack of news is also a news."
 kush_01_egypt_1.28.t:0 "Lord of Two Lands"
 kush_01_egypt_1.28.desc:0 "It's almost poetic that this time things end as they started, with the war between the Northern and Southern Egypt. The Delta will be filled with fortresses and marshlands, we will have to fight for every crossing but we haven't come this far to give up now."
 kush_01_egypt_1.28.a:0 "Prepare for battle!"
 kush_01_egypt_1.29.t:0 "The Red Lands"
 kush_01_egypt_1.29.desc:0 "To the west of the Kemet ("Black Land") lays the great Sahara desert by locals called the Red Land. Precisely from this direction arrived the migrating tribes of Ma and Libu. To stabilize the region and prevent further issues we need to reestablish control over the network of oasis. Our targets are the Kharga, Dakhla, Baharia and Farafra. With those locations secured we will close the ways to the Nile river valley and finally bring those troublesome libyans under control. "
 kush_01_egypt_1.29.a:0 "And we will tax them of course."
 kush_01_egypt_1.30.t:0 "New Outpost"
 kush_01_egypt_1.30.desc:0 "Our expeditionary forces found the perfect place for the desert outpost."
 kush_01_egypt_1.30.a:0 "Dig the well!"
 kush_01_egypt_1.30.b:0 "We lack the funds right now."
 kush_01_egypt_1.31.t:0 "Seat of Power"
 kush_01_egypt_1.31.desc:0 "The capital of Egypt changed over time but the coronation ceremony was usually held at Memphis. Coronation was usually 70 days after the previous pharoh's death and was officiated by the High Priest.  The new pharaoh would receive sacred regalia, including various crowns like the Double Crown (Pschent), the false beard, the Heka sceptre, and a bull's tail, each symbolizing different aspects of royal power and divinity. After that king traditionally embarked on a jurney accross the Egypt to vosot the temples and receive blessings. And sometimes made decision which city will be the new capital."
 kush_01_egypt_1.31.a:0 "Thebes, the capital of Upper Egypt."
 kush_01_egypt_1.31.b:0 "Mamphis, the capital of old kingdom."
 kush_01_egypt_1.31.c:0 "Tanis, the capital of the Libyans."
 kush_01_egypt_1.31.d:0 "We'll stay in the south."
 kush_01_egypt_1.32.t:0 "Great Bitter Lake"
 kush_01_egypt_1.32.desc:0 "It was somewhere in the vicinity of Great Bitter Lake that the legendary campaign of pharoh Shoshenq I started with the battle against the Shasu. Thou the egypts traditional defenses are centered on the city of Pelusium the area south of it is equaly important and was in a way of many berber raids on the Nile valley. It's imperative to reestablish control over this important region. Our expeditionary unit found the perfect site, a village called Clysma."
 kush_01_egypt_1.32.a:0 "We need to rebuild the Fortresses and build new ones."
 kush_01_egypt_1.32.b:0 "I'm afraid we can't afford it now."
 kush_01_egypt_1.33.t:0 "Bread Basket of Mediterrainean"
 kush_01_egypt_1.33.desc:0 "Since time immemorial Egypt was known from it's grain export. During the Bronze Age Collapse when pirates ruled the seas the grain industry was hit hard and the subsequent civil war only put the nail to it's coffin. Now when country is stable again we are finally able to bring back the grain trade to the level from before the crisis."
 kush_01_egypt_1.33.a:0 "We'll make Egypt great again!"
 kush_01_egypt_1.34.t:0 "Irrigation System"
 kush_01_egypt_1.34.desc:0 "In the past one of the main duties of the Egyptian crown was to maintain the irrigation system essential for egypts economy. During times of crisis and civil war this complicated system was usually left without maintenence. We need to restore it piece by piece. "
 kush_01_egypt_1.34.a:0 "Like in this province."
 kush_01_egypt_1.34.b:0 "We don't have the money."
 kush_01_egypt_1.35.t:0 "Grain Shipments"
 kush_01_egypt_1.35.desc:0 "Our efforts have been rewarded and the first shipments have been sent to all corners of the Meditarrainean signalling that we are back in business."
 kush_01_egypt_1.35.a:0 "We are gonna be rich again!"
 kush_01_egypt_1.36.t:0 "Greeks in Egypt"
 kush_01_egypt_1.36.desc:0 "Hearing about the end of the egyptian civil war and the economic recovery of the state the sea faring greek arrived into the western part of the Delta region to restore the grain traid. Thou for most citizens they are novelty we found that actually egypt has long history of relations with the greeks. They are great infantryman and are willing to fight for our money. "
 kush_01_egypt_1.36.a:0 "We can use them to defend our new egyptian posessions."
 kush_01_egypt_1.37.t:0 "Vassal States"
 kush_01_egypt_1.37.desc:0 "Nile Delta is very hard to control, especially for a new foreign dynasty. Trying to find solution advisors proposed the creation of vassal states loyal to the throne. This could relief some pressure from treasury and local kings could provide troops for our campaigns."
 kush_01_egypt_1.37.a:0 "This could work."
 kush_01_egypt_1.37.b:0 "Loyalty of the Deltans is questionable."