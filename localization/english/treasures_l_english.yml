l_english:
 treasure_rpalladium:0 "Palladium"
 treasure_rpalladium_desc:0 "Wooden image of Minerva that the Romans claimed had been rescued from the fall of Troy and was in the keeping of the Vestals. "
 treasure_nstatues:0 "Horned Warriors"
 treasure_nstatues_desc:0 "Religious statues of horned warriors. it is suggested that they appeared in pairs. They supposingly symbolize the twin indo-european hero-gods of war."
 treasure_9sybilbooks:0 "Sybilline Books"
 treasure_9sybilbooks_desc:0 "Acording to the prophecy a collection of boooks where hellespontine oracle fortold the fate of the eternal city."
 treasure_6sybilbooks:0 "Sybilline Books"
 treasure_6sybilbooks_desc:0 "Acording to the prophecy a collection of boooks where hellespontine oracle fortold the fate of the eternal city."
 treasure_3sybilbooks:0 "Sybilline Books"
 treasure_3sybilbooks_desc:0 "Acording to the prophecy a collection of boooks where hellespontine oracle fortold the fate of the eternal city."
 treasure_orpheusbook:0 "Orpheus's Book"
 treasure_orpheusbook_desc:0 "Artifact of a legendary hero Orpheus who managed to visit the Underworld to unsuccessfully atempt to free the soul of his dead wife."
 treasure_bronzehand:0 "Bronze Hand"
 treasure_bronzehand_desc:0 "The hand recurring iconography for Sabazios, the Thracian horsemen, and this particular piece is a beautiful work of bronze art."
 treasure_derzelasstatue:0 "Statue of Derzelas"
 treasure_derzelasstatue_desc:0 "A wooden statue of Derzelas,the Dacian god of underworld, from his temple at Odessus."
 treasure_philoctates:0 "Altar of Philoctates"
 treasure_philoctates_desc:0 "a bronze altar adorned with a serpent, in honor of Philoctates, hero of Iliad."
 treasure_minosstomb:0 "Tomb of Minos"
 treasure_minosstomb_desc:0 "The alleged coffin of a legendary Knossian king, whose labirynth housed the Minotaur."
 treasure_terracelions:0 "Terrace Lions"
 treasure_terracelions_desc:0 "Twelve lions that guard the sacred way in Delos similarly to how sphinxes guard roads in Egypt."
 treasure_deliankouros:0 "Kouros of Delos"
 treasure_deliankouros_desc:0 "Colosal statue of Youth dedicated to Apollo and brought to Delos by Naxians. Also known as Colossus from Naxos."
 treasure_diomedesshield:0 "Shield of Diomedes"
 treasure_diomedesshield_desc:0 "Ancient shield of Diomedes, king of Argos and prominent figure in the Iliad."
 treasure_cadmianrhyton:0 "Rhyton of Cadmus"
 treasure_cadmianrhyton_desc:0 "A golden drinking horn said to be a wedding gift from Zeus to the founder of Thebes."
 treasure_semelestomb:0 "Tomb of Semele"
 treasure_semelestomb_desc:0 "Tomb of Semele, the mother of Dionysus and a diety in her own right among the Thracians and Phrygians. Her tomb was important part of the Theban temple."
 treasure_naxiansphinx:0 "Sphinx of the Naxians"
 treasure_naxiansphinx_desc:0 "Monument offered to the Delphians by the Naxians in form of a sphinx on top of a great pillar. It was located at the temple of apollo in Delphi."
 treasure_athenapolias:0 "Palladium of Athena Polias"
 treasure_athenapolias_desc:0 "Carved wooden xoanon of Athena Polias is an ancient relic from the earliest days of the city. It is said to have fallen from heven and is believed to be the holiest image of the godess."
 treasure_athenasshield:0 "Copper Shield of Athena"
 treasure_athenasshield_desc:0 "Important piece of pediment of the temple of Athena in Syracuse. It is supposed to be something every sailor will be able to see aproaching the city."
 treasure_lapismanalis:0 "Manalis Stones"
 treasure_lapismanalis_desc:0 "There are two stones with different purpose. One is used to block the entrance to the underworld (Mundus Cereris), while the other is asociated with the coming of rain."
 treasure_obeliskofseti:0 "Obelisk of Seti I"
 treasure_obeliskofseti_desc:0 "3 great Obelisks inscribed with hieroglyphs about Seti I, the second Pharaoh of the 19th dynasty, and his royal titles."
 treasure_bookofthedead:0 "Book of the Dead"
 treasure_bookofthedead_desc:0 "This ancient collection of scrolls is one of the oldest instances we know of the Egyptian 'Book of the dead', said to date back to the 13th dynasty. It is a type of written road-map, a collection of descriptions for the spells and rituals needed to reach the afterlife."
 treasure_ramses2obelisk:0 "Obelisk of Ramesses II"
 treasure_ramses2obelisk_desc:0 "This huge obelisk dating to the reigns of Pharaohs Seti and Ramesses II was erected in the city of Heliopolis, now better known as the Flaminio obelisk."
 treasure_benbenstone:0 "Benben Stone"
 treasure_benbenstone_desc:0 "The divine, pyramid shaped, Benben stone, represents the primeval hill upon which Atum first landed. For centuries it was kept in the very center of the Ra temple at Heliopolis. This stone serves as a model for all Pyramidion's and the tips of Egyptian Obelisks."
 treasure_hemhem_crown:0 "Sekhemti Crown of Egypt"
 treasure_hemhem_crown_desc:0 "The Crowns of Upper and Lower Egypt have been the symbol of royal rule along the Nile for millennia. It consist traditionally from two crowns joined together: deshret (red for lower egypt) and hadjet (white for upper). Together they are known as Sekhemti or in other words Double Crown. "
 treasure_holycrocodile:0 "Crocodile of Krokodilopolis"
 treasure_holycrocodile_desc:0 "This great crocodile, Souchous, was once the sacred animal of the city of Krokodilopolis in the Faiyum area. After a lifetime of reverence it was mummified in papyri for posterity."
 treasure_headofamenhotep:0 "Head of Amenhotep III"
 treasure_headofamenhotep_desc:0 "This colossal quartz head must once have been attached to a great quartz statue and originated in the mortuary temple of Amenhotep III in Luxor. Nonetheless the head alone still commands the reverence of many who see it."
 treasure_thutmose3obelisk:0 "Obelisk of Thutmose III"
 treasure_thutmose3obelisk_desc:0 "A giant obelisk commissioned by the Pharaoh Thutmose III for the great temple at Karnak, now better known as the Theodosian obelisk."
 treasure_sistrumofhathor:0 "Sistrum of Hathor"
 treasure_sistrumofhathor_desc:0 "This superbly crafted faience sistrum, a hand-held percussion instrument, is said to have been bequeathed to the temple of Hathor by the goddess of music herself."
 treasure_sarcophagusseti:0 "Sarcophagus of Seti I"
 treasure_sarcophagusseti_desc:0 "Final resting place of the Pharaoh Seti I, the second Pharaoh of the 19th dynasty and the conqueror of Kadesh. This Alabaster Sarcophagus is covered in hieroglyph spells to allow its resident to pass through the underworld."
 treasure_colossipharaohs:0 "Colossi of the Pharaohs"
 treasure_colossipharaohs_desc:0 "These enormous sitting stone Colossi were originally built during the reigns of Ramses II or Seti I and could have been intended to be worshiped as part of a royal cult. Today they remind us of the great authority of the Egyptian Pharaohs."
 treasure_thutmose4obelisk:0 "Obelisk of Thutmose VI"
 treasure_thutmose4obelisk_desc:0 "Commisioned by Pharaoh Thutmoses III and erected by Thutmose IV at the Great Amun temple at Karnak, this is one of the tallest obelisks ever constructed in Egypt, and now better known as the Lateran obelisk."
 treasure_stellaofhorus:0 "Cippus of Horus"
 treasure_stellaofhorus_desc:0 "This exquisitely carved stela depicts young Horus supreme over all savage beasts, and is said to ward off dangerous creatures and cure their bites and stings."
 treasure_arkofcovenant:0 "Ark of Covenant"
 treasure_arkofcovenant_desc:0 "A golden chest carrying acording to Judaism stone tablets on which Jewish god inscribed ten rules for his believers. After the libyan pharoh Shoshenq I led campaign into Canaan the chast was taken to egypt as a spoil of war. Jewish kings claim the Ark was looted but pharoh newer attempted to capture the Jerusalem thats why some believe the temple treasures were used to pay of the invaders."
 treasure_stoneofjacob:0 "Stone of Jacob"
 treasure_stoneofjacob_desc:0 "The stone upon which the hebrew prophet Jacob once rested his head, before seeing visions of God in his sleep. It has been part of the House of God, Bet-El."
 treasure_sarcophagusahiram:0 "Sarcophagus of Ahiram"
 treasure_sarcophagusahiram_desc:0 "This is the sarcophagus of an ancient king of Byblos, who once played an important role in the Phoenician world. Sarcophagus itself was created around 1000 BC."
 treasure_elagabalstone:0 "Elagabal Stone"
 treasure_elagabalstone_desc:0 "This conical black meteorite rock is believed to be inhabited by the Canaanite deity Elagabal, the God of the Mountain."
 treasure_tombofagapenor:0 "Sarcophagus of Agapenor" 
 treasure_tombofagapenor_desc:0 "The tomb of Agapenor, a hero of the Iliad, said to have founded Paphos and the shrine to Aphrodite."
 treasure_sacredfishatargatis:0 "Sacred Fish of Atargatis"
 treasure_sacredfishatargatis_desc:0 "This tank with sacred fish of Atargatis long adorned her sanctuary in Mabbog."
 treasure_cybelestone:0 "Stone of Cybele"
 treasure_cybelestone_desc:0 "Born from stone, the mother godess Cybele is believed to inhabit this black iron rock. For centuries this stone has been worshipped as part of the Cybele cult in Phrygia."
 treasure_tombofpayava:0 "Tomb of Payava"
 treasure_tombofpayava_desc:0 "Payava was a local leader defending these land from the expansion of a Hittite Empire. There is a theory that his struggle was supported by the myceneans but there are no evidence supporting it. The locals still keep the memory about Payava alive thou more and more distorted by the time passed."
 treasure_menicon:0 "Icon of Men"
 treasure_menicon_desc:0 "Men is a lunar god worshipped by the people of Anatolia, and this particular icon has long been the centerpiece of a cult to the deity."
 treasure_mafigure:0 "Figure of Ma"
 treasure_mafigure_desc:0 "A cult figure of Ma, the mother goddess of the city of Komana."
 treasure_whiteobelisk:0 "White Obelisk"
 treasure_whiteobelisk_desc:0 "This large limestone Obelisk is decorated with the campaigns and hunts of ancient Assyrian kings and is said to be over a thousand years old."
 treasure_maskofsargon:0 "Mask of Sargon"
 treasure_maskofsargon_desc:0 "This great bronze mask is said to bear the likeness of the long gone ruler of Akkad, Sargon the Great, the first emperor in human history. Having been used as part of the royal cult, the mask has been mutilated in the iconoclasm of later generations and is missing an eye as well as having been severed from the body that likely once accompanied it."
 treasure_blackobelisk:0 "Black Obelisk"
 treasure_blackobelisk_desc:0 "This Black Obelisk from Nimrud in Assyria depicts the campaigns of king Shalmanaser III and depicts well known bibilical character, king of Isreal Jehu and his oath of fealthy to the assirians adding more context to some bibilical events."
 treasure_babylonianmapoftheworld:0 "Map of the World"
 treasure_babylonianmapoftheworld_desc:0 "This ancient clay tablet depicts the Mesopotamian world, with the city of Babylon at its center along with all the major cities of the two-river region."
 treasure_statueofmarduk:0 "Statue of Marduk"
 treasure_statueofmarduk_desc:0 "More than a statue representing a god, the golden statue of Marduk is believed to be the god himself. For centuries Babylonian kings received their crowns at the hands of this object."
 treasure_statueofnabu:0 "Statue of Nabu"
 treasure_statueofnabu_desc:0 "This colossal statue represents Nabu, the Chaldean god of learning and wisdom, and was brought to Babylon from Borsippa once a year to pay respects to his father deity, Marduk."
 treasure_tgilgamesh:0 "Epic of Gilgamesh"
 treasure_tgilgamesh_desc:0 "These stone tablets are said to be thousands of years old, and tell the story of the hero king Gilgamesh and his adventures. The story is told in the ancient cuneiform scripture known only in Mesopotamia."
 treasure_babylonianchronicles:0 "Babylonian Chronicles"
 treasure_babylonianchronicles_desc:0 "Up to this day Babylonian scribes have been inscribing the major events of the history of their city as they live it. Their recollection of these events are contained in these tablets in cuneiform, to be studied by future generations."
 treasure_stoneofsinifere:0 "Stone of Sinifre"
 treasure_stoneofsinifere_desc:0 "Sinifere is a war god often called upon by the many Numidian and Mauretanian tribes across all of Libya. This stone used to be a part of a larger stone circle in the deity's honor."
 treasure_lionheadedtanit:0 "Lion-Headed Tanit"
 treasure_lionheadedtanit_desc:0 "Tanit is one of the most important deities among the Carthaginians, and is occasionally portrayed with a lion's head when they want to display her as a warrior goddess."
 treasure_stelaebaalhammon:0 "Stelae of Ba'al Hammon"
 treasure_stelaebaalhammon_desc:0 "Stelae are monuments seen across the Carthaginian world, simply as an offering to a deity or as a grave stone and offering both. Dedications to Ba'al Hammon, as one of the two most important deities in Carthage, were often a popular choice to carve into the stone."