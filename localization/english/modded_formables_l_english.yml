l_english:
 #Formable Nations
 #Tier I
 Italia_must_not_exist:0 "Italy must not exist."
 form_Italia:0 "Form Italy"
 form_Italia_desc:0 "Italian Peninsula has an important strategic value to any eastern power wanting to trade with western meditarranean and vice versa. The greeks and phoenicians already began founding colonies, etruscans atempt to capture Po walley or maybe it's time for someone else. There are rumors that not all Trojans are dead with their city."
 Illyria_must_not_exist:0 "Illyria must not exist."
 form_Illyria:0 "Form Illyria"
 form_Illyria_desc:0 "Illyria is the region with the long coastline filled with bays where you can hide entire fleet. In fact the very name illyrians is often translated as sea serpents. All nations that live here are tied to the sea in one way or another. Illyrians are known as pirates and mercenaries with unreliable reputation which is most likely tied to the devided nature of the region. Thou only one can rule the seas."
 Sicily_must_not_exist:0 "Sicily must not exist."
 form_Sicily:0 "Form Sicily"
 form_Sicily_desc:0 "The Isle of Sicily is a strategic location in the middle of the Mediterranean Sea. Additionally it's one of the three major exporters of grain beside Punic colonies in Africa and Egypt. It's also home to ethnically diverse group of people starting from illyrian Sicels, local Sicanians to italic Elymians. Punic settlers are already present on the isle from some time and Greeks arrived just recently. Whoever will capture the isle will also control the mediterrainean."
 Sherden_must_not_exist:0 "Shard must not exist."
 form_Sherden:0 "Form Shard"
 form_Sherden_desc:0 "There is a lot of evidence that Shardana from the egyptian sources are the same people as Nuragians of Sardinia. Those sea raiders known from their castle like structures and horned helmets controled the isles of Corsica and Sardinia with the latter being the heart of this civilisation. "
 crete_must_not_exist:0 "Crete must not exist."
 form_crete:0 "Form Crete"
 form_crete_desc:0 "Since the fall of a minoan civilisation nearly eight centuries ago no single ruler managed to take control over the isle. Crete location is strategic so in time when continental powers start to recover from the Bronze Age Collapse one of them may attempt to take control over the isle. To prevent it cretans must unite under single leadership. "
 achea_must_not_exist:0 "Greece must not exist."
 form_achea:0 "Form Greece"
 form_achea_desc:0 "Before the Bronze Age Collapse the Greek Confederacy was lead by the kings called Wanax who wilded secular and religious power over all of Greece. Back than Basileus was only the title for a governor or regional ruler who still had to answear to the ruler residing in Mycene. Now the acheans are devided more than ever and there is need for new Wanax to take the ancient throne of Agamemnon."
 epirus_must_not_exist:0 "Epirus must not exist."
 form_epirus:0 "Form Epirus"
 form_epirus_desc:0 "Epirote tribes like Thesprotians and Molossians (especially the latter) are present in the ancient sources since the time first greeks step foot in their new homeland. Despite their tribal nature and not being as civilised as the greeks from the south their heritage never been questioned. Still they never played signifficant part in the history of the acheans until now. Three main epirote tribes are left on a board and one of them will rule epirus."
 thrace_must_not_exist:0 "Thrace must not exist."
 form_thrace:0 "Form Thrace"
 form_thrace_desc:0 "Even Greeks admitted often that the area controlled by various thracian tribes is massive. If united they could easily overrun the greek armies but sadly thracians never managed to form a cohesive state. Now their southern borders are under pressure from the macedonians and western by the illyrians. Maybe this will finally force them to unite and choose the new leader."
 egypt_must_not_exist:0 "Kemet must not exist."
 form_egypt:0 "Form Kemet"
 form_egypt_desc:0 "Since the Bronze Age Collapse Egypt is in a state of crysis. Rameses III may have been able to repell the invading sea peoples but the loss of Canaan and than Nubia hit the egyptian treasury hard not mentioning about the libyan migration into the Nile valley. Initially serving as a source of cheep and high quality manpower lbyans climbed up the societal ledder to finally reach the throne of the pharoh and than the clan rivalries, economic crisis finally spiralled out of controll and led to the country's division. Now the Nubians, Libyan warchiefs and local patriots are competing for the title of Pharoh. Who will be victorious?"
 truscia_must_not_exist:0 "Etruria must not exist."
 form_truscia:0 "Form Etruria"
 form_truscia_desc:0 "Etruscans were the first urbanized civilisation on peninsula. Their homeland is the most resource rich land in italy which brings the envy of all their neighbours. To survive they need to unite and for now the league of 12 is an allience only on paper. Maybe a strong ruler will one day lead the Rasenna to glory?"
 syria_must_not_exist:0 "Syria must not exist."
 form_syria:0 "Form Syria"
 form_syria_desc:0 "Syro-palestine was for centuries the theater of war between the great powers of the midddle east. From the times of the Mittani and the Hittites till the catastrophy of the Bronze Age Collapse the inhabitants of Canaan were always hit the hardest. The new era gives us perhaps the only opportunity to forge a realm that will be able to give the people of Canaan the protection and safety they so desperately need."