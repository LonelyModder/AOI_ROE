l_english:
 #Latium
 #Starter
 latium_01_italy:0 "Masters of Italia"
 latium_01_italy_DESCRIPTION:0 "The tribes living near the lower Tiber are collectively called Latins. They are unique blrend of Italic and Etruscan culture, connecting the culturel achivements of etruscans with the discipline and strangth of the italic tribes. That unique mix can one day grat them control over the whole peninsula."
 latium_01_italy_CRITERIA_DESCRIPTION:0 "Follow the path of Latin tribes in their struggle to conquer the italian peninsula. Become the undisputed ruler of Italy."
 latium_01_italy_BUTTON_TOOLTIP:0 "Follow the path of Latin tribes in their struggle to conquer the italian peninsula. Become the undisputed ruler of Italy."
 #Missions
 latium_01_italy_1:0 "The Dream of Romulus"
 latium_01_italy_1_DESC:2 "Acording to the pre-imperial historians the founder of rome was an arcadian greek named Romos (There is also version that the city's name was taken from local tribe called Rumlni). His most important reform was establishment of the military system thanks to which rome could gather more men than enemies and in shorter time. Soon Romans began to wonder if they are strong enaugh to one day rule Italy."
 latium_01_italy_2:0 "Rome vs Alba Longa"
 latium_01_italy_2_DESC:2 "(Mission becomes active after special event!) Before the rise of rome Alba Longa was the most important settlement of the Latins. The city had temple to Jupiter but since the Rome had risen to challenge their supremacy the conflict seemed inevitable. Acording to myth Romans destroyed the city. In reality the city was destroyed during etruscan invasion somewhere near 650BC."
 latium_01_italy_3a:0 "Etruscan League"
 latium_01_italy_3a_DESC:2 "The city of Veii was a thorn in the side of Latin League long before Rome was founded. Veii is by itself not even the largest member of the league but the other member protection prevents it from falling into the latic hands. But as a league etruscans have a weakness all less and more democrtic societies share. They can be bought."
 latium_01_italy_4a:0 "Fall of Veii"
 latium_01_italy_4a_DESC:2 "Acording to the records romans managed to besiege the city yet they were not able to take it. Veii fell because of the changed in the roman leadership. Furious Camillus ordered his soldiers to dig a tunnel and when the tunnel throu the soft tufa rock on which the city stood. When tunnel was ready romans carried out diversionary attack on walls while the main force entered the city. After the victory camillus decided to spare the Veiians instead looting the city because of bad omen. Now there is an issue. Some senators want him punished for not destroying veii but if it was indeed a bad omen than this will surely anger the gods."
 latium_01_italy_5a:0 "Samnite Threat"
 latium_01_italy_5a_DESC:2 "Samnites is a collective term for a confederation of four Oscan tribes from southern Italian mountains. They are quite numerous and militaristic which makes them a threat for their neighbours from the campanian coast. Some of them decided to look to Rome for help and protection. Yet Rome is not charity organization and there will be a price."
 latium_01_italy_6a:0 "Hill Tribes"
 latium_01_italy_6a_DESC:2 "East of Rome, in the center of the Italian peninsula are the Apennine Mountains. There the northern Umbrian tribes and southern Oscans meet. Tribes there are small and numerous and same as Campanians they too are affected by Samnite raids. They will never accept direct submission but maybe there is better solution. Their strangth will surely help us unite the peninsula. "
 latium_01_italy_7a:0 "Epirus's Intervention"
 latium_01_italy_7a_DESC:2 "Epirus have a long history as a protector of Greek colonies in Magna Graecia. They carried out interventions when powerfull oscan tribes attacked the colonies. The rise of Rome may be seen as a threat to their sphere of influence."
 latium_01_italy_3b:0 "Tarquins on Roman Throne?"
 latium_01_italy_3b_DESC:2 "Tarquins were the noble family coming from etruscan city bearing their name. Historically they are credited with opening rome to the etruscan civilisation in form of for example many construction projects (Capitoline Temple, Cloaca Maxima etc). It's suggested that during their reign Rome gained control over all of Latium and even the areas under Volscan control."
 latium_01_italy_4b:0 "Capitoline Temple"
 latium_01_italy_4b_DESC:2 "As foreigners the Terquins wanted to gain legitimacy throu contribution to the roman society and whats better way to do it than throu big public projects like a new temple for the roman gods. "
 latium_01_italy_5b:0 "Sybilline Books"
 latium_01_italy_5b_DESC:2 "It came to the atencion of the roman king that well respected oracle from Hellespont made a prophecies for Rome. The priests wrote them down on a scrolls and they contacted us if we want to buy them."
 latium_01_italy_6b:0 "Monarchy or Republic"
 latium_01_italy_6b_DESC:2 "Despite the efforts of the ruling dynasty the tensions still rising between the ruling etruscan elite and the local roman one. Lately one of the members of the royal family raped noblewomen Lucrecia which became a final straw for anti-etruscan oposition. Under Brutus the rebels are making ready to overthrow the kings and end the monarchy in rome once and for all. Yet there are still senators that see good in the monarchy."
 latium_01_italy_3c:0 "Roman Campania"
 latium_01_italy_3c_DESC:2 "Acording to the signed treaties Roma has the right to place the garrisons in captureed towns and settlements of Campania. This is a very important region because of it's proximity to roman heartlandas well as it being major center of agricultural and industrial trade. We need to make sure it will remain in roman sphere of influence."
 latium_01_italy_4c:0 "Roman Samnium"
 latium_01_italy_4c_DESC:2 "Samnites were a thorn in a roman side for far too long. As in other regions roma plan was to solve this matter by placing garrisons in strategic locations throuthout the samnium itself and adjecent regions."
 latium_01_italy_5c:0 "Greek South"
 latium_01_italy_5c_DESC:2 "After conflicts with the greeks over Magna Graecia. Rome inherited much more urbanized region with more advanced culture. Yet there was a need for further investments if the Eternal City wanted to maintain their hold over the richer south."
 latium_01_italy_6c:0 "Umbria and the Alps"
 latium_01_italy_6c_DESC:2 "The mountaineous region of Umbria was very hard to control thats why it needed much more administrative effort than it may seem at first glance. The Apenine mountains could become a stronghold of anti-roman uprising that will be hard to extinguish unless someone show the locals the benefits of obedience."
 latium_01_italy_7c:0 "Romanizing Etruria"
 latium_01_italy_7c_DESC:2 "Etruria was well developed way before romans even stepped foot there. There was little need for new urban centers so romans focused on tying the intrests of the etruscan city-states with rome like for example by bilateral defense contract with Tarquinii."
 latium_01_italy_99:0 "Italy Conquered!"
 latium_01_italy_99_DESC:2 "Finally Rome is the only power in italian peninsula. Petty wars are over and a new dawn is upon us. We need to use that new found strangth to spread light of roman civilisation to other regions."
 #Macedonia
 #Starter
 macedon_01_macedonia:0 "Hegemony"
 macedon_01_macedonia_DESCRIPTION:0 "Macedonians settled in northern greece barely four centuries ago. By living close to the Thracians they pushed out of the area they took over a lot of thracian habits like for example drinking undiluted wine. Thats why most of greeks sees them as barbarians and tends to mock them on every oportunity. Time to show them that macedonians are also the heirs of Heracles himself!"
 macedon_01_macedonia_CRITERIA_DESCRIPTION:0 "Follow the path of Philip and Alexander and become the undisputed master of all Greece. Show the hellenes that you are the heraclidae worthy of your ancestor."
 macedon_01_macedonia_BUTTON_TOOLTIP:0 "Follow the path of Philip and Alexander and become the undisputed master of all Greece. Show the hellenes that you are the heraclidae worthy of your ancestor."
 #Missions
 macedon_01_macedonia_1:0 "Macedonian Origins"
 macedon_01_macedonia_1_DESC:2 "Macedonians due to their proximity to the barbarian lands are often the subject of jokes questioning their Greek origin (which is obviously false since they macedonian is dialect of doric greek). This is precisely how a Macedonian prince was recently treated when he was refused entry to the Olympics because his origins were questioned. This is the time to do sth about it."
 macedon_01_macedonia_2:0 "New Capital"
 macedon_01_macedonia_2_DESC:2 "To keep propaganda working we need new capital built in a strictly hellenic fashion. After a debate the settlement of Pella in Lower Macedon was chosen as a new seat of our kings and royal administration."