l_english:
 #Latium mission tree 1
 #Starter
 latium_01_italy:0 "Masters of Italia"
 latium_01_italy_DESCRIPTION:0 "The tribes living near the lower Tiber are collectively called Latins. They are unique blrend of Italic and Etruscan culture, connecting the culturel achivements of etruscans with the discipline and strangth of the italic tribes. That unique mix can one day grat them control over the whole peninsula."
 latium_01_italy_CRITERIA_DESCRIPTION:0 "Follow the path of Latin tribes in their struggle to conquer the italian peninsula. Become the undisputed ruler of Italy."
 latium_01_italy_BUTTON_TOOLTIP:0 "Follow the path of Latin tribes in their struggle to conquer the italian peninsula. Become the undisputed ruler of Italy."
 #Missions
 latium_01_italy_1:0 "The Dream of Romulus"
 latium_01_italy_1_DESC:2 "Acording to the pre-imperial historians the founder of rome was an arcadian greek named Romos (There is also version that the city's name was taken from local tribe called Rumlni). His most important reform was establishment of the military system thanks to which rome could gather more men than enemies and in shorter time. Soon Romans began to wonder if they are strong enaugh to one day rule Italy."
 latium_01_italy_2:0 "Rome vs Alba Longa"
 latium_01_italy_2_DESC:2 "(Mission becomes active after special event!) Before the rise of rome Alba Longa was the most important settlement of the Latins. The city had temple to Jupiter but since the Rome had risen to challenge their supremacy the conflict seemed inevitable. Acording to myth Romans destroyed the city. In reality the city was destroyed during etruscan invasion somewhere near 650BC."
 latium_01_italy_3a:0 "Etruscan League"
 latium_01_italy_3a_DESC:2 "The city of Veii was a thorn in the side of Latin League long before Rome was founded. Veii is by itself not even the largest member of the league but the other member protection prevents it from falling into the latic hands. But as a league etruscans have a weakness all less and more democrtic societies share. They can be bought."
 latium_01_italy_4a:0 "Fall of Veii"
 latium_01_italy_4a_DESC:2 "Acording to the records romans managed to besiege the city yet they were not able to take it. Veii fell because of the changed in the roman leadership. Furious Camillus ordered his soldiers to dig a tunnel and when the tunnel throu the soft tufa rock on which the city stood. When tunnel was ready romans carried out diversionary attack on walls while the main force entered the city. After the victory camillus decided to spare the Veiians instead looting the city because of bad omen. Now there is an issue. Some senators want him punished for not destroying veii but if it was indeed a bad omen than this will surely anger the gods."
 latium_01_italy_5a:0 "Samnite Threat"
 latium_01_italy_5a_DESC:2 "Samnites is a collective term for a confederation of four Oscan tribes from southern Italian mountains. They are quite numerous and militaristic which makes them a threat for their neighbours from the campanian coast. Some of them decided to look to Rome for help and protection. Yet Rome is not charity organization and there will be a price."
 latium_01_italy_6a:0 "Hill Tribes"
 latium_01_italy_6a_DESC:2 "East of Rome, in the center of the Italian peninsula are the Apennine Mountains. There the northern Umbrian tribes and southern Oscans meet. Tribes there are small and numerous and same as Campanians they too are affected by Samnite raids. They will never accept direct submission but maybe there is better solution. Their strangth will surely help us unite the peninsula. "
 latium_01_italy_7a:0 "Epirus's Intervention"
 latium_01_italy_7a_DESC:2 "Epirus have a long history as a protector of Greek colonies in Magna Graecia. They carried out interventions when powerfull oscan tribes attacked the colonies. The rise of Rome may be seen as a threat to their sphere of influence."
 latium_01_italy_3b:0 "Tarquins on Roman Throne?"
 latium_01_italy_3b_DESC:2 "Tarquins were the noble family coming from etruscan city bearing their name. Historically they are credited with opening rome to the etruscan civilisation in form of for example many construction projects (Capitoline Temple, Cloaca Maxima etc). It's suggested that during their reign Rome gained control over all of Latium and even the areas under Volscan control."
 latium_01_italy_4b:0 "Capitoline Temple"
 latium_01_italy_4b_DESC:2 "As foreigners the Terquins wanted to gain legitimacy throu contribution to the roman society and whats better way to do it than throu big public projects like a new temple for the roman gods. "
 latium_01_italy_5b:0 "Sybilline Books"
 latium_01_italy_5b_DESC:2 "It came to the atencion of the roman king that well respected oracle from Hellespont made a prophecies for Rome. The priests wrote them down on a scrolls and they contacted us if we want to buy them."
 latium_01_italy_6b:0 "Monarchy or Republic"
 latium_01_italy_6b_DESC:2 "Despite the efforts of the ruling dynasty the tensions still rising between the ruling etruscan elite and the local roman one. Lately one of the members of the royal family raped noblewomen Lucrecia which became a final straw for anti-etruscan oposition. Under Brutus the rebels are making ready to overthrow the kings and end the monarchy in rome once and for all. Yet there are still senators that see good in the monarchy."
 latium_01_italy_3c:0 "Roman Campania"
 latium_01_italy_3c_DESC:2 "Acording to the signed treaties Roma has the right to place the garrisons in captureed towns and settlements of Campania. This is a very important region because of it's proximity to roman heartlandas well as it being major center of agricultural and industrial trade. We need to make sure it will remain in roman sphere of influence."
 latium_01_italy_4c:0 "Roman Samnium"
 latium_01_italy_4c_DESC:2 "Samnites were a thorn in a roman side for far too long. As in other regions roma plan was to solve this matter by placing garrisons in strategic locations throuthout the samnium itself and adjecent regions."
 latium_01_italy_5c:0 "Greek South"
 latium_01_italy_5c_DESC:2 "After conflicts with the greeks over Magna Graecia. Rome inherited much more urbanized region with more advanced culture. Yet there was a need for further investments if the Eternal City wanted to maintain their hold over the richer south."
 latium_01_italy_6c:0 "Umbria and the Alps"
 latium_01_italy_6c_DESC:2 "The mountaineous region of Umbria was very hard to control thats why it needed much more administrative effort than it may seem at first glance. The Apenine mountains could become a stronghold of anti-roman uprising that will be hard to extinguish unless someone show the locals the benefits of obedience."
 latium_01_italy_7c:0 "Romanizing Etruria"
 latium_01_italy_7c_DESC:2 "Etruria was well developed way before romans even stepped foot there. There was little need for new urban centers so romans focused on tying the intrests of the etruscan city-states with rome like for example by bilateral defense contract with Tarquinii."
 latium_01_italy_99:0 "Italy Conquered!"
 latium_01_italy_99_DESC:2 "Finally Rome is the only power in italian peninsula. Petty wars are over and a new dawn is upon us. We need to use that new found strangth to spread light of roman civilisation to other regions."
 #Macedonia mission tree 1
 #Starter
 macedon_01_macedonia:0 "Macedonian Hegemony"
 macedon_01_macedonia_DESCRIPTION:0 "Macedonians settled in northern greece barely four centuries ago. By living close to the Thracians they pushed out of the area they took over a lot of thracian habits like for example drinking undiluted wine. Thats why most of greeks sees them as barbarians and tends to mock them on every oportunity. Time to show them that macedonians are also the heirs of Heracles himself!"
 macedon_01_macedonia_CRITERIA_DESCRIPTION:0 "Follow the path of Philip and Alexander and become the undisputed master of all Greece. Show the hellenes that you are the heraclidae worthy of your ancestor."
 macedon_01_macedonia_BUTTON_TOOLTIP:0 "Follow the path of Philip and Alexander and become the undisputed master of all Greece. Show the hellenes that you are the heraclidae worthy of your ancestor."
 #Missions
 macedon_01_macedonia_1:0 "Macedonian Origins"
 macedon_01_macedonia_1_DESC:2 "Macedonians due to their proximity to the barbarian lands are often the subject of jokes questioning their Greek origin (which is obviously false since they macedonian is dialect of doric greek). This is precisely how a Macedonian prince was recently treated when he was refused entry to the Olympics because his origins were questioned. This is the time to do sth about it."
 macedon_01_macedonia_1a:0 "New Capital"
 macedon_01_macedonia_1a_DESC:2 "To keep propaganda working we need new capital built in a strictly hellenic fashion. After a debate the settlement of Pella in Lower Macedon was chosen as a new seat of our kings and royal administration."
 macedon_01_macedonia_2a:0 "Upper Macedonians"
 macedon_01_macedonia_2a_DESC:2 "Nominally upper macedonians are part of the Macedonian realm but in reality they often act indepentently from the crown. In Macedon there are two kinds of macedonians. Lower macedonians are what everyone expect of a typical greek to be, meaning the typically settled urban society with laws and norms not that different from the ones in the south. Upper Macedonians are much more similar to barbarians to the north and east. They live in tribal societies and obey the Argead king only when it suits them. To change that we need to deal with the biggest issue in the region. Lack of urban centers."
 macedon_01_macedonia_3a:0 "Heirs of Aeacus"
 macedon_01_macedonia_3a_DESC:2 "To the legendary house of Aeacus belonged such legendary figures as Ajax and Achilles or this is what the kings of Mollosis claim. In truth they are indeed an old and respected family and what is more important they are the neighbours of Thessaly. An allience with them could secure our western border."
 macedon_01_macedonia_4a:0 "Macedonian Gold"
 macedon_01_macedonia_4a_DESC:2 "With the effort of our armies the gold mines in eastern Macedon were secured. There is only one issue. This region is full of hostile thracians and ionians. Gold is essencial to our plans thus we need new mining colonies."
 macedon_01_macedonia_5a:0 "Thracian Coast"
 macedon_01_macedonia_5a_DESC:2 "Before the Thrace was conquered by the macedonian armies the local kings and southern greeks had an unwritten arrangement that in return for support the thracians will keep the local greek colonies in check. Naturally now this role was taken over by the new management."
 macedon_01_macedonia_6a:0 "Macedonian Army"
 macedon_01_macedonia_6a_DESC:2 "Until this point macedonians weren't much different from the rest of greeks in military matters. They posessed better cavlary units and had better access to barbarian mercenaries but to face the greek armies of the south new reforms were needed."
 macedon_01_macedonia_7a:0 "League of Corinth"
 macedon_01_macedonia_7a_DESC:2 "After the subjugation of Greece macedonians had an issue. Ruling the various greek polis directly will vastly overstretch their resources but there is a solution. Instead of having various leagues like Beotian, Thessalian etc. we can form one political organism for entire Hellas."
 macedon_01_macedonia_8a:0 "Royal Palace"
 macedon_01_macedonia_8a_DESC:2 "As kingdom we are often treated as an inferior nation by our southern neighbors. We cannot change their views overnight but we can make an impression on their envoys visiting our capital. Thats why we need a new royal residance."
 macedon_01_macedonia_1b:0 "Peonia"
 macedon_01_macedonia_1b_DESC:2 "Peonia was a sizable barbarian kingdom north of Macedon that often raided macedonian borders. As it is often among the barbarians we can use their internal conflict to our advantage. Maybe we even and up with loyal buffer state protecting our northern border."
 macedon_01_macedonia_2b:0 "Illyrians"
 macedon_01_macedonia_2b_DESC:2 "The fertile lands west of macedon inhabited by Illyrians were a thorn in Macedons side since time immemorial. Especially since the creation of the first larger Illyrian state called Enchelei which means that soon Illyrians may bacome an issue and we need to adress it sooner rather than later."
 macedon_01_macedonia_3b:0 "Gold in Amfipolis"
 macedon_01_macedonia_3b_DESC:2 "The macedonian expansion to the east was motivated partially by the gold mines on Thasos andaround Amphipolis. Those mines could finance the reforms Macedon urgently needs. The only issue thou is the Chalkidian League and their Athenian allies. Fighting fellow greeks will not be as easy as fighting Thracians."
 macedon_01_macedonia_4b:0 "Thessalian Archon"
 macedon_01_macedonia_4b_DESC:2 "With the flanks secured we are finally ready to start our bid for the title of the greek hegemon. The first step on our path is the Thessalian League. The thessalian forces are sizable and their resources are vast but maybe we will be able to convince some of them to cooperation."
 macedon_01_macedonia_5b:0 "Thracian Wars"
 macedon_01_macedonia_5b_DESC:2 "Thracians were numerous and spread over a large area. This in compination with the unification efforts made by the Odryssian tribe makes them a threat that needs to be dealt with as soon as possible. Otherwise they can use their numerical advantage to conquer greece while it still lacks unity."
 macedon_01_macedonia_6b:0 "Sacred Wars"
 macedon_01_macedonia_6b_DESC:2 "Aparently the Temple of Delphi was sacked and their treasures stolen. This sacrelige caused the series of holy wars in central Hellas. We could use this and take up a mantle of the one who will restore peace and order to Greece. If by chance we will become the next Hegemon than who will blame us?"
 macedon_01_macedonia_99:0 "New Hegemon"
 macedon_01_macedonia_99_DESC:2 "Finally after all those years Greece has new master. Now the centuries of chaos are over. Merchants can travel from Pella to Athens withous fear. Farmers can plow their fields and be sure they will live to see them harvested. All that thanks to their new Macedonian overlords. Now there is the time to unite with the greeks overseas who suffer from opression of foreign kings."
 #Kushite mission tree 1
 #Starter
 kush_01_egypt:0 "Kushite Invasion"
 kush_01_egypt_DESCRIPTION:0 "Kushites lived for hundreds of years under the shadow of their northern neighbours. Egyptian reign began with military outposts and expeditions but soon they started to colonize the area and they even created a series of fortresses to maintain control over it. But now egypt is in a state of civil war and Kush have a new rulers. Leaders of Napata looked at the pharohs with envy. They started to reform Nubia into a proper centralised state and now seeing the oportunity that may not repeat itself kushites started war preparations. But one do not always need to fight with a sword."
 kush_01_egypt_CRITERIA_DESCRIPTION:0 "Follow the path of legendary Nubian kings like Kashta and Piye. Invade Egypt and become the first nubian on the throne of pharohs."
 kush_01_egypt_BUTTON_TOOLTIP:0 "Follow the path of legendary Nubian kings like Kashta and Piye. Invade Egypt and become the first nubian on the throne of pharohs."
 #Missions
 kush_01_egypt_1:0 "Wife for the God"
 kush_01_egypt_1_DESC:2 "The post of a Wife of Amun at Thebes is a very important position. It allows to control the second most important institution in the country, the theban temple. Now the position is empty and we have a potential candidate in mind. Because who will be more loyal wife of a god than the future pharohs daughter?"
 kush_01_egypt_2:0 "Without a Fight"
 kush_01_egypt_2_DESC:2 "The mere fact that egyptian priesthood even considered your daughter as a candidate to the holy office is the testament to their desperation. Maybe a small show of force will manage to convince them to acnowlenge your claim to the throne officially."
 kush_01_egypt_3:0 "Claiming the Throne"
 kush_01_egypt_3_DESC:2 "Nubia was last time a part of the Egyptian Empire more than two centuries ago. Thou we belong to old nobility and surely we can track our heritage to the Ramasside dynasty I'm afraid that no one will care about it. Still if we want to be one of the claimants we need to make it known that kushites will march north to bring order and not as raiding party."
 kush_01_egypt_4:0 "Wadi Hammamat"
 kush_01_egypt_4_DESC:2 "Wadi Hammamat or Wadi in general are rivers that flow only periodically during the rains. Hammamat was an important trade network connecting our country with the land of Melluha (India) during the times before civil war and with a bit of effort it can be opened again."
 kush_01_egypt_5:0 "Nominal Vassals"
 kush_01_egypt_5_DESC:2 "There are three major political centers in Upper Egypt: Thebes which by now are under control, Hermapolis and Heracleopolis. The nomarchs of the two remaining cities pledged their allegience but we did not recieve any tribute or hostages so their loyalty is basically nonexistant. We may be forced to directly take control over this region."
 kush_01_egypt_6:0 "Lord of Two Lands"
 kush_01_egypt_6_DESC:2 "It's almost poetic that this time things end as they started, with the war between the Northern and Southern Egypt. The Delta will be filled with fortresses and marshlands, we will have to fight for every crossing but we haven't come this far to give up now."
 kush_01_egypt_7:0 "Western Desert"
 kush_01_egypt_7_DESC:2 "There are four main egyptian oases: Kharga, Dakhleh, Baharia and Farafra. Togather they serve both as important stops on the caravan trail and a natural shield protecting Kemet from the libyan raids and as libyans become a serious issue these days it is imperative for us to restore those outposts. "
 kush_01_egypt_8:0 "Kushite Empire"
 kush_01_egypt_8_DESC:2 "The capital of Egypt changed over time but the coronation ceremony was usually held at Memphis. Coronation was usually 70 days after the previous pharoh's death and was officiated by the High Priest.  The new pharaoh would receive sacred regalia, including various crowns like the Double Crown (Pschent), the false beard, the Heka sceptre, and a bull's tail, each symbolizing different aspects of royal power and divinity. After that king traditionally embarked on a jurney accross the Egypt to vosot the temples and receive blessings. And sometimes made decision which city will be the new capital. "
 kush_01_egypt_9:0 "Defending the Delta"
 kush_01_egypt_9_DESC:2 "It was somewhere in the vicinity of Great Bitter Lake that the legendary campaign of pharoh Shoshenq I started with the battle against the Shasu. Thou the Egypts traditional defenses are centered on the city of Pelusium the area south of it is equaly important and was in a way of many berber raids on the Nile valley. It's imperative to reestablish control over this important region. Our expeditionary unit found the perfect site, a village called Clysma."
 kush_01_egypt_10:0 "Bread Basket of Mediterrainean"
 kush_01_egypt_10_DESC:2 "Since time immemorial Egypt was known from it's grain export. During the Bronze Age Collapse when pirates ruled the seas the grain industry was hit hard and the subsequent civil war only put the nail to it's coffin. Now when country is stable again we are finally able to bring back the grain trade to the level from before the crisis."
 kush_01_egypt_11:0 "Greeks in Egypt"
 kush_01_egypt_11_DESC:2 "Hearing about the end of the egyptian civil war and the economic recovery of the state the sea faring greek arrived into the western part of the Delta region and began to settle there. We heard they are disciplined soldiers and daring merchants that travel throu the Mediterrainean Sea opening old trade routes. We can use them to defend our new egyptian posessions."
 kush_01_egypt_12:0 "Vassal States"
 kush_01_egypt_12_DESC:2 "Nile Delta is very hard to control, especially for a new foreign dynasty. Trying to find solution advisors proposed the creation of vassal states loyal to the throne. This could relief some pressure from treasury and local kings could provide troops for our campaigns."
 kush_01_egypt_99:0 "Kushite Egypt"
 kush_01_egypt_99_DESC:2 "Finally for the first time in history kushite sits on the egyptian throne. The last attempt at conquest of Egypt was made seven centuries ago. Throu all this time Kush was a patchwork of different tribes that were busy fighting each other instead of their real enemies. No more! From now on All will fear the us for we are sons of Ra!"
 #Assyria mission tree 1
 #Starter
 assyria_01_mesopotamia:0 "The Land of Ashur"
 assyria_01_mesopotamia_DESCRIPTION:0 "Assyria have no serious natural borders, except the Euphrates river which is long and not really easily defendable. After the events of Bronze Age Collapse the followers of Ashur found themselves under siege conducted by the Aramean tribes that until this point lived on the edges of civilisation. Yet thanks to the capable leadership they managed to push invaders back and now they are the only real regional power."
 assyria_01_mesopotamia_CRITERIA_DESCRIPTION:0 "Follow the path of Assyrian kings like Tiglath-Pilaser III and conquer the Mesopotamia. End the crisis that started with the Bronze age Collapse by any means necessary."
 assyria_01_mesopotamia_BUTTON_TOOLTIP:0 "Follow the path of Assyrian kings like Tiglath-Pilaser III and conquer the Mesopotamia. End the crisis that started with the Bronze Age Collapse by any means necessary."
 #Missions
 assyria_01_mesopotamia_1:0 "Desert Raiders"
 assyria_01_mesopotamia_1_DESC:2 "The Bit Hatallu tribe dared by the supposed political weakness decided to raid western provinces of Assyria. Which is a very big mistake. Assyrian monarch need to punish them for their insolence."
 assyria_01_mesopotamia_2:0 "National Standing Army"
 assyria_01_mesopotamia_2_DESC:2 "The Assyrian religion required from it's followers to wage yearly campaigns against the enemies of the state and thanks to the Assyrias location there always were enemies to fight. Pilaser knowing that king cannot be at all places at once and most of the attacks army had to face was in form of raids decided that a new solution was needed."
 assyria_01_mesopotamia_3:0 "Aramean Influence"
 assyria_01_mesopotamia_3_DESC:2 "The ascension of half-aramean to the throne brought important changes to the assyrian culture. The large number of imperial citizens were of aramean descent and aramean language was way easier in use than akkadian. The change of the language and assimilation of arameans especially those living closer to the heartland may reinvigorate the imperial economy and provide new recruits to our army."
 assyria_01_mesopotamia_4:0 "The Upper Sea"
 assyria_01_mesopotamia_4_DESC:2 "Akkadians called the surrounding seas the Upper and Lower, mainly because of the direction of the rivers Tigris and Euphrates. The traditional ritual when akkadian king conquered the coast of the sea was for him to wash his wepons in a sea water. The main obstacle on path to the Mediterrainean is the city of Arpad and it's aramean and hittite allies. Maybe with some luck we will manage to convince some to accept assyrian domination instead of fighting us."
 assyria_01_mesopotamia_5:0 "Enemy of My Enemy"
 assyria_01_mesopotamia_5_DESC:2 "Damascus was for a long time the center of anti-assyrian resistance in the Levant. They are the largest state in the region and often they were leading the coalitions of neighbouring states against assyria. Lately they came into conflict with their jewish allies. Without the support of Samaria they will not be a serious threat for our forces. Maybe it will be a good idea to remind the Samarians about their kings oath."
 assyria_01_mesopotamia_6:0 "Roforming The Canaan"
 assyria_01_mesopotamia_6_DESC:2 "Canaan is perhaps the most important region in the Middle East. It's a direct road to Egypt and is filled with various groups that do not like each other to put it mildly. There are reforms needed to pacify the region. Of course not everyone will like it."
 assyria_01_mesopotamia_7:0 "New Capital"
 assyria_01_mesopotamia_7_DESC:2 "For Centuries Ashur was the name of both the country (Assyria or Mat Assur literally means land of Ashur) and the city. Assyrian kings tried many times to change the capital for various resons like the need to distance themselves from scheeming nobility. Now in the middle of conflict with Urartu city called Nineveh seems a more fitting capital than Ashur. It's closer to the northern border and not far from the previous capital."
 assyria_01_mesopotamia_8:0 "Pulu"
 assyria_01_mesopotamia_8_DESC:2 "It is not some secret that our current king lacks proper heir that could successfully lead Assyria in the coming struggles. The aristocracy seems to be happy about this fact but some military officers started openly talking about the kings brother popularily called Pulu, the half-aramean to become an heir or even to take the throne right away. Tiglath-Pilaser have military training and served with the army so there will be no issue from that direction. Nobility are the bigger issue. Strong ruler is the last thing they want."
 assyria_01_mesopotamia_9:0 "Gardens of Niniveh"
 assyria_01_mesopotamia_9_DESC:2 "Royal palaces are the testament of the strangth of the kingdom. Country such as ours needs a seat of power worthy of a title King of Kings. One of the kings wives comes from media and gave our ruler an inspiration on how we can show the power of our nation. The palace we will built will be one of a kind. It will have the biggest garden in the whole world because there will be one for every level with plants from all corners of the realm."
 assyria_01_mesopotamia_10:0 "Babylon"
 assyria_01_mesopotamia_10_DESC:2 "Babylon was not only a holy place for babylonians but for the Akkadians as a whole, including assyrians. That's why despite their obvious superiority and the weakness of the Babylonian state Assyria tried to aid their southern neighbour by carrying our interventions when chaldean tribes began stirring troubles. Yet the Babylon's constant issues do not end so it becomes clear that a firm hand is required."
 assyria_01_mesopotamia_11:0 "Babylonian Authonomy"
 assyria_01_mesopotamia_11_DESC:2 "Babylon is not as easy to rule over as the northern mesopotamia or the numerous kingdoms of the Levant. It's heavily urbanized and the south of the country is covered with marshes where the whole army can be hidden away so after consideration and negotiations with the local elites we came into a conclusion that new solution is needed."
 assyria_01_mesopotamia_99:0 "King of Kings"
 assyria_01_mesopotamia_99_DESC:2 "After a lot of effort and countless horrors necessary to bring back obedience Assyria managed to bring Middle East under control. The citizens of the empire can once again feel safe from raids and opression of various warlords that plagued region in the past. Glory to Ashur and his viceking."
 #Lydian mission tree 1
 #Starter
 lydia_01_anatolia:0 "Heirs of Arzawa"
 lydia_01_anatolia_DESCRIPTION:0 "Lydians are the heris of the Arzawa Confederation. This fiercely independent nation for all it's existance repelled invasion after invasion of Hittites, Acheans and now Phrygians. Those experiences forced them to reform their society and found a centralised kingdom that will be able to defend them. This kingdom will be soon put to the test since another invader marches from the north."
 lydia_01_anatolia_CRITERIA_DESCRIPTION:0 "Follow the path of legendary kings of Lydia and conquer Asia Minor. You'll face powerfull oponents so be prepared for anything. Use all matters at your disposal to repell the foreigners from your lands."
 lydia_01_anatolia_BUTTON_TOOLTIP:0 "Follow the path of legendary kings of Lydia and conquer Asia Minor. You'll face powerfull oponents so be prepared for anything. Use all matters at your disposal to repell the foreigners from your lands."
 #Missions
 lydia_01_anatolia_1:0 "Lydian Lion"
 lydia_01_anatolia_1_DESC:2 "In anatolia we have access to a number of gold mines. Gold, as a rare metal, could serve as an intermediate commodity serving as an intermediary in the exchange of goods. This could greatly boost our economy. We even have first project of a new round object with roaring lion carved on it."
 lydia_01_anatolia_2:0 "Looking for Help"
 lydia_01_anatolia_2_DESC:2 "We are surrounded by powerfull oponents and foreign invaders are about to arrive. We need an outside help if we are to survive. Luckly there are countries in same position as we are and recently we learned that Assyria is in conflict with Phrygia over the Syro-Hittite states. Maybe the old saying 'the enemy of my enemy' will work in this situation?"
 lydia_01_anatolia_3:0 "Carian Allies"
 lydia_01_anatolia_3_DESC:2 "Carians and Lydians both are bith members of Luwian culture group. We can use those relations to our advantage. We believe we can convince the Carians to once again stand with us side by side. After all we once did under the banner of Arzawa Confederation. It benefited us then and can benefit us now. Also if we convince Carrians than maybe the local greeks will join them as well."
 lydia_01_anatolia_4:0 "Ionian Greeks"
 lydia_01_anatolia_4_DESC:2 "Greek mercenaries fight for our cause some time now. Their skills and loyalty is unquestionable. Yet their colonies are vonourable to attack and greek themselves are very devided. Maybe if we will propose a protection for a fee they will volountarily agree. We could use this tribute to boost our defenses."
 lydia_01_anatolia_5:0 "Treres"
 lydia_01_anatolia_5_DESC:2 "Our northward expansion has been halted by an unexpected obstacle. Mysians, being related to Phrygians, have been under the protection of Phrygian empire for more than a century now and their forces are substancial. But what if we could be able to create a distraction? On the other side of Bosphorus there are many envious tribes. One may be strong enaugh to deal with the mysians for us."
 lydia_01_anatolia_6:0 "Topling the Phrygians"
 lydia_01_anatolia_6_DESC:2 "Phrygians controlled the central plains for far too long. Those lands belong to us. Time to defeat these foreign hordes and chase them back to Thrace!"
 lydia_01_anatolia_7:0 "Scythian Intervention"
 lydia_01_anatolia_7_DESC:2 "It were ultimately the scythians who forced the Cymmerians to arrive here the first time so after a heated debate idea was proposed to fight nomads with nomads and invite the Scythians into Anatolia."
 lydia_01_anatolia_99:0 "Lords of Asia"
 lydia_01_anatolia_99_DESC:2 "We have survived the Cymmerian Invasions and used the oportunity to expand our dominion throuthout the western Anatolia. We are also the most powerfull regional player with booming economy. One day all will call us the Kings of the world!"
 #Carthaginian mission tree 1
 #Starter
 carthage_01_africa:0 "New City"
 carthage_01_africa_DESCRIPTION:0 "Founded barely century ago Tyrian colony in Carthage was meant to serve as an important stop on a vital trade route from Levant to Spain. Because of it's location city grew in size, importance and it's leaders began to have thair own ambitions for the western mediterrainean region."
 carthage_01_africa_CRITERIA_DESCRIPTION:0 "Follow the path of Carthaginian traders and armies and take control over important trade routes from eastern mediterrainean to Spain. Conquer the region in the name of Ba'al Hammon."
 carthage_01_africa_BUTTON_TOOLTIP:0 "Follow the path of Carthaginian traders and armies and take control over important trade routes from eastern mediterrainean to Spain. Conquer the region in the name of Ba'al Hammon."
 #Missions
 carthage_01_africa_1:0 "Carthaginian Trade"
 carthage_01_africa_1_DESC:2 "Thanks to the strategic location and competent leadership Carthage quickly outgrew all other neighbouring colonies becoming the biggest regional power. The New City as it's name is translated chose the trade as it's main source of income utilizing the trade route from Levant to Iberia."
 carthage_01_africa_2:0 "Neighborly Rivalry"
 carthage_01_africa_2_DESC:2 "Utica is one of if not the oldest phoenician colony so it's not surprising that on every opportunity Uticans try to assert dominance over the other colonies. Carthage is however bit bigger and richer than Utica so it naturally over time became a rival. The winner of this confrontation will be able to unite the phoenicians of the west so the reward will be worth the effort. "
 carthage_01_africa_3:0 "New Leadership"
 carthage_01_africa_3_DESC:2 "With Utica out of the picture the negotiations with other colonies begin. Tyre is busy with the imperial powers recovering from the crisis and can no longer provide protection. With that in mind the western colonies need to look for a new leadership. Maybe it's time for Carthage to take that position."
 carthage_01_africa_4:0 "Kings of Carthage"
 carthage_01_africa_4_DESC:2 "Foreigners often call the rulers of phoenician colonies kings because despite being elected officials and with their period in office being limited they had a lot of power in their hands. Sometimes successfull (or cunning enaugh) leaders could keep the post in their family for longer period. The Magonid clan was among the most successfull families that held this position in their hands."
 carthage_01_africa_5:0 "Colonies of our Own"
 carthage_01_africa_5_DESC:2 "With the new economic growth the Carthaginians started to think about creating their own colonies the same way they were once the colony of Tyre. There are several propositions in places like Baleares, Sardinia, Sicily or on the Coasts of Africa. Some of them belong to other nations but with our newfound strength we believe that we can take them by force if necessary. (This mission enables the creation of far away colonies via new set of decision)"
 carthage_01_africa_6:0 "The Numidians"
 carthage_01_africa_6_DESC:2 "The Libyans are divided into two groups. The Libyans proper from Egypt to the Tritonis that are more nomadic in nature and the Amazigh people that have more fertile homeland especially closer to the mediterrainean coast and thanks to this fact are more sendentary. They lived here for centuries before our ancestors stepped foot on this land and convincing them to benefits of our rule could greatly halp with our manpower shortages and boost economy."
 carthage_01_africa_99:0 "Masters of the Western"
 carthage_01_africa_99_DESC:2 "Despite all odds Carthage managed to unite the western colonies and take control over western mediterrainean sea. Will it be enaugh to assure safety to the growing republic? There will be more challenges ahead but we will face them with the biggest fleet in the west!"