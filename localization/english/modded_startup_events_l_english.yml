l_english:
 #Startup Event Texts
 esfa_startup.1.t:0 "Ancient Italy"
 esfa_startup.1.desc:0 "The people of ancient Italy are devided on three separate ethnic groups. The Etruscans and related people, the Latinc and Italic tribes. While the later are of indo-european origin etruscans are native to the land and are on much higher civilisation level than their neighbours. They managed to create a loose confederation and dominate the northern and western italy and even start colonizing the Po river valley. \n Their expansion influenced the Latins who sometimes counted as italic culture adopted both etruscan religious rites and elements of greek culture. The original founding myth of Rome claimed that city was founded as a greek colony by the merchant Romos from Arcadia. \n The last culture group is often named Osco-Umbrians because of the languages used. To the oscans we can include the large southern tribes like Samnites and Lucanians while Umbrians not only consist of Umbrians proper but also for example Volsci the tribe between the Latium and Campania."
 esfa_startup.1.a:0 "And so it begins."
 esfa_startup.2.t:0 "Celts"
 esfa_startup.2.desc:0 "Probably the most numerous culture group in Europe at the time. Their quick expansion was much due to the calamity that engulfed the europe during and shortly after the Bronze Age Collapse. There is also a theory that the Celts are a result of mix between Alpine tribes and culture that was responsible for Atlantic tin trade between the isles and mediterranean. This theory is called Celts from the West. Celts themselves were led by the cast of so called druids. Those priests of sorts were the intelectual and religious elite of celtic society and were able to use their status to unite the tribes in times of need. /n The latest wave of Celtic expansion engulfed the Italian and Iberian Peninsulas. In Italy a several tribes crossed the alps and entered the Po valley near Milan where cletic presence from previous incursion was already well established."
 esfa_startup.2.a:0 "And so it begins."
 esfa_startup.3.t:0 "Ligurians"
 esfa_startup.3.desc:0 "Ligurians are a misterious people from the northern coasts of the western Mediterrainean sea. We do not know whether they were indo-european or not thou in later years they underwent increasing celtisition process under pressure from the celts migrating from the north. In ancient times they were present all the way from Catalonia to Toscany but later on they were pushed back by clets and iberians."
 esfa_startup.3.a:0 "And so it begins."
 esfa_startup.4.t:0 "Illyria"
 esfa_startup.4.desc:0 "Illyrians were known as pirates and mercenaries of bad reputation (their loyalty was very much nonexistant). The name Illyrians means sea serpents. The region was devided on three main groups starting from the non-indo-european Histrians known also as Castellieri culture (from the fortifications reminding the greek mycenean ones), around them lived Liburnians known from the Celtic influeances and lastly the Illyrian themselves. Messapians the illyrian culture group could also be found in south eastern italy."
 esfa_startup.4.a:0 "And so it begins."
 esfa_startup.5.t:0 "Nuragian Vikings"
 esfa_startup.5.desc:0 "Suspected to be legendary Shardana who brought the bronze age apocalypse to the eastern mediterrainean ancient inhabitants of sicily were later known from their fortresses called Nurhage. The horned helmets that are iconic to their warriros are not unique to their culture as many historians claim and were probably sort of talismans to the twin gods of war. We know that their rituals were somehow connected to the water cause in some Nurhage small pools can be found."
 esfa_startup.5.a:0 "And so it begins."
 esfa_startup.6.t:0 "Greeks"
 esfa_startup.6.desc:0 "The collapse of Mycenean Greeks was even more painfull than the other eastern mediterrainean powers. The situation was bad enaugh that the writing sources disappear for a couple of centuries and reappear written in a completely different writing system. The evidance for supposed dorian invasion are nonexistant but in mycenean doru was a term for a slave so from this we can deduce that the issue was more internal than external. On Euboea the situation was more stable and they are the first polis (city-state) to overcome the crisis. Than with time and new political developments the situation improved and population began to increase. This subsequently caused the seafaring greeks to look for new places to settle to aliviate the pressure on the metropolis. Sometimes the settlers were chosen volountary sometimes randomly but soon the greek outposts started to appear all around the Meditarranean Sea."
 esfa_startup.6.a:0 "And so it begins."
 esfa_startup.7.t:0 "Canaanites"
 esfa_startup.7.desc:0 "During the Bronze Age Collapse while Sea Peoples attacked from the sea Arameans migrated from the east. This caused the mass migration to the cities on the coast that managed to avoid the attacks (probably by bribing the invaders). When calamity ceased the phoenicians found themselves without the great power in sight for the first time in centuries. They were the first to open the international trade and acording to greeks they influenced the creation of a new greek alphabet based on phoenician one. When the old powers started the return to their former position a new wave of colonists moved west."
 esfa_startup.7.a:0 "And so it begins."
 esfa_startup.8.t:0 "Thracians"
 esfa_startup.8.desc:0 "Thracians are so numerous that neighbouring Greeks often joked that they could rule the world if they were able to unify. Thracian ocupied territory spans from The northern Carpathians to the central Anatolia where some tribes migrated after the collapse of the Hittite Empire. The migrating tribes founded there the sizable kingdom of Phrygia with capital at Gordion. Currently that relm is under attack from migrating Cymerians that were pushed out of Crimean steppes by the Scythians."
 esfa_startup.8.a:0 "And so it begins."
 esfa_startup.9.t:0 "Children of Ra"
 esfa_startup.9.desc:0 "For the inhabitants of Egypt or as they call it Kemet from the fertile black soil brought by the river Nile the Bronze Age Collapse was more mercifull than for most of their neighbours. This is much thanks to the efforts of the pharoh Rameses III who managed to defeat the Sea Peoples fleet in the famous battle in the Nile Delta and the migratory horde in the battle somewhere in Synai. His heirs tried to emulate their ancestor (also by taking his name) but in a result of costly campaigns against new waves of invaders the country was weakening and finally by the time of Rameses XI egypt lost all it's posessions in Canaan and Nubia. Than the Libyan tribes of Libu and Meshwesh which migrated in the previosu waves decided to make their move and took power in egypt. Initially the country managed to stabilize especially under Shoshenq I who even restored influence in Canaan for some time but his descendants by giving away important positions to members of their family ultimately led to fragmentation of the country. Now egypt has two branches of the Shoshenkid clan fighting for the throne in the Delta, basically independent governors in the Upper Egypt and potentially Nubians invading from the south under their new leader Kashta who (like everyone) also dreams about becoming a new pharoh. But maybe the former priest of Neith and leader of the western Deltans Tefnakht who managed to convince libu tribes to his cause have a chance to save the country? Only time will tell."
 esfa_startup.9.a:0 "And so it begins."
 esfa_startup.10.t:0 "Libyans"
 esfa_startup.10.desc:0 "Libyans till this time living in the shadow of Egypt managed to finally make their mark on history. For the first time libyan chiefs of the Ma tribe managed to become the Pharohs of Kemet. during the events of the Bronze Age Collapse the libyan tribes from Cyrenaica (Liby and Meshwesh, Ma for short) migrated into Nile River Valley. Their army under Ded and Merjey was crushed but pharohs recognized their potential and allowe them to settle in Egypt under condition that they will deliver warriors to it's defense. Than step by step libyans climbed on the ladder of egyptian society to finally force the pharoh Siamun to name one of them heir. Yet after some time passed the traditional clan structure led to internal divisions and ruling clan devided the country. Now libyans fight against libyans over egyptian throne and natives have chance to overthrow them. There are also romours about powerfull Nubian king Kashta plans of invading Egypt. Will the desert nomads manage to hold on to Kemet?"
 esfa_startup.10.a:0 "And so it begins."
 esfa_startup.11.t:0 "Nubians"
 esfa_startup.11.desc:0 "Forever under the Egyptian ocupation Nubians for the first time have a real chance to repay their egypitan neighbours for their opression. This time Egypt is in state of internal conflict and Nubians in turn were recently united under their king Kashta. But kushites themselves look at Egypt not only with hate but also with envy. They mimic the egyptien culture and religion, they build pyramids, their ruler call himself pharoh and in time have ambition to be a real egyptian monarch. To be the first kushite on the throne of Kemet. "
 esfa_startup.11.a:0 "And so it begins."