l_english:
 ######
 #####Akkadian
 ######
 akkadian_philosophy:1 "Akkadian Traditions"
 akkadian_philosophydesc:3 "The Akkadians were a very militant people and were no strangers to war. Their units are characterized by high morale and great diversity due to their location at the crossroads of many cultures. "
 tradition_unlock_requirement_akkadian:0 "You don't have enough population of Akkadian descent to unlock the tradition. "
 #New Traditions
 akkadian_path_1:0 "Akkadian Chariots"
 akkadian_path_1_desc:0 "The first decision of assyrian king after the dust of the Bronze Age Collapse have settled was to reform the chariot division. Chariots meaning decreased in time from elite core of mesopotamian military to pure symbol but it didn't happen in a day."
 akkadian_path_2a:0 "Mesopotamian Phalanx Formation"
 akkadian_path_2a_desc:0 "Akkadians as well as Greeks used the phalanx formation since the Bronze Age yet with the changing conditions where their new enemies like Medes and Scythians began using hit and run tactics they added the line of archers behind the line of soldiers. This way formation could effectively fight the enemy scirmishers. "
 akkadian_path_3a:0 "State Armouries"
 akkadian_path_3a_desc:0 "Assyrians had a system of state owned armouries that could quickly provide the soldiers with standardized military equipment. This way new inventions like special new shelds able to scatter the wepons impact enabling the weaker soldier to face stronger oponents."
 akkadian_path_4a:0 "Median Cavalry"
 akkadian_path_4a_desc:0 "Assyrians used the eastern mercenaries as a cavlary units and learned from them a bunch of steppe tactics like fake retreat. The Scythian and Median horsearchers are frequently deicted in assyrian art fighting both for and against Assyrians."
 akkadian_path_2b:0 "Psychological Warfare"
 akkadian_path_2b_desc:0 "Practical Violence is a general term for using all kinds of attrocities to force the enemies to surrender without a fight. Assyrians were especially known to use that tactic extensively mostly to force the besieged cities to open their gates before them. "
 akkadian_path_3b:0 "Religious Mandate"
 akkadian_path_3b_desc:0 "Assyria's real name is the Land of Ashur with Ashur being the main god of the local pantheon. Assyrian believed yearly war to be their religious duty and the king's main task was to lead those yearly campaigns. King himself was a ruler for the outsiders but his own subjects knew him as a viceroy of the real king, god Ashur."
 akkadian_path_4b:0 "Assyrian Road Network"
 akkadian_path_4b_desc:0 "The Assyrians introduced the road system as the standard for future empires. This made it easier to move both own and enemy troops. From time to time there was a checkpoint by the road to ensure safety and supplies for travelers and messengers. "
 akkadian_path_2c:0 "Forced Resettlement"
 akkadian_path_2c_desc:0 "To deal with rebellious populations the standard assyrian practice was to forcibly resettle them to other parts of the country to break the personal connection between people and the land they live in."
 ######
 #####Iranian
 ######
 iranian_philosophy:1 "Aryan Traditions"
 iranian_philosophydesc:3 "Iranians are experts in mobile warfare. Their cavalry is second only to the Scythian ones, and their militant nature only makes them more dangerous. "
 tradition_unlock_requirement_iranic:0 "You don't have enough population of Iranian or Avestan descent to unlock the tradition. "
 #Traditions
 iranian_path_1:0 "Iranian Light Chariots"
 iranian_path_1_desc:0 "The Iranians, as well as the inhabitants of Mesopotamia, used chariots for a very long time. Because of its semi-nomadic nature in a lightweight version. Later this role was taken over by light cavalry. "
 iranian_path_2a:0 "Iranian Shield-Bearers"
 iranian_path_2a_desc:0 "Usual tactic used by the Persians in the early period, was to form a shield wall with archers behind infantry shooting over the formation. These troops called sparabara (Shield-Bearers) were equipped with a large rectangular shield called a spara, and armed with a spear around six feet long."
 iranian_path_3a:0 "Arrows to cover the sun"
 iranian_path_3a_desc:0 "Iranian men were taught archery from an early age. During the battle, the archers led massive fire at the compact enemy formations immobilized by the Shield-Bearers. "
 iranian_path_4a:0 "Median Horse Archers"
 iranian_path_4a_desc:0 "Median warhorses were larger than Mesopotamian mounts and allowed the riders to take more equipment. They gradually replaced chariots because of their greater mobility over rough terrain."
 iranian_path_5a:0 "The ingenuity of the Iranians"
 iranian_path_5a_desc:0 "The Iranians did not just use brute force in the way of conquest. They bribed the defenders as necessary or, as in the case of Babylon, they used engineers to change the riverbed to cross the moat."
 iranian_path_6a:0 "The ingenuity of the Iranians"
 iranian_path_6a_desc:0 "The Persians took over and significantly built up the Akkadian road system. Due to the long distances, in order to keep the empire intact, the troops of the King of Kings had to move quickly to reach the places of trouble. Imperial roads greatly reduced the response time so important to peace-keeping."
 iranian_path_2b:0 "Bridges over the sea"
 iranian_path_2b_desc:0 "Nothing was impossible for the Persians. There were no obstacles to cross the mountains or the sea. In order to cross the Bosphorus, the Lord of the Four Side of the World simply ordered a bridge to be built, and when the sea tried to prevent him, he had to treat it with a whip. The construction was completed without any further obstacles."
 iranian_path_3b:0 "Persian Homeland"
 iranian_path_3b_desc:0 "The homeland of the Persians accustomed them to fighting in the open, where there was plenty of room for maneuvers of light Persian troops. This relationship was often used by their enemies. In addition to the Greeks, there are many reports of Afghanistan's mountain tribes still lingering. Some things never change."
 iranian_path_4b:0 "Bactrians in service of Persia"
 iranian_path_4b_desc:0 "Ancient Afghans were divided into Bactrians and Archosians, the most influential of whom were the Pactians known today as the Pashtuns. They had been a highly independent people ever since, and the deep knowledge of the area made pacification difficult. The Achaemenids probably began to bring Greeks from Ionia here in part to disrupt the tribal ties of the natives."
 iranian_path_5b:0 "Elamite Mountain Tribes"
 iranian_path_5b_desc:0 "From the reliefs left after the burning of Persepolis we know that the Elamites had great influence in Persia, and their troops served in the Imperial army."
 iranian_path_2c:0 "The city of Anshan"
 iranian_path_2c_desc:0 "The occupation of mountain Anshan (the second most important city of the Elamites) allowed the Persians from a group of tribes to become one of the major kingdoms of the Middle East. From the data it appears that the Elamite aristocracy was peacefully absorbed into the structures of the Persian administration and military."
 iranian_path_3c:0 "Persian Haivarabam"
 iranian_path_3c_desc:0 "The Persian army was devided on units of 1000 called Hazarabam, and these units were further devided into Haivarabam or divisions. The Persians also recruited countless tribes from the Iranian plateau, providing the state with a steady stream of recruits. "
 iranian_path_4c:0 "Lenient Rulers"
 iranian_path_4c_desc:0 "The rulers of Persia were known for their gentle approach, which made them very popular among their subjects. This was in part the influence of the multicultural nature of their country where any repression could have had dire consequences."
 iranian_path_path_end_bonus:0 "Persian Peace"
 iranian_path_path_end_bonus_desc:0 "The Persians for the first time since the Sargon and Naram-Sin empires brought peace from Anatolia to India. Thanks to the Persian army, the merchants could reach the farthest corners of Asia without any obstacles. People stared at the countless troops of the King of the Four Corners and trembled at the mere thought of rebellion."
 ######
 #####North Aryan
 ######
 nomadic_philosophy:0 "Scythian Traditions"
 nomadic_philosophy_desc:0 "Cymmerians and Scythians were often the topic of many scary stories that mothers in sendentary societies told to their children. Fear they imposed on their enemies was sometimes the most powerfull wepon in their arsenal. Their hard nomadic life molded them into tough and terrifying warriors."
 tradition_unlock_requirement_scythic:0 "You don't have enough population of Scythian descent to unlock the tradition. "
 #New Traditions
 nomadic_path_1:0 "Scythian Warriors"
 nomadic_path_1_desc:0 "While in the south horses were bread with heavily armoured rider in mind to the north they were bread to be faster than their oponents. Warriors of the steppes fought primarily in light armour carrying composite bows which enabled them shooting from horseback at full speed."
 nomadic_path_2:0 "Nomadic Lifestyle"
 nomadic_path_2_desc:0 "The peoples of the steppe did not live in permanent settlements but in tents that could be easily moved to another location in case of harsh winter or enemies close by. The most surprisong thing during fighting nomadic armies was their speed. Nomads were used to living of the land and they never needed supply lines to operate."
 nomadic_path_3:0 "Cataphracts"
 nomadic_path_3_desc:0 "The eastern response to the more heavily armoured cavalry. Steppe Cataphracts might not have been as heavily armoured but they were fighting like the later knights with longer lances. Also they were able to shoot from a bow like other nomadic units."
 nomadic_path_3a:0 "Steppe Warfare"
 nomadic_path_3a_desc:0 "The worst terrain to fight the nomads were the open fields of the steppe. The nomads having enaugh space could easily lure enem troops with false retreats surround them and destroy the enemy formation piece by piece."
 nomadic_path_4a:0 "Terrifying Siege"
 nomadic_path_4a_desc:0 "The typical strategy for capturing fortified settlements was to surround them and cut away their supplies, if that didn't worked the nomads started playing dirty by throwing poisoned animals or using human shields. People of the steppe were practical people, they didn't had time for mercy."
 nomadic_path_3b:0 "Black Forest Tribes"
 nomadic_path_3b_desc:0 "Not all the Scythians lived in steppe. Some tribes inhabited the northern edges of it like the Black Forest in todays northern Ukraine. They were mostly hunter gatherers and didn't had to use horses so extensively because of their sendentary lifestyle."
 nomadic_path_4b:0 "Northern Forts"
 nomadic_path_4b_desc:0 "Even in wild land such as the Black Sea Steppes there can still be the light of civilisation. Greek merchants traded extensively with local tribes that served as the middle man between the hellenes and the inhabitants of the Baltic coasts."
 ######
 #####Indo-Aryan
 ######
 vedic_philosophy:0 "Indo-Aryan Traditions"
 vedic_philosophy_desc:0 "The early Vedic armies consisted of four parts or arms (chaturanga), infantry, cavalry, chariots, and elephants. Kings were usually raised as warriors from an early age and learned to seek domination over other Indian rulers. "
 tradition_unlock_requirement_vedic:0 "You don't have enough population of Vedic descent to unlock the tradition. "
 #Traditions
 vedic_path_1a:0 "Vedic Chariot"
 vedic_path_1a_desc:0 "Battle chariots (sangramika) were used as mobile command platforms. They were able to carry archers who could shoot while moving throughout the battlefield. Yoked with two to four horses, chariots could mow down enemy infantry yet their construction allowed them to be used only in the plains and not for ambushes"
 vedic_path_2a:0 "Aryan influences"
 vedic_path_2a_desc:0 "The bow was an exceptionally popular weapon among the Vedic tribes. Most of the infantry could shoot it when necessary, archers fired from chariots, and the nobility also liked to show off their shooting skills. "
 vedic_path_3a:0 "Indian War Elephant"
 vedic_path_3a_desc:0 "Indian elephants were mainly used in the form of a battering ram in the middle of the formation, which had its advantages and disadvantages, because elephants are moody beasts and sometimes they trampled their own troops despite the great effort put into their training. "
 vedic_path_4a:0 "Indian Infantrymen"
 vedic_path_4a_desc:0 "The infantry was not organized in tight formations, because with elephants it would not be a good solution. The main task during the battle was to find the enemy commander and eliminate him. "
 vedic_path_5a:0 "Vedic Cavalry"
 vedic_path_5a_desc:0 "The cavalry carried two lances and a small round shield. It could fulfill many roles, such as cutting off the enemy from reinforcements, attacking from the flank and from behind, or reconnaissance. "
 vedic_path_6a:0 "Persian Gulf trade lines"
 vedic_path_6a_desc:0 "The calming of the situation and the emergence of larger countries allowed for the restoration of trade with the Middle East, which in turn forced the creation of small fleets to protect the merchants. "
 vedic_path_1b:0 "Knowledge of local terrain"
 vedic_path_1b_desc:0 "The wild jungles and forests may have been what inspired the flexibility of the Vedic infatrymen, who, in switching armament dependent on situation, could function just as well in low visibility, as in the open plains."
 vedic_path_2b:0 "Chariot innovations"
 vedic_path_2b_desc:0 "In the state of Magadha, on the eastern frontiers of Vedic influence, a huge chariot with a club attached, the so-called rathamusala, was invented. "
 vedic_path_3b:0 "Magadhan wariors"
 vedic_path_3b_desc:0 "The Eastern Vedians are described as very militant people. Especially the inhabitants of the Magadha kingdom which at that time made an unsuccessful attempt to unite the Vedic tribes. The West Indo-Aryans from then on looked at them with suspicion. "
 vedic_path_4b:0 "Defensive forts"
 vedic_path_4b_desc:0 "It was essential in ancient Indian military to maintain a network of forts on the kingdom's borders. They served as starting points for administrative centers and were always well-stocked. "
 vedic_path_5b:0 "Siege Warfare"
 vedic_path_5b_desc:0 "Those who can build forts can also destroy them. Inventions like the mahashilakantaga (actually a huge catapult) allowed the siege of even hard-to-reach fortresses. "
 vedic_path_end_bonus:0 "Indian Warfare"
 vedic_path_end_bonus_desc:0 "Hindus are experts in using the unique terrain of their homeland to their advantage. They can fight perfectly even in dense jungles where visibility is really low. Eventually they forced even the great Alexander to retreat. "
 ######
 #####Dravidan
 ######
 dravidic_philosophy:0 "Dravidan Traditions"
 dravidic_philosophy_desc:0 "The Dravidians, due to the weather conditions in southern India and the terrain, took a different approach from their northern neighbors and placed more emphasis on elephants and the navy. "
 tradition_unlock_requirement_dravidic:0 "You don't have enough population of Dravidan descent to unlock the tradition. "
 #Traditions
 dravidic_path_1:0 "Southern Martial Arts"
 dravidic_path_1_desc:0 "South of India is home to many martial arts. Kalari, for example, is probably the oldest of them. It uses the knowledge of Ayurveda and Yoga, because after all, as the proverb says, those who can heal know how to kill."
 dravidic_path_2:0 "Southern Martial Arts"
 dravidic_path_2_desc:0 "The Vedic tribes of the North barely adopted the jungle, the Dravidians were born in it, were molded by it. The average southern inhabitant saw nothing but her until he grew up."
 dravidic_path_2a:0 "Spears out of nowhere"
 dravidic_path_2a_desc:0 "Mastering the jungle and familiarizing yourself with the local terrain made it easier to launch surprise attacks. The confused opponent had a spear in his body before he could react."
 dravidic_path_3a:0 "Elaphants in dravidan hands"
 dravidic_path_3a_desc:0 "Since the area to the south made it impossible to fight effectively with chariots or cavalry in most cases, the only thing left to do was to focus on elephants. The Dravidians were masters of using these animals in combat."
 dravidic_path_4a:0 "Southern infantry"
 dravidic_path_4a_desc:0 "The naturally dangerous environment forced the development of many unconventional martial arts. Silambam is a martial art with a bamboo stick, which can be used to drive away wild men or a dangerous bandit."
 dravidic_path_5a:0 "Female warriors"
 dravidic_path_5a_desc:0 "Among many southern communities, girls received preliminary training until reaching maturity. From ballads we know that a few women warriors continued to practice achiving a high degree of expertise."
 dravidic_path_2b:0 "Dravidan navies"
 dravidic_path_2b_desc:0 "The Dravidians were very skilled sailors. The shaping of their homeland made the Indian ocean the fastest communication route. Therefore, many of the region's early cities developed close to the coast."
 dravidic_path_3b:0 "Dravidan war vassels"
 dravidic_path_3b_desc:0 "The development of the southern states towards the navy resulted in an increased need to build a navy. Although the task was not easy, the Southerners accepted the challenge."
 dravidic_path_4b:0 "Escort ships"
 dravidic_path_4b_desc:0 "When the Romans reached the south of India, they began to describe highly organized squadrons escorting merchants through the territorial waters of the ruler of the kingdom of Chola."
 dravidic_path_5b:0 "Colandia ships"
 dravidic_path_5b_desc:0 "Peripulus describes huge ocean-going ships regularly sailing ne East for exotic goods. They had to be specially adapted to negotiate huge ocean waves. For this purpose, a special bulge was added underneath, which stabilized the ship so that it would not tip over."
 dravidic_path_end_bonus:0 "Wariors and traders of south"
 dravidic_path_end_bonus_desc:0 "The Dravidians proved their great will to survive. Despite the onslaught of the Vedic people and the hostility of the nature of their own homeland, they adapted. The sea gives them life to this day."
 ######
 #####Veddan
 ######
 veddan_philosophy:0 "Veddan Traditions"
 veddan_philosophy_desc:0 "The Vedda are the oldest people of the south separate from the dravidians. Years of wars with successive waves of migrating Dravidian people fleeing the Aryans have pushed them to Sri Lanka. They are the best archers in India."
 tradition_unlock_requirement_veddic:0 "You don't have enough population of Vedda descent to unlock the tradition. "
 #Traditions
 veddan_path_1:0 "Vedda Archers"
 veddan_path_1_desc:0 "The Vedda archers are the best in all of India. The bow is a weapon known to every inhabitant of Sri Lanka from birth. Traditionally used for hunting, it can also be used for attack."
 veddan_path_2a:0 "Fishermen"
 veddan_path_2a_desc:0 "Apart from the bow, Sri Lankan tribal hunters are quite good at using the harpoon. This skill is also useful in wars where you need to catch bigger fish."
 veddan_path_3a:0 "Sri Lankan Elephants"
 veddan_path_3a_desc:0 "As a culture from the Indian continent, the Vedda also attach great importance to elephants. The elephant has been a common motif in the island's heraldry for about 2,000 years, and probably even earlier."
 veddan_path_4a:0 "Rama's expedition"
 veddan_path_4a_desc:0 "There is a theory that the description of the expedition to Sri Lanka in the epic Ramayana is the description of a real expedition against the Kingdom of Lanka. It is known that during the Bronze Age and later Ceylon had contacts with Egypt, and there were organized state structures on the island during the Iron Age."
 veddan_path_5a:0 "Jungles of Ceylon"
 veddan_path_5a_desc:0 "Like other Indian cultures, Sri Lankans are gaining an advantage in jungle fighting. After all, it is the environment they know from birth."
 veddan_path_2b:0 "Island Nation"
 veddan_path_2b_desc:0 "Life on the island made many inhabitants live off fishing. This in turn made the Vedda people familiar with the sea. "
 veddan_path_3b:0 "Traders from far away"
 veddan_path_3b_desc:0 "The strategic location of the Wysky on the trade routes meant that merchants from all over the world began to arrive there. Ceylon goods even appeared in the tombs of the pharaohs."
 veddan_path_4b:0 "Escort ships"
 veddan_path_4b_desc:0 "Increased trade made the rulers of the island also have to increase their military presence in the seas. The life-giving force that the trade routes gave the island had to be defended."
 veddan_path_5b:0 "Ocean masters"
 veddan_path_5b_desc:0 "There are rumors that the legendary tarshish could be not only the name of the city but also the name of a huge ship that would endure the hardships of a journey across the ocean."
 veddan_path_6b:0 "Long travels"
 veddan_path_6b_desc:0 "Acquainting with the ocean allowed the inhabitants of Ceylon to gain skill in navigation and reach their destination faster."
 veddan_path_end_bonus:0 "Bowmen of Indian Ocean"
 veddan_path_end_bonus_desc:0 "The people of Vedda have proved that great things can be achieved through determination. These archers and merchants have had a great influence on the history of Sri Lanka."
 ######
 #####Tibeto-Burmese
 ######
 qiang_philosophy:0 "Tibeto-Burmese Traditions"
 qiang_philosophy_desc:0 "The Tibetan Burmese may be known for their pacifist philosophies, but as you may well said, kindness is not a shield that will protect your loved ones and a bow that will feed them. The inhabitants of these inhospitable places knew how to defend themselves and forge their destiny with a spear in their hands."
 tradition_unlock_requirement_qiang:0 "You don't have enough population of Qiang descent to unlock the tradition. "
 #Traditions
 qiang_path_1:0 "Wildlands of North-East"
 qiang_path_1_desc:0 "The landscape of Northeast India is criss-crossed by mountains and jungles. The tribes living there know this area inside out. "
 qiang_path_2a:0 "Tibet Mountains"
 qiang_path_2a_desc:0 "The specificity of fighting in high terrain is that a person needs a very long time to adapt to the conditions (pressure). Especially in the past, this has caused enormous problems for the attacker."
 qiang_path_3a:0 "Archers from the hills"
 qiang_path_3a_desc:0 "There is evidence that since the Iron Age, through their intense contacts with the arya, borderlanders have practiced archery and that it was not a rare weapon."
 qiang_path_4a:0 "Tibetan raids"
 qiang_path_4a_desc:0 "Hindu stories have survived about Tibetans and their courageous raids deep into India carried out from their mountain hideouts "
 qiang_path_5a:0 "Salva invasions"
 qiang_path_5a_desc:0 "The invasion of the Salva people proved that the Tibetans are not only a nuisance but also a real force to be reckoned with. Eventually, a small tribe managed to destroy what was probably the oldest kingdom in India."
 qiang_path_6a:0 "New Armour"
 qiang_path_6a_desc:0 "The Tibetans were fairly well armed for savage tribes. In the mountains, it was not possible to accumulate the amount of ore for armor, so they were made of leather formed into lamellas fastened together."
 qiang_path_2b:0 "Fortress Village"
 qiang_path_2b_desc:0 "The frontier peoples have kept the tradition of cattle-breeding defensive villages brought on by the influx of Qiang people from the eastern territories. "
 qiang_path_3b:0 "Border Forts"
 qiang_path_3b_desc:0 "Building fortresses in mountainous terrain was the easiest way to stem someone's expansion, and was a common tactic for mountain cultures."
 qiang_path_4b:0 "Indian connections"
 qiang_path_4b_desc:0 "In Hindu epics like the Mahabharata one can easily find references to the Tibetans and Burmese under the names Kirata and Bhallata. This is evidence of many military and trade contacts."
 qiang_path_5b:0 "Early silk road"
 qiang_path_5b_desc:0 "The region was not only under Indian influence, because even in such an old era goods from Chinese kingdoms were found in Burma."
 qiang_path_end_bonus:0 "Children of the hills"
 qiang_path_end_bonus_desc:0 "The Tibetan-Burmese people left their mark not only as thinkers but also as fearless mountain warriors that even the most powerful rulers of India had to fear."
 ######
 #####Egyptian
 ######
 egyptian_philosophy:0 "Egyptian Traditions"
 egyptian_philosophy_desc:0 "The Egyptians have a very long military tradition. The security provided by the people of Egypt by the river Nile and the natural borders did not mean that they did not have to fight. On the contrary, Egypt has waged numerous wars to protect its riches, which the whole world has always desired."
 tradition_unlock_requirement_egyptian:0 "You don't have enough population of Egyptian descent to unlock the tradition. "
 #New Traditions
 egyptian_path_1:0 "Light Chariot"
 egyptian_path_1_desc:0 "Light Egyptian chariots were technology brought by invaders from the Levant called the Hyksos (Shepherd Kings). According to legend, they were worn on the battlefield during the Bronze Age because otherwise they could break. Their use was not discontinued in the Iron Age."
 egyptian_path_2:0 "Egyptian Soldier"
 egyptian_path_2_desc:0 "Thou Egypt could not equip it's soldiers as well as other states due to the lack of metal ores the egyptians had nothing to be ashamed of. Their infantry was always praised even by ther enemies as a well disciplined and capable fighting force."
 egyptian_path_2a:0 "Desert Scirmishers"
 egyptian_path_2a_desc:0 "Egyptians used all manner of throwing wepons like slings, javelins and throwing sticks. Yes boomerang is pretty old wepon and originally was never meant to return to the owner but hit a target with precision over great distance."
 egyptian_path_3a:0 "Egyptian Archers"
 egyptian_path_3a_desc:0 "Egyptians used the bows even before the formation of their country but a composite ones are credited as another invention brought by the canaanite invaders. Egyptians to use with great efficiency along with their faster light chariots."
 egyptian_path_4a:0 "Greek mercenaries"
 egyptian_path_4a_desc:0 "When the Persian Empire reached the borders of Egypt and Greece, it brought the two worlds together. Many Greeks fought in the armies of the late period pharaohs and even settled permanently in Egypt (there was even a Greek colony in the delta)."
 egyptian_path_2b:0 "Castles on the Nile"
 egyptian_path_2b_desc:0 "Egyptian created network of fortifications along the river Nile, especially in Nubia, which were meant to both defend and collect tribute from travelers going up and down the river. Those forts looked really impressive even centuries later with high walls and guard towers. "
 egyptian_path_3b:0 "Egyptian Coast Guard"
 egyptian_path_3b_desc:0 "Egyptian navy was primarily the coastal and riverine one meant to defend the territory from pirates and minor threats. Despite it's lesse signifficance it was still highly capable force which ones repelled the invasion of Sea Peoples in famous Battle of the Delta."
 ######
 #####Levantine
 ######
 westsemite_philosophy:0 "Levantine Traditions"
 westsemite_philosophy_desc:0 "The people of Levant have always had a fishing line for sailors and adventurers. At a time when others faced the greatest threat in history, their innate cleverness allowed them to survive the worst moments and gain a lot from the crisis. Everyone in the Mediterranean knew that there were no better sailors than the Phoenicians."
 tradition_unlock_requirement_westsemite:0 "You don't have enough population of Levantine descent to unlock the tradition."
 #New Traditions
 westsemite_path_1:0 "Shepherd's Wepon"
 westsemite_path_1_desc:0 "Before becoming the masters of the western seas phoenicians were primarily shepherds. When they invaded Egypt the egyptians themselves nicknamed them 'Shepherd Kings' (Hyksos). The ancient shepherds used slings for defense against wild beasts and other humans. Back in those days slings were lether stripes loaded with specially prepared stones able to reach the speed of a bullet."
 westsemite_path_2:0 "Carrying the Light"
 westsemite_path_2_desc:0 "Phoenician merchants were the first to travel the seas when the crisis of Bronze Age Collapse ended. Their merchant vassels brought back the light of civilisation even to the places like Greece, Italy, Africa or Spain. They showed everyone that the dark days are over and brave sailors can deal with pirates, seas and whatever fate will throw against them."
 westsemite_path_3:0 "The Spanish Route"
 westsemite_path_3_desc:0 "The main focus of the early phoenician voyages was to open the lucrative trade route from Levant to Spain and the British Isles. This is the reason why the phoenician colonies appeared primarily on that particular route instead of for example Gaul or Illyria. The ancient vassels could not travel for long without repairs so colonies were necessary for the trade to flow."
 westsemite_path_3a:0 "Libyan-Punic Infantry"
 westsemite_path_3a_desc:0 "The punic infantry fought and was trained in greek fashion with slight modifications. In time the libyans and other nationalities joined the formation. Libyans were particularily respected due to their warlike nature."
 westsemite_path_4a:0 "Mercenaries"
 westsemite_path_4a_desc:0 "Punic settlers were the minority in the lands they colonized so the mercenary armies were the necessity rather than convenience. Of course mercanaries were the more unreliable the smaller their salaries were but punic armies kept their quality despite their multiethnic nature."
 westsemite_path_5a:0 "The Beasts of War"
 westsemite_path_5a_desc:0 "When phoenicians landed in Africa they immidiately realized the impact the elephants make on common soldiers. The psychological effect itself often was enaugh to turn the tide of battle. The punic commanders sometimes lead from the back of elephant to boost morale. Spartan commander in Carthaginian service made small modifications to elephant tactics and put the animals in front of the army."
 westsemite_path_6a:0 "Warships"
 westsemite_path_6a_desc:0 "The Carthaginian battle ships got increasingly bigger in time. Their construction was a closely guarded secret. Thats the main reason why the navy base was in specialy created docks where the unauthorized personnel was forbidden from entering. "
 westsemite_path_3b:0 "Colonial Ties"
 westsemite_path_3b_desc:0 "Punic colonies and their mother cities usually had strong ties most likely because of their common intrests. Carthaginian delegations from time to time visited the Tyrian temple of Melquart even way after becoming independent. "
 westsemite_path_4b:0 "Phoenicia"
 westsemite_path_4b_desc:0 "After being pushed back from southern Levant by the Hebrew tribes and pressured by the aramean kingdoms from the north the hills of Phoenicia became a literal fortress defending the last foothold of phoenician culture in the Levant. The punic cities like Tyre were also well defended. Tyre itself was an impenetrable off-shore isle with powerfull navy serving as second wall preventing city from being surrounded."
 ######
 #####Nubo-Ethiopian
 ######
 nubian_philosophy:0 "Nubian Traditions"
 nubian_philosophy_desc:0 "Land of the Bow is what the Egyptians called the homeland of the Nubians. Completely correct name, because the Nubians are the best archers of the time. Thanks to their archers, they managed to survive the invasions of Assyrians, Persians and Romans."
 tradition_unlock_requirement_nubian:0 "You don't have enough population of Nubian or Ethiopian descent to unlock the tradition."
 #New Traditions
 nubian_path_1:0 "Nubian Bowmen"
 nubian_path_1_desc:0 "From the beginning the bowmen were the core of nubian military tactic. Nubian archers were known from their skills and their arrows were often poisoned."
 nubian_path_2a:0 "Volley Fire"
 nubian_path_2a_desc:0 "Having large amount of skilled archers means nothing if you don't know how to use the unit. Nubians learned that concentrated fire is way more effective than traditional scirmish tactic. Well timed volley can even stop cavalry charge."
 nubian_path_3a:0 "Southern Steeds"
 nubian_path_3a_desc:0 "Horse breeding was a hobby and real love of nubian monarchs. Their kings were sometimes buried with their chartiots and horses. Nubian cavalry might not have been the most important but it was never neglected."
 nubian_path_4a:0 "Forest Elephant"
 nubian_path_4a_desc:0 "Nubian war elephants were the smallest kind of warelephant used in warfare. They were rarely used for combat due to their size but they were still formitable enaugh to make impression."
 nubian_path_5a:0 "Landing Vassels"
 nubian_path_5a_desc:0 "Nubians had little to no navy with the exception of river and coastal vassels (much like egyptians). There are descriptions of Nubians using siege towers and those river vassels to strorm egyptian cities."
 nubian_path_2b:0 "Nubian Hertland"
 nubian_path_2b_desc:0 "Nubia much like Egypt consisted of the fertile land near the river and enormous deserts on both sides of it. Generally the closer to egypt the more civilised the nubians were."
 nubian_path_3b:0 "Medjay"
 nubian_path_3b_desc:0 "Madjay was the collective name for the tribes from eastern deserts (it evolved from the name of one and spanned on the rest). Medjay were used as a ranger police. Egyptians later also joined the Medjay."
 ######
 #####Caucasian
 ######
 caucasian_philosophy:0 "Caucasian Traditions"
 caucasian_philosophy_desc:0 "The people of the Caucasus have always been internally divided thanks to the mountaineaous nature of their homeland. Their peaks form a natural fortress, and their defenders make it almost impregnable."
 tradition_unlock_requirement_hurric:0 "You don't have enough population of Hurrian, Armenian or Caucasian descent to unlock the tradition."
 #New Traditions
 caucasian_path_1:0 "Tribes of Nairi"
 caucasian_path_1_desc:0 "Before the Assyrian invasions enforced the unification process among the local tribes the area around Lake Van was inhabited by the tribes of Nairi. When Assyrians pushed the remnants of the Mittani north and became a threat those tribes became the founding tribes of Urartu."
 caucasian_path_2a:0 "Hurrian heritage"
 caucasian_path_2a_desc:0 "Before the fall of the Bronze Age, the Mittani were true masters of horse breeding. The Hurrians were actually the ones that popularized use of those animals for warfare. The hurrian manuals that survived are usefull till today."
 caucasian_path_3a:0 "Ancient Knights"
 caucasian_path_3a_desc:0 "The Caucasian tribes and especially armenians throu the contact with the nomads from beyond Caucasus adopted the use of Cataphracts. In time the local aristocracy formed the more heavily armoured version of that unit."
 caucasian_path_4a:0 "Caucasian Tribes"
 caucasian_path_4a_desc:0 "At this time under the influence of the greek merchants unification processes begin on Caucasus. In tofays Georgia a confederation of tribes called Colchis is being formed and begin trading with the survivors of Bronze Age Collapse."
 caucasian_path_2b:0 "Urartrian Infantry"
 caucasian_path_2b_desc:0 "According to historians, Urartu was a multi-ethnic state united by a common threat from Assyria. The core of his army was infantry armed with spears and huge shields."
 caucasian_path_3b:0 "Story of Erebuni"
 caucasian_path_3b_desc:0 "Many of the Urartian castles became cities known to this day, such as the capital of today's Armenia (Yerevan), then known as Erebuni, which was a fortress to guard the northern borders of the kingdom."
 caucasian_path_4b:0 "Natural Fortress"
 caucasian_path_4b_desc:0 "The mountains around the Van are natural fortress so it's not surprisong that Tushpa, city near the lake, was chosen as the capital of local power."
 ######
 #####Libyan
 ######
 libyan_philosophy:0 "Libyan Traditions"
 libyan_philosophy_desc:0 "During the Late Bronze Age, the Libyans (especially the Ma tribes) began to press hard against the borders of the Egyptian empire, posing a serious threat (judging from the amount of propaganda texts on the reliefs). Eventually they managed to settle in large numbers, especially in the Nile delta, and take power over the country for a time."
 tradition_unlock_requirement_libyan:0 "You don't have enough population of Libyan or Berber descent to unlock the tradition."
 #New Traditions
 libyan_path_1:0 "Clan Retinue"
 libyan_path_1_desc:0 "The Libyans is more a collective name for the Libyans proper and the Berbers inhabiting the Sahara. Their societies consisted of clans united by the more powerfull chiefs. In the egyptian art they are often depicted with their tatoos and feathers attached to headbands."
 libyan_path_2:0 "Harsh Conditions"
 libyan_path_2_desc:0 "Sahara is a very unforgiving home with precious fiew places where life can take root. Those sites are called oasis and they are the most valuable posession in the desert. During war armies can only move from one oasis to the next."
 libyan_path_3:0 "Ships of the Desert"
 libyan_path_3_desc:0 "Camels are able to keep the water inside their bodies for far longer periods of time than other animals. This with their ability to give wool, milk and serve as a mount makes them nearly indespensible."
 libyan_path_3a:0 "Chariots in the Desert"
 libyan_path_3a_desc:0 "In some places the breeding of warhorses arrived later than in others. Greek colonists in Cyrene reported extensive use of chariots by the local tribes like the Nessamones which were used to launch raids on coastal settlements."
 libyan_path_4a:0 "Talented Generals"
 libyan_path_4a_desc:0 "After arrival in Egypt the libyan value as a soldiers was discovered and some started to quickly rise throu the ranks of the military. As example can serve the life of pharohs like Osorkon and Shosqenq (bibilical character). Shosqeng even managed to bring back the southern levant under the egyptian control for a short period of time."
 libyan_path_5a:0 "Libyan Forts"
 libyan_path_5a_desc:0 "Libyans after the defeat of the Sea Peoples coalition were settled near border fortresses like the Philistines and other nations. The deal was quite similar to the later viking deal with the kings of France in other words land for fealthy and protection from their brethren."
 libyan_path_6a:0 "Libyan Politics"
 libyan_path_6a_desc:0 "The desert tribal leaders were percieved as barbaric, uneducated and easily manipulated tools but clan politics were brutal and complicated enaugh that this statement was far from the truth. Meshwesh in egypt and nubians could and did adapt in time to their oponents and in case of the egyptian state take control over the whole coutry. After all who holds the sword decides who holds the pen."
 libyan_path_3b:0 "The Berbers"
 libyan_path_3b_desc:0 "Berbers from the coast were less nomadic from their desert neighbours but despite this their cavalry was one of the best in the Western Mediterrainean. Additionally thanks to control over the Saharan trade routes they were able to field elephants if necessary."
 libyan_path_4b:0 "North Africa"
 libyan_path_4b_desc:0 "Atlas Mountains are the reason why Sahara exists. The high mountain range blocks the water near the coast thanks to which the coastal areas of Northern Africa the only place with larger settlements."
 ######
 #####Anatolian
 ######
 anatolian_philosophy:0 "Anatolian Traditions"
 anatolian_philosophy_desc:0 "Anatolians were known for their slightly nationalistic approach to culture and religion (the god of thunder from Hattusa and Gordion is not the same god for hittites). This mental independence also had an impact on the wax which was full of many nationalities and had a feudal structure to some extent with a small part of the regular forces."
 tradition_unlock_requirement_hattian:0 "You don't have enough population of Hattian or Luwian descent to unlock the tradition."
 #New Traditions
 anatolian_path_1:0 "Anatolian Swords"
 anatolian_path_1_desc:0 "The Hittite-Luvian sword is a long curved slash sword that has been further elongated when iron was discovered. Anatolia is the closest place to the Middle East with substancial and easily accessible metal deposits that's why hittites were usually better equipped than their neighbours."
 anatolian_path_2:0 "Heavy Chariots"
 anatolian_path_2_desc:0 "Anatolian Chariots were originally adopted from Hurrians. Anatolians themselves made a couple of changes like for example enlarging the entire structure. Heavier Chariots could be used to break the enemy lines."
 anatolian_path_2a:0 "Anatolian Archers"
 anatolian_path_2a_desc:0 "The people of Anarolia were well known from their skill in archery. They adopted the use of composite bows from their middle eastern neighbours."
 anatolian_path_3a:0 "Luwians"
 anatolian_path_3a_desc:0 "The armies of anatolian kingdoms were usually quite multiethnic and filled with all kinds of mercenary unts like the Lukkans fighting for the Hittite Empire under Kadesh."
 anatolian_path_2b:0 "The Hidden Cities"
 anatolian_path_2b_desc:0 "During the Iron Age the Hitties created a network of underground hidden fortresses that could sustain the population of a moderatly sized city. If the battle went poorly they could always withdrew to one of those hiding places."
 anatolian_path_3b:0 "Vassal treaties"
 anatolian_path_3b_desc:0 "The Hittites ruled anatolia throu the system of treaties. Senior could demand payment for protection or troops like in the case of the city-state of Ugarit sending contingent to Hittites (chariots and ships)."
 anatolian_path_4b:0 "Hill Tribes"
 anatolian_path_4b_desc:0 "Anatolia is a hilly region with high mountain ranges like the Taurus and local peoples learned to use the terrain to their advantage. Kaskian tribesmen for example were known from their devastating raids on the core lands of Hittite Empire."
 ######
 #####Celtic
 ######
 keltoi_philosophy:0 "Celtic Traditions"
 keltoi_philosophy_desc:0 "If any group benefited from the fall of the Bronze Age, it must have been the Celts. Celtic culture spread like wildfire throughout Europe. Many peoples adopted the new customs voluntarily, but others had to be defeated by savage warriors who did not fear death."
 tradition_unlock_requirement_keltoi:0 "You don't have enough of Celts to unlock the tradition."
 #New Traditions
 keltoi_path_1:0 "Celtic Warriors"
 keltoi_path_1_desc:0 "Contrary to popular opinion among the southerners Clelts were far better skilled and equipped warriors than it would seem. Every fighter had large oblong shield, javelins and a spear, richer ones could afford a sword."
 keltoi_path_2:0 "Celtic Cavalry"
 keltoi_path_2_desc:0 "Romans often used celtic cavalry as a foederati units. Cesar used celtic warriors until their loyalty became questionable near the end of conflict with Vercyngetorix. He even lend a cavalry unit under Crassus's son to his father for his Parthian campaign."
 keltoi_path_2a:0 "Caltic Strongholds"
 keltoi_path_2a_desc:0 "In the case of encountering stronger oponent celtic armies often withdrew to the nearest fortification. Those were often wooden ones but usually placed on a hill and in hostile terrain. From those strongholds celtic warriors could conduct asimetric warfare thinning the enemy ranks by constant raids."
 keltoi_path_3a:0 "Fortified Capitals"
 keltoi_path_3a_desc:0 "The seat of the tribe was often a large stronghold. Those in later centuries grew to the size of proper cities. Milan is an example of a city of celtic origin."
 keltoi_path_4a:0 "Celtic Weponry"
 keltoi_path_4a_desc:0 "Probably borrowed from the Bronze Age Beaker culture, the richly decorated Celtic sword was one of the symbols of this culture. It was long and slightly leafy in shape. Celts were real masters in ironworking. Their gear had a quality comparable with the more civilised cultures."
 keltoi_path_5a:0 "Psychological Warfare"
 keltoi_path_5a_desc:0 "Celts used variety of methods to lower the enemy morale. From the carnyx trumpets that sounded really terrifying to the tatoos that were supposed to protect the warriors from harm. "
 keltoi_path_2b:0 "Terrain Knowledge"
 keltoi_path_2b_desc:0 "Tribal warriors knew their homeland inside out. Especially forests that covered all of Europe then. They could devour entire hostile armies. "
 keltoi_path_3b:0 "Briton Chariots"
 keltoi_path_3b_desc:0 "Britons used chariots to move their forces faster. The Briton infantry could easily disengage and run to their vehicles if thing went bad. "
 keltoi_path_4b:0 "Hunters"
 keltoi_path_4b_desc:0 "Many Celts were hunting, so there was no problem with recruiting archers. However, they were not as talented as Middle Eastern cultures."
 keltoi_path_5b:0 "Ships of the Veneti"
 keltoi_path_5b_desc:0 "Some Celtic tribes were known to build exceptionally large vessels (adapted to ocean navigation). Such a tribe were the Atlantic Veneti, who tried to sail away on such ships during the clash with Caesar, but the Roman fleet caught them before they escaped. Legionnaires had to use ladders to get to the higher decks of enemy ships."
 ######
 #####Italian
 ######
 italian_philosophy:0 "Italian Traditions"
 italian_philosophy_desc:0 "The Italic peoples lay at the crossroads of many cultures, and these influences allowed them to form one of the most versatile armed forces in the world at that time, the Roman Army."
 tradition_unlock_requirement_italic:0 "You don't have enough population of Italic, Tyrrhenian or Ligurian descent to unlock the tradition."
 #New Traditions
 italian_path_1:0 "Pillum"
 italian_path_1_desc:0 "Some say that romans took it from gaulish invaders but it may have been as well developoment of the throwing spears used already by the roman clans (like Fabii). Romans upgraded the spear by mofifying the point of a spear so it will bend on impact forcing the enemies to throw their shields away. "
 italian_path_2a:0 "Roman Cavalry"
 italian_path_2a_desc:0 "Rome had a cavalry unit since the times of first kings. It traditionally consisted of roman elite and it's task was primarily to guard the king during battle. The original conspirators involved in overthrowing etruscan monarchy (like Brutus's ancestor) were rumored to belong to that unit."
 italian_path_3a:0 "Gladius and Spatha"
 italian_path_3a_desc:0 "Gladius came from Iberia and was a short double edged sword used in close combat. It gave an edge to the roman soldiers prefering to fight the enemy at close range. Spatha was a longer version that was created originally for cavalrymen but when rome began facing cavalry based armies it slowly replaces gladius."
 italian_path_4a:0 "Triplex Acies"
 italian_path_4a_desc:0 "The roman upgrade for phalanx tactic made to solve the issue with the hilly terrain causeing the breaks in formation. From now on the army were devided into units that formed the three lines. Velites, the youngest soldiers lightly armed and fulfilling the role of scirmishers, Hastati and Principes known as more heavily armed first and second lines armen with pillum and swords and finally the triarii, oldest soldiers acting like traditional hoplites. With the creation of a legion the system was only slightly modified. "
 italian_path_5a:0 "Aquila"
 italian_path_5a_desc:0 "The roman eagle was a soul and the most important standard in the legion. It was not just another banner but a religious symbol the soldiers were ready to defend and die for with the same fanaticism like the chest with their salary."
 italian_path_2b:0 "Engines of War"
 italian_path_2b_desc:0 "Also in the area of engineering the old roman habit of borrowing and adapting the inventions of other cultures was very strong. After the siege of Carthago Nova in Spain they captured the enemies arsenal which greatly speed up their war engine development. The perhaps most famous roman war engine is ballistae sometimes called scorpio able to shoot spear like projectiles like giant crossbow. "
 italian_path_4bs:0 "Roman Navy"
 italian_path_4bs_desc:0 "To say romans were bad sailors is great understatement. The navy was often treated as a second category force. Agrippas successes was much due to his personal experiance than training and man like him were rarity. Yet romans knowing their weakness in this field decided to change the sea battle into land one with inventions like Corvus which was basically a bridge with spike meant to connect two ships together."
 italian_path_3b:0 "Roads to Rome"
 italian_path_3b_desc:0 "Roman road was not just another dirtroad or track of anykind. It was carefully designed construction made to last forever. It consisted of several layers of different materials put on top of each other so that road will be able to withstand the weather and weight of even the heaviest vehicles."
 italian_path_4b:0 "Roman Walls"
 italian_path_4b_desc:0 "Romans had a habit of building the defenses even during trivial stops for the night. That, at first glance weird tradition saved many legions from certain anihilation. Sometimes those defenses became more permanent and in that case a proper stone fortress was erected. Often a local settlement grew around the fortress with some even becoming a proper cities."
 italian_path_2c:0 "Foederati"
 italian_path_2c_desc:0 "Romans were the best infantryman in the known world. Yet they often lacked proper cavalry or archers. To fix those issues they were using so called foederati units. Those units often looked like roman ones with fiew differences like for instance round shields in some cases. To that kind of units we can count Cretan Archers or Balearic Slingers."
 italian_path_3c:0 "Spoils of War"
 italian_path_3c_desc:0 "After the successfull siege if enemy was unwise enaugh to offer resistance romans were looting the place like any other conqueror would have done. Because of nature of romans themselves in later years this procedure was more organised. "
 ######
 #####Iberian
 ######
 iberian_philosophy:0 "Iberian Traditions"
 iberian_philosophy_desc:0 "The Spaniards appear in the chronicles as mercenaries as soon as the region emerges from the dark ages, and in this role they are perfect for participating in all major conflicts from Iberia to Greece. Peninsula warriors are reputed to be the finest irregular troops ever to be born in the Mediterranean."
 tradition_unlock_requirement_iberic:0 "You don't have enough population of Tartessian, Iberian or Bosque descent to unlock the tradition."
 #Traditions
 iberian_path_1:0 "Tribal wariors"
 iberian_path_1_desc:0 "The infantry of the Spanish tribes looked like Greek peltasts. This was necessary because these tribes often had to make quick attacks, and the armor would only slow the soldiers down."
 iberian_path_2:0 "Iberian Swords"
 iberian_path_2_desc:0 "Iber swords were also adapted to the irregular fighting style. Wide, short and slender were a huge inspiration for Roman armaments. The tribes closer to the shores used falcats, and those more inland gladius."
 iberian_path_3:0 "Irregular tactics"
 iberian_path_3_desc:0 "The campaigns of the Romans and Carthaginians showed that the Iberians were masters of asymmetric warfare. Their most commonly used tactic was to strike quickly using their mobility advantage and run away before their opponent shakes off."
 iberian_path_3a:0 "Tin middlemen"
 iberian_path_3a_desc:0 "The Iberians had been mediating the tin trade for at least several centuries before the Iron Age, and this made the tribes that lived closer to the shore know sailing. After all, the Nuragans come from Iberia."
 iberian_path_4a:0 "Slingers"
 iberian_path_4a_desc:0 "A wide variety of ranged weapons were used in Iberia, with the most common of them spears and slingshots. The bow was rarely or almost exclusively used for hunting. The slingshot was especially popular in the Iberian Levant."
 iberian_path_5a:0 "Punic influence"
 iberian_path_5a_desc:0 "In some regions of the peninsula there were more organized states where contact with the Phoenicians took Iberian culture and technology to a higher level. such an example was Tartessos, which is accused of colonizing several locations in the Mediterranean at that time."
 iberian_path_3b:0 "Rugh terrain"
 iberian_path_3b_desc:0 "The Iberian rebels used every advantage like forest terrain or even animals. For example, the Orentanian chief, Orissus, sent the bulls with burning horns to Hanibal's elephants."
 iberian_path_4b:0 "Spoils of war"
 iberian_path_4b_desc:0 "Raids for loot and cattle were frequent in Iberia. In the absence of a greater threat, the tribes eagerly jumped at each other's throats in the struggle for supremacy."
 iberian_path_5b:0 "Iberian Mercenaries"
 iberian_path_5b_desc:0 "The Iberians fought wars all over the Mediterranean, and there was no major conflict without their participation. They also rented out to each other. The fight against Rome or the Phoenicians is a common priority, but you have to live from something."
 iberian_path_6b:0 "Iberian speed"
 iberian_path_6b_desc:0 "Due to the relatively light equipment, the Iberian troops could move through difficult terrain at an express pace. The Romans highly praised these skills."
 iberian_path_end_bonus:0 "Sons of war"
 iberian_path_end_bonus_desc:0 "Skilled Iberian swordsmen and slingers have tipped the tide of more than one battle and participated in more than one campaign. From the Gallic Wars to Sicily and the Peloponnesian War, they made history with their sword."
 ######
 #####Zagrosian
 ######
 zagrosian_philosophy:0 "Zagrosian Traditions"
 zagrosian_philosophy_desc:0 "The highlanders from the Zagros Mountains are a tough people that had to face many adversities. The loves of the Elamites and the Cassites created civilizations equal to those of the Mesopotamians, and their armies have been a constant threat since the antediluvian period."
 tradition_unlock_requirement_kassites:0 "You don't have enough population of Kassite or Elamite descent to unlock the tradition."
 #New Traditions
 zagrosian_path_1:0 "Highlander Infantry"
 zagrosian_path_1_desc:0 "Depending on the region the Zagrosi infantry could be more tribal looking or in case of southern renges even mesopotamian like, yet some of the tribal aspect was always present in the forces of highlanders."
 zagrosian_path_2a:0 "Kassites"
 zagrosian_path_2a_desc:0 "They replaced the Gutians in the middle of Zagros Mountains and till late iron age kept the chariotry traditions alive in their culture. They were famous horse breeders known in all Mesopotamia."
 zagrosian_path_3a:0 "Recursive Bow"
 zagrosian_path_3a_desc:0 "Back in a day Elamite Bow as the name suggest came into Mesopotamia from Elam and was quickly adopted by the Kassites due to it requiring less force to use than normal bow which worked with their tactic well."
 zagrosian_path_2b:0 "Troops Transport"
 zagrosian_path_2b_desc:0 "Elamites used chariots more creatively than Kassites. Their homeland had very difficult terrain and to shorten reaction time they learned to transport infantry using chariot-like vehicles which surprised Mesopotamians."
 zagrosian_path_3b:0 "Elamite Infantry"
 zagrosian_path_3b_desc:0 "The Elamite infantry was very well trained and could use complex formations as we know from the compliments of the Babylonians as they fought hand in hand against Assyria."
 zagrosian_path_4b:0 "Metal Ores"
 zagrosian_path_4b_desc:0 "Due to their access to metal ores (Like Afgan Tin mines), the Elamites were usually better equipped in contrast to the akkadians. Mesopotamian records constantly metion the 'wepons of elam' for this particular reason."
 zagrosian_path_5b:0 "Asimetric Warfare"
 zagrosian_path_5b_desc:0 "Elamites often used their formitable moutain fortresses like Anshan to withstand attack from the mesopotamian armies and used their greater mobility to inflict damage and in moment of weakness take back the lowland regions like Susiana."
 ######
 #####Germanic
 ######
 germanic_philosophy:0 "Germanic Traditions"
 germanic_philosophy_desc:0 "Teutons were one of the expansive forces of the Iron Age. This is most evident in their period art depicting mostly combat scenes, warriors and long boats, which in the centuries to come will become the terror of all civilized coastal states."
 tradition_unlock_requirement_barbaric:0 "You don't have enough population of Germanic descent to unlock the tradition."
 #Traditions
 germanic_path_1:0 "Spearmen"
 germanic_path_1_desc:0 "Spearmen were the backbone of barbaric armies, and this is also the case with the Germanans. Recruited tribal warriors joined the warriors to defend the clan or enrich themselves after victory."
 germanic_path_2:0 "Seasoned fighters"
 germanic_path_2_desc:0 "At that time, there were recorded the existence of warriors who were said to have lived by the sword, but were not recruited from the peasantry. During the Battle of the River Tollense, many dead had healed injuries from many previous battles."
 germanic_path_3:0 "Martial culture"
 germanic_path_3_desc:0 "Warriors have been held in high esteem in Germanic culture since we have any sources on them. This indicates that most of the tribe had military training and were able to handle weapons. The Romans left a record of women among the combatants."
 germanic_path_4:0 "Hunters from the North"
 germanic_path_4_desc:0 "In addition to spears and axes of all kinds, the rock drawings also show bows as the main ranged weapon of Germanic warriors. This is not surprising given the nomadic nature of their culture at the time."
 germanic_path_4a:0 "Battle ax"
 germanic_path_4a_desc:0 "Contrary to appearances, the long ax is not easy to use as a weapon and its use requires practice and a long training. Consequently, he was the weapon of mainly richer and more experienced warriors. The masters of this weapon were even able to repel the attacks of the opponent's cavalry."
 germanic_path_5a:0 "Training and discipline"
 germanic_path_5a_desc:0 "When the armies of Rome began to clash with germaniums, they were surprised that a barbarian opponent could use advanced tactics and had excellent knowledge of the enemy. Apparently, during the meeting with Caesar, the Germanic leader made it clear to Caesar that he knew perfectly well that he had enemies in the capital, by using this fact he managed to provoke the Romans into a fight during the negotiations."
 germanic_path_6a:0 "Assault"
 germanic_path_6a_desc:0 "The capture of forts from enemy tribes was no stranger to Germanic warriors. Due to the lack of technical knowledge needed to build complex siege machines, the method of starving the enemy or assault was used. The fearless Germanic warriors in the battle frenzy (sometimes aided by herbs) were unstoppable."
 germanic_path_4b:0 "Long boats"
 germanic_path_4b_desc:0 "The Hjortspring boat best reflects the appearance of boats from the fashion action period. The early Germanic ships were not huge, but it was not size here, but speed, so that you could attack by surprise and leave quickly in the event of overwhelming resistance."
 germanic_path_5b:0 "Berserkers"
 germanic_path_5b_desc:0 "Some historians look to the origins of berserkers in the napola of animistic cults found in northern Europe. The most popular were the boar, bear and wolf cults. Such groups of warriors can be seen on the Trajan's column where they appear as allied troops."
 germanic_path_6b:0 "Germania"
 germanic_path_6b_desc:0 "Since the Fall of the Bronze Age, the Germanic expansion to the South began. The forested areas of Germanania made it difficult for the armies unfamiliar with the local routes to move. It was not difficult to set up an ambush in such terrain, and the few routes that were unfamiliar with their location were easy to control."
 germanic_path_end_bonus:0 "Fury of the North"
 germanic_path_end_bonus_desc:0 "When someone has a hard-to-live and dangerous homeland behind his back, he has no choice but to fight for a better tomorrow for his people. The migrating Germanic tribes could only go ahead, and if there was a need, they could use an ax to fight for a new home."
 ######
 #####Balto-Lusatian
 ######
 balto_lusatian_philosophy:0 "Balto-Lusatian Traditions"
 balto_lusatian_philosophy_desc:0 "The Lusatian culture was located on the route of many trade routes, thanks to which goods from all over Europe passed through its territory. Little is known about the culture itself and its military aspect, but it must have reflected the multi-faceted influence that the culture was subjected to."
 tradition_unlock_requirement_venedi:0 "You don't have enough population of Lusatian or Baltic descent to unlock the tradition."
 #Traditions
 balto_lusatian_path_1:0 "Cymmerian bows"
 balto_lusatian_path_1_desc:0 "The Lusatians were connected by trade contacts with the Scythian culture and from there they brought nomadic bows much more effective and requiring less stringing force than ordinary ones. The tactics of guerrilla warfare from the steppes were also adopted."
 balto_lusatian_path_2:0 "Slavic connection?"
 balto_lusatian_path_2_desc:0 "Due to the similar structure of settlements, scientists speculate that the Slavic culture may have had roots in the Lusatian culture, and early Slavic warriors were most often depicted as axemen."
 balto_lusatian_path_3:0 "Simpliest wepon"
 balto_lusatian_path_3_desc:0 "A large part of the warriors had to come from conscription, and those, as it was in other sedentary cultures during this period, were most often armed with spears, the simplest weapon with which to arm warriors cheaply."
 balto_lusatian_path_3a:0 "Trade from Greece"
 balto_lusatian_path_3a_desc:0 "We have evidence that the Lusatians had intensive contacts with the Greeks, as goods from the south were found in the remains of settlements, therefore, although most of the warriors were light infantry, they were well armed."
 balto_lusatian_path_4a:0 "Chariot figurines"
 balto_lusatian_path_4a_desc:0 "In Lusatian art, the chariot motif appears frequently enough to be able to recognize that the local chiefs used this unit in battle, and not just ridden it on holidays."
 balto_lusatian_path_5a:0 "Fortified settlements"
 balto_lusatian_path_5a_desc:0 "The Lusatians lived in fortified settlements, mainly with earthen-wooden walls, such as Biskupin, the reconstruction of which can be admired in Poland. It is especially good to visit this place during festivals."
 balto_lusatian_path_6a:0 "Threat from the east"
 balto_lusatian_path_6a_desc:0 "In the later Iron Age, the Cimmerians were defeated by the Scythians and pushed to the Middle East and Europe. The threat from migrating nomads meant that the strongholds began to be strongly fortified with wide moats and additional ramparts."
 balto_lusatian_path_3b:0 "Forests of Eastern Europe"
 balto_lusatian_path_3b_desc:0 "Even today, one third of Poland's territory is covered by forests, and once you entered the forest, you might never have left. It was in such an environment that the cultures of the Northeast came to live. In clearings scattered in the forest, hence the name Poland from fields among forests (pole means field)."
 balto_lusatian_path_4b:0 "Along the Baltic"
 balto_lusatian_path_4b_desc:0 "The ancestors of the Balts lived further along the shores of the Baltic Sea. The Roman chronicles called them Aestia. The Balts and the Slavs were strongly related to each other as was the future culture that developed side by side."
 balto_lusatian_path_5b:0 "Vysotsko culture"
 balto_lusatian_path_5b_desc:0 "The Vysotsko culture lived in the eastern Carpathians. It is known that it was connected with the Baltic culture and during the Cymmerian migration it was destroyed like many other cultures of the region. "
 balto_lusatian_path_6b:0 "Ghost wariors"
 balto_lusatian_path_6b_desc:0 "Ancient authors describe that it was difficult to catch a group of Slavic warriors because they were able to move very quickly. One of the East Roman authors writes that they could only be traced by traces in the snow."
 balto_lusatian_path_end_bonus:0 "Forts in the forest"
 balto_lusatian_path_end_bonus_desc:0 "The ancient Lusatians had to face many adversities and adapt to the changing conditions of an unstable region just emerging from the gloom of centuries of crisis."
 ######
 #####Thracian
 ######
 thracian_philosophy:0 "Thracian Traditions"
 thracian_philosophy_desc:0 "The Thracians had the potential to assemble huge troops, but this was extremely rare due to internal divisions. They were prized for their skills, and mercenaries from Thrace served in conflicts from Italy to the Middle East."
 tradition_unlock_requirement_thracianic:0 "You don't have enough population of Thracian descent to unlock the tradition."
 #New Traditions
 thracian_path_1:0 "Thracian Peltasts"
 thracian_path_1_desc:0 "The spearmen from the eastern Balkans were a particularly sought-after mercenary. The Thracians specialized in ranged combat. The typical warrior was lightly armed and wore a crescent or round shield called peltes."
 thracian_path_2:0 "Warriors of Thrace"
 thracian_path_2_desc:0 "The Thracians used many kinds of weapons, from clubs to longswords. Their national weapon, which almost every self-respecting Trak had, was a sica, that is a long (approx. 40 cm) curled knife perfect for throat cutting. In Rome, it became popular with assassins and bandits, as well as with radical Jewish groups such as the Sicarians."
 thracian_path_2a:0 "Mobile Defenses"
 thracian_path_2a_desc:0 "Tribes living closer to the Black Sea steppes developed anti-cavalry tactics during their contacts with the Scythians. In one of them warriors formed their baggage carts into a circle forming a 'wall' that protected the thracians from being outflanked by nomads."
 thracian_path_3a:0 "Thracian Cavalry"
 thracian_path_3a_desc:0 "Thracians also adopted many Scythian cavalry tactics and gear. They also adopted or even developed the wedge formation later in turn adopted by the macedonian companion cavalry."
 thracian_path_2b:0 "Mercenary Traditions"
 thracian_path_2b_desc:0 "Thracian mercenaries had opinion of high quality yet very costly units. Additionally there are numerous reports of extensive looting that affected the areas where those units stationed."
 thracian_path_2c:0 "Anatolian Migration"
 thracian_path_2c_desc:0 "Mysians, Bithynians and Phrygians migrated during the Bronze Age Collapse into Anatolia taking many abandoned and ruined Hittite settlements and outposts. Thanks to the extensive contact with Anatolian culture they managed to become more civilised than their balkan cusins."
 thracian_path_3c:0 "Formitable Defenses"
 thracian_path_3c_desc:0 "The Phrygians managed to form micro-empire in central Anatolia. They build really impressive fortified capital city with real high defensive wall and impressive tower. Gordion's wealth was probably the source of Midas myth."
 ######
 #####Greek
 ######
 grekoid_philosophy:0 "Greek Traditions"
 grekoid_philosophy_desc:0 "The Greek army relied primarily on infantry formations. It was mainly caused by the very shaping of the Greek homeland where it was difficult to find a lot of room for maneuver. The long coastline also meant that if the Greek polis wanted to pursue an expansive policy it had to invest in the navy."
 tradition_unlock_requirement_grekoid:0 "You don't have enough population of Greek or Agean descent to unlock the tradition."
 #New Traditions
 grekoid_path_1:0 "Greek Hoplites"
 grekoid_path_1_desc:0 "Greek armies were primarily infantry focused due to the hilly terrain. Commmon greek hoplite had large round shield with which he was able to protect himself and the man beside him. Beside shield he usually had spear and short sword. Formation when hoplites were locking their shields together in a line is called phalanx."
 grekoid_path_2:0 "Greek Peltasts"
 grekoid_path_2_desc:0 "The battle was often opened by a duel of skirmishers called peltasts. It was about taking the best starting position for the fight, and because it was held mainly in close combat, it was extremely important to capture higher ground first."
 grekoid_path_3:0 "Warrior Traditions"
 grekoid_path_3_desc:0 "The Greeks saw it as their duty to fight to protect their small homelands and their interests. In many regions, service was even an obligation imposed by the state."
 grekoid_path_3a:0 "Cretan Archers"
 grekoid_path_3a_desc:0 "The use of bow on Crete is attested as early as the Minoan period 2200BC. It was a composite bow that gave the cretan archers range advantage over the archers from the mainland. The Cretans had a reputation for being the best archers in the Mediterranean."
 grekoid_path_4a:0 "Sarissa"
 grekoid_path_4a_desc:0 "In time the greek phalanx evolved and dorian spear was replaced by the much longer sarissa. This gave the phalangites length advantage but also opened them to attacks from the sides."
 grekoid_path_5a:0 "Companions"
 grekoid_path_5a_desc:0 "Companions was a heavy cavalry inspired by the contact with the steppe peoples. Their main task was to prevent the phalanx formation from being outflanked because once that happened the battle was practically lost."
 grekoid_path_3b:0 "Greek engineers"
 grekoid_path_3b_desc:0 "The famous Greek ingenuity was manifested not only in civil but also military use. The Greek states competed in inventions to defend or break through the enemy's fortifications."
 grekoid_path_4b:0 "Little homeland"
 grekoid_path_4b_desc:0 "The struggle was mainly for the few scraps of arable land that were increasingly coveted by the polis, which began to overpopulate towards the end of the Iron Age. The fighting style practiced by the Greeks meant that it was best for them when it took place in the open."
 grekoid_path_5b:0 "Colonies"
 grekoid_path_5b_desc:0 "Maybe you don't see it on the map at first glance because of the sea, but the Greeks were a very expansive people. Their homeland could not feed the surplus population, so colonizing overseas lands was the only option left."
 grekoid_path_3c:0 "Sea traders"
 grekoid_path_3c_desc:0 "After the fall of the Minoans, the Greeks assumed their role as merchants linking the western and eastern Mediterranean basins. It was a very lucrative source of income for them and some polis began to specialize in the control of maritime trade, such as Syracuse or Athens, and invest heavily in naval forces. The Greeks, however, were not the only traders and had competition in the form of the Phoenicians with whom they had to compete at every step."
 grekoid_path_4c:0 "New ship types"
 grekoid_path_4c_desc:0 "The development of shipping and rivalry with the Phoenicians meant that war fleets began to be expanded to fight for influence in the seas, which were getting tighter. To this end, larger and larger ships were built and adapted only to combat, not to trade as before."
 grekoid_path_5c:0 "Mega galleys"
 grekoid_path_5c_desc:0 "At the end of the Iron Age, the Greeks had already begun to build real multi-row colossi, and the rivalry with the Phoenicians turned into a real war for influence wherever possible. One such clash took place in the vicinity of Corsica, where Etruscan-Carthaginian forces were forced to retreat by less numerous Phokian units, which proves the craftsmanship of Greek seamen."
 ######
 #####Illyrian
 ######
 illyrian_philosophy:0 "Illyrian Traditions"
 illyrian_philosophy_desc:0 "The Illyrian warriors had many advantages, but loyalty was hardly one of them. The mercenaries of this region were known to switch sides when least expected. The home of the Illyrian people was very similar to Greece, so it's no wonder that they also fell in love with the sea and became good sailors."
 tradition_unlock_requirement_illyric:0 "You don't have enough population of Illyrian or Castelieran descent to unlock the tradition."
 #New Traditions
 illyrian_path_1:0 "Sibyna"
 illyrian_path_1_desc:0 "One of the Illyrian's iconic weapons was the Sibyna, a short but very heavy javelin that was used for hunting bears, but it was also perfect for humans."
 illyrian_path_2a:0 "Illyrian Ships"
 illyrian_path_2a_desc:0 "Illyrian vassels were mostly small and fast ships for raiding purposes. After roman conquest many of the designs were adapted by the romans like the liburna."
 illyrian_path_3a:0 "Illyrian Pirates"
 illyrian_path_3a_desc:0 "Sadly the long coast where you could hide entire fleet with addition of lucrative trade routes mena that the main illyrian source of income was piracy. Some kingdoms had really impressive pirate fleets."
 illyrian_path_2b:0 "Illyrian Chariots"
 illyrian_path_2b_desc:0 "On the vase from the period it is clearly visible that the Illyrians used chariots in a light version and in surprisingly large amounts for the region. They had a crew of two people, i.e. a javelin and a coachman."
 illyrian_path_3b:0 "Unreliable Mercenaries"
 illyrian_path_3b_desc:0 "Illyrians were really skilled fighters but they also had a reputation for being very unreliable, changing side at the first sign of weakness. Despire this they were a frequent sight on the iron age battlefields."
 illyrian_path_4b:0 "Pirate Hideouts"
 illyrian_path_4b_desc:0 "Illyrians built hill-forts as places of refuge (and perhaps as dwellings) such as Tilurium and Setovia of the Delmatae. Most enclosures were round or oval with very few exceptions for other shapes and the largest two were 200 meters across while most are not anything more than fortified blockhouses."
 illyrian_path_5b:0 "Castello"
 illyrian_path_5b_desc:0 "The people of Histria in contrast to their southern neighbours lived in huge Mycenean-like fortresses. This testifies to the intense contacts between both cultures even in an earlier period."
 ######
 #####Arabian
 ######
 arabian_philosophy:0 "Arabian Traditions"
 arabian_philosophy_desc:0 "After the fall of the Bronze Age, the tribes of the desert nomads spread like locusts throughout the Middle East. After the weakening of the great empires, no one was able to stop their attacks, and only divisions saved the Akkadians and the inhabitants of the Levant from total domination of the invaders."
 tradition_unlock_requirement_arabian:0 "You don't have enough population of Aramean or Arabian descent to unlock the tradition."
 #New Traditions
 arabian_path_1:0 "Clans of the Desert"
 arabian_path_1_desc:0 "The history of Arabian Deserts is a history of clan based structures. Aramean sheikhdoms, jewish tribes or arab clans all corners of arabia looked similar. Those clans often used mobile units like chariots or cavalry to raid each other or fight reemerging empires like Assyria. "
 arabian_path_2:0 "David vs Goliath"
 arabian_path_2_desc:0 "The famous duel was not as uneven as we think. The west semitic tribes like arameans or jews trained in use of a sling since childhood and ancient slings were way different than modern toys. Rocks were carefully chosen with aerodynamic properties in mindand could reach impressive speed easily cracking weaker armour."
 arabian_path_3a:0 "Arabs at Qarqar"
 arabian_path_3a_desc:0 "The first appearence of Arab unit was at the battle of Qarqar where Quedarites lend their support for anti-assyrian coalition in form of unit of camel cavalry. Horses naturally fear camels and those animals can magazine water in their bodies. Afterwards camels were used in both mounts and baggage train."
 arabian_path_4a:0 "Desert Fighters"
 arabian_path_4a_desc:0 "Arabs were often used as mercanaries for whoever could pay them. They were pretty reliable and could provide high quality units. There were no pan-arab unity at the time so often one clan was paid to fight against another (like Ghassanids and Lakhmids)."
 arabian_path_5a:0 "Sabeans"
 arabian_path_5a_desc:0 "The Sabeans were not one nation but a series of kingdoms on the route from Egypt to India, which made them rich on trade flowing through their ports. They were led by the semi-religious leader Mukarrib and fought fiercely among themselves for supremacy."
 arabian_path_3b:0 "Ahlamu or Amurru"
 arabian_path_3b_desc:0 "For most familiar with the Bronze Age, the name Amurru should quickly evoke memories of the fall of the Ur empire. Well, scientists are beginning to wonder whether the names Aram and Amurru are not the same people, which would indicate that the peoples of the syrian hills have plagued Mesopotamia for a longer time than the Iron Age."
 arabian_path_4b:0 "Aram-Damascus"
 arabian_path_4b_desc:0 "Due to its location, Damascus quickly became the main opponent of Assyria in the region, and its armies, due to greater funds than other Aramaic states, were better equipped. He was a member of every anti-Assyrian coalition and the main point of resistance on the road to Assyrian domination in the Levant."
 ######
 #####Nuragic
 ######
 nuragian_philosophy:0 "Nuragic Traditions"
 nuragian_philosophy_desc:0 "If we are fans of historical correctness, then if we are looking for warriors similar to the Vikings from pop culture, we should not look at Scandinavia but at ancient Sardinia, where the civilization of warriors with horned helmets who were the terror of the Mediterranean world flourished from the early Bronze Age."
 tradition_unlock_requirement_occidental:0 "You don't have enough population of Nuragian descent to unlock the tradition."
 #New Traditions
 nuragian_path_1:0 "Sardinian Warrior"
 nuragian_path_1_desc:0 "The typical Sardinian warrior was lightly armored and equipped with a long double-edged sword and round shield. The use of bow was widespread on Sardinia  because of presence of the forests."
 nuragian_path_2a:0 "Nuragian Vassels"
 nuragian_path_2a_desc:0 "Nuragians prefered viking style vassels with wooden figures in the front and sides to make them look terrifying. Those were more fast boats meant for coastal raids or attacking merchants than ship to ship combat."
 nuragian_path_3a:0 "Shardana"
 nuragian_path_3a_desc:0 "Shardana from egyptian records and nuragians of Sardinia are most likely one and the same culture group. Shardana appear in the Amarna records as sea raiders and mercenaries."
 nuragian_path_4a:0 "Sea Peoples"
 nuragian_path_4a_desc:0 "Traces of Nuragian attacks are all over Mediterrainean. Their architecture traces can be found even as far as the holy land (little version of Nurhage)."
 nuragian_path_2b:0 "Tin Sources"
 nuragian_path_2b_desc:0 "Normally the swords and more advanced weponry is rare among the people of the period but Sarinia have Tin mines and because of that Nuragian warriors usually had better equipment."
 nuragian_path_3b:0 "Nurhage"
 nuragian_path_3b_desc:0 "Nurhage are basicly big castle looking structures. Their defensive purpose is undisputed but because of presence of ceremonial pools inside many claim that they also functioned as temples (theocratic system maybe?)."
 nuragian_path_4b:0 "Balearic Slingers"
 nuragian_path_4b_desc:0 "Perhaps the best known slingers unit in the ancient world. Lightly armoured and able to throw projectiles with enormous speeds they were more formitable than their appearence suggested."
 