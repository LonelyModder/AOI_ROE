 ia_scirmishers_desc:0 "Usually equipped with throwing spears or slings and light armour. Their task is to screen the area ahead of the main force and herass the enemy."
 ia_archers_desc:0 "Bows are a powerfull wepon able to hurt enemies over large distances but requires many years of training. Thats why bowmen are so expensive."  
 ia_warriors_desc:0 "Lightly armoured undisciplined units. Usually pesants without proper training in military formations. They lack discipline and are inferior to better equipped units." 
 ia_lightinfantry_desc:0 "Weakerly armed troops. The lack of heavy armor gives them mobility on the battlefield. They can move quickly." 
 ia_heavyinfantry_desc:0 "Troops equipperd in heavy armour, usually provided by the state. They are more disciplined and can utilized formations."
 ia_hoplites_desc:0 "Heavily armoured units equipped in long spears and large shields. On battlefield they form impenetrable line but are weak against attacks from the side and the rear."
 ia_lightcavalry_desc:0 "Lightly armoured cavalrymen usually equipped in javelins and tasked with herassing the enemy troops. They will not be able to hold against better armoured oponents."
 ia_heavycavalry_desc:0 "Well armed cavalrymen tasked with keeping the enemy from surrounding the infantry formation from the flank. They can also perform flanking maneuver themselves forcing enemy to retreat."
 ia_horsearchers_desc:0 "Cavlarymen armed with bows. Their horses are usually faster which makes them troublesome. Sometimes they even can shoot while retreating."
 ia_lancers_desc:0 "Heavily armoured riders usually from the eastern countries equipped with long spears called lances. They use their greater reach and the momentum of their charge to break enemy formation."
 ia_chariots_desc:0 "A cart drawn by a pair of horses, in the past two-axle, which later evolved into a single-axle. Usually a driver and an archer ride in it."
 ia_camels_desc:0 "Unit that appeared during iron age utilizing camels as mounts. Horses generally dislike the camels smell which negatively impacts their behaviour."
 ia_elephants_desc:0 "Large beasts living in africa and india. They are usually put in front of an army and their task is to break throu the formation of the enemy."
 
