 gw_effect_first_temple:0 "Salomons Temple"
 gw_effect_first_temple_DESC:0 "Built by king Salomon the temple was the holiest place for the jewish people. Acording to the descriptions temple was built same as egyptian ones with the windowless inner sanctum  called Holy of Holies where the Ark of Covenant was kept (or as in smaller temples in Judah from the period a statue of Yahweh)."
 gw_effect_great_pyramid:0 "Giza Pyramid Complex"
 gw_effect_great_pyramid_DESC:0 "Giza Pyramid Complex was built during the Old Kingdom period two millenia ago. Egyptians believe that as long as a person is remembered, spirit can live in the afterlife and that was the purpose of building pyramids. They served not only as tombs but also as temples where people could pray and make offerings to the deceased pharoh."