 ia_colonize_button_confirm_t:0 "Colonization"
 ia_colonize_button_confirm_desc:0 "Are you sure you want to colonize the territory?"

 CURRENT_DATE_TOOLTIP:2 "#T Current Date#!\n Date in the mod is counted since the fall of the City of Ugarit and the Bronze Age Collapse.\n\n#TF The degraded one trembles, and the low one is torn to pieces. Our food in the threshing floors is sacked and the vineyards are also destroyed. Our city is sacked, and may you know it! - Report to ruler of Carchemish about fall of Ugarit#!"
 DATE_TOOLTIP:0 "[Date.GetTimeUntil]\n years since Bronze Age Collapse."
 THE_WORLD:1 "[GetDateString]#T  BAC"
 THE_WORLD_TOOLTIP:1 "#T Current Date#!\n BAC stands for Bronze Age Collapse. The year 437 BAC (1185 BC) was chosen as the starting date because 437 years before the city of Ugarit fell to the Luccan invaders marking the beginning of the famous great offensive of the Sea Peoples against Egypt."
 
 
 AlinorINTRO:0 "#T Latium#!\nDifficulty: #Y HARD#!\n\n During the Middle Iron Age Latium starts under the influence of Etruscan League. The research done shows that the region was densly populated hich can explain the increasing rise in importance over time. The original story about the founding of Rome claims that the city was founded by the Arcadian merchant called Romos."
 Alinor:0 "Latium"
 Alinor2:0 "Latium"
 EtruscanLeagueINTRO:0 "#T Etruscan League#!\nDifficulty: #Y EASY#!\n\n In this period the Etruscan League is the unquestioned hegemon of the italian peninsula. The Etruscan Leagues (acording to romans there were originally three of them Po league, Campanian and the main in Tuscany) control the area from Po valley to the Campania. League itself consist of 12 city-states that loosely cooperate with eachother."
 EtruscanLeague:0 "Etruscan League"
 EtruscanLeague2:0 "Etruscan League"
 LeponticConfederationINTRO:0 "#T Lepontic Confederation#!\nDifficulty: #Y Medium#!\n\n The Celts were penetrating the Alps since the Bronze Age Collapse. The new waves of invaders managed to take control over the area around modern Milan. During Middle Iron Age under the legendary Brennus (it can be a title since many celtic leaders use it we are not sure) a new wave of migrants arrived the Lepontie tribes."
 LeponticConfederation:0 "Lepontic Confederation"
 LeponticConfederation2:0 "Lepontic Confederation"
 
 owns_any_neighboring_province:0 "Owns any neighbour province"
