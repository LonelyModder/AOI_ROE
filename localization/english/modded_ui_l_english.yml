 ia_colonize_button_confirm_t:0 "Colonization"
 ia_colonize_button_confirm_desc:0 "Are you sure you want to colonize the territory?"

 CURRENT_DATE_TOOLTIP:2 "#T Current Date#!\n Date in the mod is counted since the fall of the City of Ugarit (1190 BC is year 1 in game) and the Bronze Age Collapse.\n\n#TF The degraded one trembles, and the low one is torn to pieces. Our food in the threshing floors is sacked and the vineyards are also destroyed. Our city is sacked, and may you know it! - Report to ruler of Carchemish about fall of Ugarit#!"
 DATE_TOOLTIP:0 "[Date.GetTimeUntil]\n years since Bronze Age Collapse."
 THE_WORLD:1 "[GetDateString]#T  BAC"
 THE_WORLD_TOOLTIP:1 "#T Current Date#!\n BAC stands for Bronze Age Collapse. The year 1185 BC was chosen as the starting date because 437 years before the city of Ugarit fell to the Luccan invaders marking the beginning of the famous great offensive of the Sea Peoples against Egypt."
 
 
 AlinorINTRO:0 "#T Latium#!\nDifficulty: #Y EASY#!\n\n During the Middle Iron Age Latium starts under the influence of Etruscan League. The research done shows that the region was densly populated hich can explain the increasing rise in importance over time. The original story about the founding of Rome claims that the city was founded by the Arcadian merchant called Romos."
 Alinor:0 "Latium"
 Alinor2:0 "Latium"
 MacedonINTRO:0 "#T Macedon#!\nDifficulty: #Y MEDIUM#!\n\n Acording to legend Macedon was founded by the Caranos of the Argead dynasty. Argeads erive their lineage from the legendary hero Heracles and claim to be one of the branches of the Heraclidae dynasty who's members escaped the dynastic strife in Argos and decided to found their own realm. Macedon is surrounded by hostile tribes of Illyrian and Thracian origin. Their greek neighbours view them more as barbarians than fellow greeks. Yet it's a sizable kingdom with capable leaders that one day may compete for hegemony in hellas."
 Macedon:0 "Macedon"
 Macedon2:0 "Macedon"
 KushINTRO:0 "#T Kush#!\nDifficulty: #Y MEDIUM#!\n\n Kush after the centuries of Egyptian ocupation is finally united under king Kashta. In comparison their great nemesis is in the middle of a civil war between the two branches of the family of migrants who managed to take the throne of egypt from locals under the threat of arms. This gives the Kushites the opportunity that may never repeat itself. Will nubian sit one day on the throne of Rameses the Great? "
 Kush:0 "Kush"
 Kush2:0 "Kush"
 AssyriaINTRO:0 "#T Assyria#!\nDifficulty: #Y EASY#!\n\n During the events of the Bronze Age Collapse Assyria was luckier than the nations near the Mediterrainean Coast and wasn't on the path of the migrating Sea Peoples. Yet after the fall of Levant Aramean tribes filled the power vacuum and spread throuthout the middle east. After years of conflict Assyrians managed to halt their advance and began the counteroffensive. Now with their homeland secured and army in full strangth they found themselves as the last great brone age power left standing. That means no one stands before Assyria and the conquest of Mesopotamia. Time to give the title King of the World meaning!."
 Assyria:0 "Assyria"
 Assyria2:0 "Assyria"
 LydiaINTRO:0 "#T Lydia#!\nDifficulty: #Y MEDIUM#!\n\n Lydia lately is in a difficult position surrounded by enemies with more on their way as rumors spread about potential nomadic invasion. Yet the kingdom is strong, united and maybe not as lonely as they think they are. Thou Phrygians are scarry they have issues of their own and with enemies fighting each other Lydia will have unique opportunity to dominate anatolian peninsula."
 Lydia:0 "Lydia"
 Lydia2:0 "Lydia"
 CarthageINTRO:0 "#T Carthage#!\nDifficulty: #Y MEDIUM#!\n\n Founded barely century ago Tyrian colony in Carthage was meant to serve as an important stop on a vital trade route from Levant to Spain. Because of it's location city grew in size, importance and it's leaders began to have thair own ambitions for the western mediterrainean region. The New City as it's name is translated will face Berber tribes, rival cities (especially it's archnemesis Utica) and in time even another power from italian peninsula. With the Tannit's blessing Qart Hadasht will prevail!"
 Carthage:0 "Carthage"
 Carthage2:0 "Carthage"
 
