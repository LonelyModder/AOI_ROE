 patch_notes:0 "Part VII: New City"
 patch_notes_text:0 "What's new:\n- North African region with 329 new land provinces to conquer (4112 provinces on the map in total). \n- Fixing bugs like missiong diety files in non state supported religions and wrong religions in character definitions."
 
 #Modifier text
 osasis:0 "Oasis"
 osasis_desc:0 "The only water source in the desert and also the only permanent place to live in this harsh enviroment."
 greek_mercs_in_lydia:0 "Greek Mercenaries"
 desc_greek_mercs_in_lydia:0 "Greeks are one of the best mercenaries in the world. Their infantry is best in the region. Lately they proposed a dicount on their services."
 lepontic_invasion_modifier:0 "Mobilisation"
 desc_lepontic_invasion_modifier:0 "Under extreme circumstances all available males (and in some cultures like scythians females) are mobilised for war."
 scythian_invasion_modifier:0 "Scythian Expetition"
 desc_scythian_invasion_modifier:0 "Taking Lydian offer Scythian host crossed the Caucasus and invaded Anatolia. Scythians thou didn't intend to withdrew after assisting the Lydians but the ultimate goal was invasion of the former Phrygian territory."
 cymmerian_invasion_modifier:0 "Horde Invades"
 desc_cymmerian_invasion_modifier:0 "Our country was invaded by the steppe horde and is the subject of their brutal tactics. The morale is shaken and soldiers spread the tale of their atrocities."
 latium_1_starts:0 "Latins Mobilise"
 desc_latium_1_starts:0 "Latin tribes are capable of mobilising large amount of warriors in a short amount of time thanks to the system of obligations. Each clan and city is obliged to send agreed amount of warriors."
 latium_1_victory:0 "Italy Conquered!"
 desc_latium_1_victory:0 "Rome just became the hegemon of Italian peninsula. Roman armies march unoposed from Arritim to Rhegion. Their superiority is undisputed."
 macedon_1_starts:0 "Age of Reforms"
 desc_macedon_1_starts:0 "Macedon was onthe outskirts of a greek world and because of this got influenced also by their thracian neighbours and thats why southern greeks believed macedonians to be thracians. To comete for the hegemony over the greeks macedon will have to modernise and than maybe one day king of macedon will be ruling over Greece."
 macedon_1_victory:0 "New Hegemon"
 desc_macedon_1_victory:0 "From Byzantion to Sparta all Greeks bow down before the new king of the Greeks. Once called barbarians, macedonians proven their Heraclidae heritage by conquering all of Hellas."
 kush_1_starts:0 "Kushite Invasion"
 desc_kush_1_starts:0 "Kushites lived for hundreds of years under the shadow of their northern neighbours. Egyptian reign began with military outposts and expeditions but soon they started to colonize the area and they even created a series of fortresses to maintain control over it. But now egypt is in a state of civil war and Kush have a new rulers. Leaders of Napata looked at the pharohs with envy. They started to reform Nubia into a proper centralised state and now seeing the oportunity that may not repeat itself kushites started war preparations."
 kush_1_victory:0 "New Pharoh"
 desc_kush_1_victory:0 "For the first time in history nubian sits on the throne and wears the double crown of upper and lower kemet. The new era for all under the uniting rays of Amun begins."
 assyria_1_starts:0 "Assyrian Duty"
 desc_assyria_1_starts:0 "For the Assyrian waging yearly war against heatens is his religious duty. This became especially important in an age where assyria had enemies on all sides."
 assyria_1_victory:0 "Power of Ashur"
 desc_assyria_1_victory:0 "With a great effort Assyria managed to defeat it's enemies and bring order back to the Middle East. All defeated kings now bow before the viceking of Ashur."
 lydia_1_starts:0 "War Preparations"
 desc_lydia_1_starts:0 "For a long time the Phrygians ruled on the ruins of the Hittite Empire unchallenged. Soon this will change. The lates rumors say the hordes of cymmerians are crossing the Caucasus and clash is inevitable. We need to be prepared."
 lydia_1_victory:0 "Lords of Asia"
 desc_lydia_1_victory:0 "After long and bloody conflict the future of Lydia is safe in our hands. We forced Phrygia into submission, we chased the Thracians and Cymmerians out of Asia Minor and n,ow we indeed are the masters of the peninsula."
 carthage_1_starts:0 "Masters of the Seas"
 desc_carthage_1_starts:0 "Founded barely century ago Tyrian colony in Carthage was meant to serve as an important stop on a vital trade route from Levant to Spain. Because of it's location city grew in size, importance and it's leaders began to have thair own ambitions for the western mediterrainean region."
 carthage_1_victory:0 "African Power"
 desc_carthage_1_victory:0 "Despite all odds Carthage managed to unite the western colonies and take control over western mediterrainean sea. Will it be enaugh to assure safety to the growing republic? There will be more challenges ahead but we will face them with the biggest fleet in the west!"
 lydian_economic_boom:0 "Economic Boom"
 desc_lydian_economic_boom:0 "Thanks to the new reform people can now clearly set the price for the trade goods. Also we are able to better calculate how much taxes can be collected from a given area. Our economy and taxation are getting better."
 roman_colony:0 "Roman Colony"
 desc_roman_colony:0 "Roman veterans were entitled to a land grant after discharge. The roman colonies were created to not only serve as settlements for retiring soldiers but also as a source of expirienced veterans in case of revolt. They were practically strongholds filled with war veterans. System was supposingly existing since the year after the very founding of Rome."
 roman_draft_active:0 "Roman Draft"
 desc_roman_draft_active:0 "Romans had unique ability to mobilize their entire society in times of war. This sometimes gave their enemies impression that roman state never run out of soldiers."
 draft_ordered:0 "Recent Draft"
 desc_draft_ordered:0 "The mobilization was recently announced and another one should not be announced so soon otherwise it may have negative consequences for the economy."
 egyptian_fields:0 "Egyptian Fields"
 desc_egyptian_fields:0 "Nile is a very predictable river with regular floods that when used effectively provide large harvests. Thats why Egypt is sometimes called the Vread Basket. Egyptian Harvests could feed the entire Meditrrainean."
 african_fields:0 "African Fields"
 desc_african_fields:0 "North Africa is the second most fertile region in the Mediterrainean after Egypt. It supplies and the western grain markets and is the second most lucrative regional business after dyes. "
 tyre_island:0 "Old Tyre"
 desc_tyre_island:0 "Tyre consists of two parts: the New Tyre, mainland settlement and the Old Tyre, heavily fortified island just of the phoenician coast. The tyrians thanks to that isle could easily face much bigger army and defend the isle for years. To capture the city one would have to bring bigger navy and all the biggest navies belonged to phoenicians."
 walls_of_jerusalem:0 "Walls of Jerusalem"
 desc_walls_of_jerusalem:0 "Jerusalem is not only a city but also a natural fortress built on a hill with little vegetation around it that can be cut down in need be depriving the enemy of building material for siege engines."
 
 #Special Decisions
 order_draft:0 "Order Draft"
 order_draft_desc:0 "In times of need Rome is able to mobilise large amounts of soldiers surprising it's oponents. Thats why it never runs out of soldiers. Taking eternal city is the only way to prevent it but to get there enemy must defeat army after army."
 
 #Special Traits
 wifeofamun:0 "Wife of Amun"
 wifeofamun_desc:1 "This female character holds important position in kemetic church. Her official task is to watchover the holy statue of Amun, but unofficially she is often a spy of a crown as title was usually reserved for women connected to royal dynasty."